# c8s e2e on SNP bare metal (Phase 1 of the confidential-CI north star).
#
# One runs-on: confidential-bm job: boot a fresh MEASURED RKE2-node-as-CVM (the
# k8s node IS the SEV-SNP guest), assert it's a genuine confidential guest, then
# install the c8s commit under test IN-CLUSTER and prove it converges.
#
# WHY in-cluster (not "reach the apiserver from the runner"): the host cluster's
# Cilium and the in-CVM rke2 BOTH use 10.42.0.0/16, and under KubeVirt bridge
# networking (forced — masquerade breaks under SNP) the guest node IP lands in
# that overlapping range, so routing to <cvm>:6443 is a nondeterministic CIDR
# collision (even virt-handler times out). The team's real pattern is Flux
# installing c8s FROM INSIDE the cluster; we mirror that: drive everything
# through the serial console (100% reliable) against the guest's LOCAL apiserver.
#
# Install path: rke2's built-in helm-controller installs the per-commit OCI chart
# ghcr.io/confidential-dot-ai/charts/c8s:0.1.0-g<short-sha> (private -> needs a
# ghcr read:packages credential, GHCR_USER/GHCR_TOKEN secrets).
#
# The confidential proof is c8s's own: CDS reaches Ready only if the node emits a
# genuine SNP report whose launch measurement == the golden value we pin
# (cds.measurements). So "CDS Ready" == the node is an attested SNP TEE booted
# from the exact measured image. Fail-closed by c8s itself.
#
# Scope (deliberate): ratlsMesh + nriImagePolicy OFF for first-green — the mesh
# needs kernel netfilter modules the monolithic guest kernel lacks
# (CONFIG_NETFILTER_XT_SET/_MATCH_OWNER), and nri enforcement is the Phase-1b
# marquee. First-green = c8s installs + operator/cds/attestation-api Ready +
# CDS attested.
#
# Cluster prereqs (once, via c8s-e2e/cluster-prep/apply.sh): rke2 rootdisk PVC,
# /var/lib/igvm/rke2.igvm, rke2-image-refs CM, bm-e2e RBAC (console).
name: e2e-c8s-snp
on:
  workflow_dispatch:
    inputs:
      c8s_ref:
        description: c8s commit to test (a chart tag charts/c8s:0.1.0-g<short-sha> must exist)
        required: false
        default: main
concurrency: c8s-snp-e2e # virtctl console is exclusive per VMI; one lane at a time

jobs:
  e2e:
    runs-on: confidential-bm
    timeout-minutes: 55
    env:
      NS: confai-images
      VM: c8s-e2e-${{ github.run_id }}
    steps:
      - name: checkout c8s at pinned ref (for the short-sha -> chart tag)
        uses: actions/checkout@v4
        with:
          repository: confidential-dot-ai/c8s
          ref: ${{ inputs.c8s_ref }}
          path: c8s

      - name: tools (kubectl + virtctl v1.7.0 + expect)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends jq ca-certificates bsdutils expect
          mkdir -p "$PWD/bin"
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o bin/kubectl
          curl -fsSL https://github.com/kubevirt/kubevirt/releases/download/v1.7.0/virtctl-v1.7.0-linux-amd64 -o bin/virtctl
          echo "ec6ee5619290e19590f3f9cd8b8dfce1affe0380eaaca77b3784c7b1acea86a6  bin/virtctl" | sha256sum -c -
          chmod +x bin/*
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: resolve refs (rke2 image + golden digest + short sha)
        run: |
          set -euo pipefail
          for k in rootPvc igvmFile launchDigestSmp4; do
            v=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath="{.data.$k}")
            [ -n "$v" ] || { echo "::error::rke2-image-refs missing $k — run cluster-prep/apply.sh"; exit 1; }
          done
          SHORT=$(cd c8s && git rev-parse --short=7 HEAD)
          {
            echo "ROOTPVC=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath='{.data.rootPvc}')"
            echo "IGVMFILE=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath='{.data.igvmFile}')"
            echo "GOLDEN=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath='{.data.launchDigestSmp4}')"
            echo "SHORT=$SHORT"
            echo "CHART_VER=0.1.0-g$SHORT"
          } >> "$GITHUB_ENV"
          echo "c8s $SHORT -> chart 0.1.0-g$SHORT"

      - name: boot the RKE2-node CVM (shared rootdisk)
        run: |
          set -euo pipefail
          kubectl apply -f - <<EOF
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: $VM
            namespace: $NS
          spec:
            runStrategy: Always
            template:
              metadata:
                labels:
                  vm.kubevirt.io/name: $VM
                annotations:
                  igvm.confidential.ai/file: "$IGVMFILE"
                  hooks.kubevirt.io/hookSidecars: '[{"image":"ghcr.io/confidential-dot-ai/igvm-hook-sidecar@sha256:7450bb136bfc4d9434a7c1eb9e478ab3237e7d9acf5c211e7d080f2008b01ba0","imagePullPolicy":"IfNotPresent","args":["--version","v1alpha3"],"pvc":{"name":"igvm-files","volumePath":"/igvm","sharedComputePath":"/var/run/igvm"}}]'
              spec:
                nodeSelector:
                  confidential.ai/sev-snp: "true"
                domain:
                  cpu:
                    model: EPYC-Genoa
                    cores: 4              # MUST be 4: image measured at smp=4
                  memory:
                    guest: 16Gi
                  resources:
                    requests:
                      memory: 16Gi
                  firmware:
                    bootloader:
                      efi:
                        secureBoot: false
                  launchSecurity:
                    snp: {}
                  devices:
                    disks:
                      - name: rootdisk
                        disk:
                          bus: virtio
                    interfaces:
                      - name: default
                        bridge: {}        # masquerade is broken under SNP
                    rng: {}
                networks:
                  - name: default
                    pod: {}
                volumes:
                  - name: rootdisk
                    persistentVolumeClaim:
                      claimName: $ROOTPVC
          EOF
          echo "waiting for VMI Running..."
          for i in $(seq 1 70); do
            PHASE=$(kubectl -n "$NS" get vmi "$VM" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$PHASE" = Running ] && break
            sleep 6
          done
          [ "$PHASE" = Running ] || { kubectl -n "$NS" describe vmi "$VM" | tail -30; echo "::error::VMI not Running"; exit 1; }
          POD=$(kubectl -n "$NS" get pods -l vm.kubevirt.io/name="$VM" -o name | head -1); POD=${POD#pod/}
          echo "POD=$POD" >> "$GITHUB_ENV"
          echo "VMI Running (launcher $POD)"

      - name: assert genuine confidential boot (qemu sev-snp-guest + IGVM sha)
        run: |
          set -uo pipefail
          echo '--- qemu cmdline ---'
          kubectl -n "$NS" exec "$POD" -c compute -- sh -c \
            "tr '\0' '\n' < /proc/\$(pgrep -f qemu-system | head -1)/cmdline | grep -cE 'sev-snp-guest'" | tee /tmp/snp.cnt
          kubectl -n "$NS" exec "$POD" -c compute -- sh -c "sha256sum /var/run/igvm/rke2.igvm 2>/dev/null" || true
          [ "$(cat /tmp/snp.cnt 2>/dev/null)" = "1" ] && echo 'OK: genuine sev-snp-guest' || { echo '::error::not a sev-snp-guest'; exit 1; }

      - name: console helpers (expect send + in-guest exec/read)
        run: |
          set -euo pipefail
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster h --server="https://kubernetes.default.svc" --certificate-authority="$SA/ca.crt" --kubeconfig=/tmp/host.kubeconfig >/dev/null
          kubectl config set-credentials s --token="$(cat $SA/token)" --kubeconfig=/tmp/host.kubeconfig >/dev/null
          kubectl config set-context h --cluster=h --user=s -n "$NS" --kubeconfig=/tmp/host.kubeconfig >/dev/null
          kubectl config use-context h --kubeconfig=/tmp/host.kubeconfig >/dev/null
          # expect: give virtctl a real pty, connect (needs ~5s), type GUESTCMD, detach
          cat > /tmp/send.exp <<'EXP'
          set timeout 6
          spawn virtctl --kubeconfig /tmp/host.kubeconfig console $env(VM) -n $env(NS)
          expect timeout
          send -- "\r"
          expect timeout
          send -- "$env(GUESTCMD)\r"
          set timeout 4
          expect timeout
          send -- "\x1d"
          EXP
          # gsend "<cmd>": type one command into the guest shell (fire-and-forget)
          cat > /tmp/gsend.sh <<'SH'
          GUESTCMD="$1" VM="$VM" NS="$NS" timeout -k5 45 expect -f /tmp/send.exp >/dev/null 2>&1
          SH
          echo "helpers written"

      # ONE in-guest driver does the whole install+wait+report, emitting @@markers@@
      # to the serial console. The runner delivers it once (chunked base64 over the
      # console), launches it, then POLLS guest-console-log (fast, host-side) for the
      # markers — instead of dozens of slow per-command console round-trips.
      # (Pattern from NVIDIA/aicr: do the work in-cluster, read the result out-of-band.)
      - name: install c8s in-cluster via in-guest driver (rke2 helm-controller, OCI chart)
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -uo pipefail
          export VM NS
          [ -n "${GHCR_TOKEN:-}" ] || { echo "::error::GHCR_TOKEN secret not set (needed to pull the private chart)"; exit 1; }
          echo "waiting for guest autologin shell (~180s; boot blocks on networkd-wait-online)..."
          for i in $(seq 1 30); do
            kubectl -n "$NS" logs "pod/$POD" -c guest-console-log 2>/dev/null | grep -q 'automatic login' && { echo "shell ready"; break; }
            sleep 15
          done
          # secret + HelmChart, base64'd, BAKED into the driver (decoded in-guest)
          DCJ=$(printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w0)" | base64 -w0)
          SEC_B64=$(printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: ghcr-oci\n  namespace: kube-system\ntype: kubernetes.io/dockerconfigjson\ndata:\n  .dockerconfigjson: %s\n' "$DCJ" | base64 -w0)
          HC_B64=$(cat <<EOF | base64 -w0
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
            name: c8s
            namespace: kube-system
          spec:
            chart: oci://ghcr.io/confidential-dot-ai/charts/c8s
            version: "$CHART_VER"
            targetNamespace: c8s-system
            createNamespace: true
            dockerRegistrySecret:
              name: ghcr-oci
            valuesContent: |
              cds:
                measurements: ["$GOLDEN"]
              ratlsMesh:
                enabled: false
              nriImagePolicy:
                enabled: false
              tlsLb:
                hostPort:
                  enabled: false
          EOF
          )
          # build the driver ($-escaped so only SEC_B64/HC_B64 expand here; the rest runs in-guest)
          cat > /tmp/drive.sh <<DRIVER
          #!/bin/bash
          set +e
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          K=/var/lib/rancher/rke2/bin/kubectl
          say(){ echo "@@\$1@@"; }
          say DRIVE_START
          for i in \$(seq 1 40); do \$K get nodes --no-headers 2>/dev/null | grep -q ' Ready' && break; sleep 6; done
          \$K get nodes --no-headers 2>&1 | grep -q ' Ready' && say NODE_READY || { \$K get nodes 2>&1 | sed 's/^/@@ND /;s/\$/@@/'; say FAIL_NODE; exit 0; }
          printf %s '$SEC_B64' | base64 -d | \$K apply -f - >/dev/null 2>&1 && say SECRET_OK || say FAIL_SECRET
          printf %s '$HC_B64' | base64 -d | \$K apply -f - 2>&1 | sed 's/^/@@HCAPPLY /;s/\$/@@/'
          for i in \$(seq 1 40); do
            s=\$(\$K -n kube-system get job helm-install-c8s -o jsonpath='{.status.succeeded}' 2>/dev/null)
            echo "@@HJOB \$i succ=\${s:-0}@@"
            \$K -n kube-system logs job/helm-install-c8s --tail=3 2>/dev/null | sed 's/^/@@HLOG /;s/\$/@@/'
            [ "\$s" = "1" ] && { say HELM_DONE; break; }
            sleep 12
          done
          for i in \$(seq 1 40); do
            \$K -n c8s-system get pods --no-headers 2>&1 | sed 's/^/@@POD /;s/\$/@@/'
            r=\$(\$K -n c8s-system get pods -l app.kubernetes.io/name=cds -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null)
            echo "@@CDSR \$i ready=\${r:-none}@@"
            echo "\$r" | grep -qw true && { say CDS_READY; break; }
            sleep 12
          done
          \$K -n c8s-system get events --sort-by=.lastTimestamp 2>&1 | tail -12 | sed 's/^/@@EV /;s/\$/@@/'
          say DRIVE_END
          DRIVER
          # deliver the driver into the guest (chunked base64 -> file -> decode)
          DB=$(base64 -w0 /tmp/drive.sh)
          echo "delivering driver (${#DB} b64 chars) in chunks..."
          bash /tmp/gsend.sh "rm -f /tmp/d.b64"
          printf '%s' "$DB" | fold -w900 | while IFS= read -r c; do bash /tmp/gsend.sh "printf %s '$c' >>/tmp/d.b64"; done
          bash /tmp/gsend.sh "base64 -d /tmp/d.b64 >/tmp/drive.sh 2>/dev/ttyS0 && echo @@DRIVERDECODED@@ || echo @@FAIL_DECODE@@"
          sleep 4
          if ! kubectl -n "$NS" logs "pod/$POD" -c guest-console-log 2>/dev/null | grep -q '@@DRIVERDECODED@@'; then
            echo "::warning::driver decode marker not seen yet; launching anyway"
          fi
          # launch the driver detached; its stdout -> ttyS0 -> guest-console-log
          bash /tmp/gsend.sh "nohup bash /tmp/drive.sh >/dev/ttyS0 2>&1 </dev/null & echo @@LAUNCHED@@"
          echo "--- polling guest-console-log for driver progress ---"
          seen=""; ok=""
          for i in $(seq 1 90); do   # ~15 min, fast host-side polls
            LOG=$(kubectl -n "$NS" logs "pod/$POD" -c guest-console-log 2>/dev/null | tr -cd '[:print:]\n' | sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g')
            NEW=$(printf '%s' "$LOG" | grep -oE '@@[^@]{1,140}@@' | sed 's/@@//g')
            # print only newly-appeared marker lines
            comm -13 <(printf '%s\n' "$seen" | sort -u) <(printf '%s\n' "$NEW" | sort -u) 2>/dev/null | grep -vE '^$' | sed 's/^/  · /'
            seen="$NEW"
            printf '%s' "$LOG" | grep -q '@@CDS_READY@@' && { ok=1; echo "CDS_READY seen"; break; }
            printf '%s' "$LOG" | grep -qE '@@FAIL_' && { echo "driver reported a failure marker"; break; }
            printf '%s' "$LOG" | grep -q '@@DRIVE_END@@' && { echo "driver ended without CDS_READY"; break; }
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error::c8s did not converge (no CDS_READY). Full driver console output:"
            kubectl -n "$NS" logs "pod/$POD" -c guest-console-log 2>/dev/null | tr -cd '[:print:]\n' | sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' | grep -oE '@@.*@@' | tail -50
            exit 1
          fi
          echo "✅ CDS attested: node is a genuine SEV-SNP TEE booted from the measured rke2 image (launch digest == $GOLDEN); c8s $SHORT installed + converged in-cluster"

      - name: diagnostics (on failure)
        if: failure()
        run: |
          export VM NS POD
          kubectl -n "$NS" logs "pod/$POD" -c guest-console-log 2>/dev/null | tr -cd '[:print:]\n' | sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' | tail -50 || true

      - name: "teardown (always — tmpfs CVM: deleting the VM is total)"
        if: always()
        run: kubectl -n "$NS" delete vm "$VM" --ignore-not-found --wait=true
