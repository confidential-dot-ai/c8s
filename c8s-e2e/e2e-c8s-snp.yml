# c8s e2e on SNP bare metal (Phase 1 of the confidential-CI north star).
#
# One runs-on: confidential-bm job: boot a fresh measured RKE2-node CVM
# (node-as-CVM — the K8s node IS the SEV-SNP guest), attest it fail-closed
# ENFORCING the golden launch digest, scrape the in-CVM kubeconfig over the
# serial console, install c8s AT THE PINNED COMMIT (per-commit :<short-sha>
# images + the chart embedded in the checkout), run the repo's own e2e +
# c8s cds verify, tear down. The CVM is tmpfs-ephemeral: deleting the VM is a
# total teardown.
#
# Scope notes (deliberate, 2026-07-14):
#  - ratlsMesh DISABLED: the current rke2 guest kernel (monolithic) lacks
#    CONFIG_NETFILTER_XT_SET + CONFIG_NETFILTER_XT_MATCH_OWNER, so the mesh's
#    iptables can't program (helm --wait would time out). Re-enable + add
#    mesh-cw-enforcement.sh once base-images ships the kernel fix.
#  - --image-tag <sha> + --resolve-digests=false + -f digests: attestation-api
#    versions independently (no c8s-sha tags), so we resolve digests ourselves
#    with crane and pin attestation-api@main (recorded in the run log).
#  - No --image-pull-secret: all chart images are public on ghcr today.
#
# Prereqs on the cluster: c8s-e2e/cluster-prep/apply.sh (rke2 rootdisk PVC,
# /var/lib/igvm/rke2.igvm, rke2-image-refs ConfigMap, RBAC, egress :6443).
name: e2e-c8s-snp
on:
  workflow_dispatch:
    inputs:
      c8s_ref:
        description: c8s commit to test (full sha or ref; images must exist for its 7-char sha)
        required: false
        default: main
concurrency: c8s-snp-e2e # virtctl console is exclusive per VMI; one lane at a time

jobs:
  e2e:
    runs-on: confidential-bm
    timeout-minutes: 50
    env:
      NS: confai-images
      VM: c8s-e2e-${{ github.run_id }}
      CVMKC: /tmp/cvm.kubeconfig
    steps:
      - name: checkout c8s at pinned ref
        uses: actions/checkout@v4
        with:
          repository: confidential-dot-ai/c8s
          ref: ${{ inputs.c8s_ref }}
          path: c8s

      - name: tools (kubectl, virtctl v1.7.0 pinned to host KubeVirt, helm, crane deps)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libtss2-dev jq openssl ca-certificates bsdutils
          mkdir -p "$PWD/bin"
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o bin/kubectl
          curl -fsSL https://github.com/kubevirt/kubevirt/releases/download/v1.7.0/virtctl-v1.7.0-linux-amd64 -o bin/virtctl
          echo "ec6ee5619290e19590f3f9cd8b8dfce1affe0380eaaca77b3784c7b1acea86a6  bin/virtctl" | sha256sum -c -
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz --strip-components=1 -C bin linux-amd64/helm
          curl -fsSL https://github.com/confidential-dot-ai/attestation-rs/releases/download/v0.4.0/attestation-cli -o bin/attestation-cli
          chmod +x bin/*
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v5
        with:
          go-version-file: c8s/go.mod
          cache-dependency-path: c8s/go.sum

      - name: crane
        run: go install github.com/google/go-containerregistry/cmd/crane@latest && echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: read producer refs (rke2-image-refs — fail loud, the golden digest is load-bearing)
        run: |
          set -euo pipefail
          for k in rootPvc igvmFile launchDigestSmp4 image; do
            v=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath="{.data.$k}")
            [ -n "$v" ] || { echo "::error::rke2-image-refs missing key $k — run c8s-e2e/cluster-prep/apply.sh"; exit 1; }
            echo "$k=$v"
          done
          {
            echo "ROOTPVC=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath='{.data.rootPvc}')"
            echo "IGVMFILE=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath='{.data.igvmFile}')"
            echo "GOLDEN=$(kubectl -n "$NS" get cm rke2-image-refs -o jsonpath='{.data.launchDigestSmp4}')"
          } >> "$GITHUB_ENV"

      - name: boot the RKE2-node CVM (shared readonly rootdisk — no clone)
        run: |
          set -euo pipefail
          kubectl apply -f - <<EOF
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: $VM
            namespace: $NS
          spec:
            runStrategy: Always
            template:
              metadata:
                labels:
                  vm.kubevirt.io/name: $VM
                annotations:
                  igvm.confidential.ai/file: "$IGVMFILE"
                  hooks.kubevirt.io/hookSidecars: '[{"image":"ghcr.io/confidential-dot-ai/igvm-hook-sidecar@sha256:7450bb136bfc4d9434a7c1eb9e478ab3237e7d9acf5c211e7d080f2008b01ba0","imagePullPolicy":"IfNotPresent","args":["--version","v1alpha3"],"pvc":{"name":"igvm-files","volumePath":"/igvm","sharedComputePath":"/var/run/igvm"}}]'
              spec:
                nodeSelector:
                  confidential.ai/sev-snp: "true"
                domain:
                  cpu:
                    model: EPYC-Genoa
                    cores: 4              # MUST be 4: image measured at smp=4
                  memory:
                    guest: 16Gi           # containerd cache lives in tmpfs (no data disk in Phase 1)
                  resources:
                    requests:
                      memory: 16Gi
                  firmware:
                    bootloader:
                      efi:
                        secureBoot: false
                  launchSecurity:
                    snp: {}
                  devices:
                    disks:
                      - name: rootdisk
                        disk:
                          bus: virtio
                          readonly: true # verity rootfs never writes; lets concurrent VMs share the RWO PVC (qemu shared lock)
                    interfaces:
                      - name: default
                        bridge: {}        # masquerade is broken under SNP
                    rng: {}
                networks:
                  - name: default
                    pod: {}
                volumes:
                  - name: rootdisk
                    persistentVolumeClaim:
                      claimName: $ROOTPVC
          EOF
          echo "waiting for VMI Running..."
          for i in $(seq 1 70); do
            PHASE=$(kubectl -n "$NS" get vmi "$VM" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$PHASE" = Running ] && break
            sleep 6
          done
          [ "$PHASE" = Running ] || { kubectl -n "$NS" describe vmi "$VM" | tail -30; echo "::error::VMI not Running"; exit 1; }
          IP=$(kubectl -n "$NS" get vmi "$VM" -o jsonpath='{.status.interfaces[0].ipAddress}')
          [ -n "$IP" ] || { echo "::error::VMI has no IP"; exit 1; }
          echo "IP=$IP" >> "$GITHUB_ENV"
          echo "VMI Running at $IP"

      # NOTE: no pre-install attest — the rke2 node image does NOT bake
      # attestation-api (unlike base-cpu-image); in node-as-CVM mode it arrives
      # as the c8s DaemonSet. Attestation is enforced post-install below.
      - name: scrape in-CVM kubeconfig over serial console (retry — flakiest link)
        run: |
          set -uo pipefail
          # virtctl may not fall back to in-cluster config like kubectl — synthesize
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          HOSTKC=/tmp/host.kubeconfig
          kubectl config set-cluster host --server="https://kubernetes.default.svc" --certificate-authority="$SA/ca.crt" --kubeconfig="$HOSTKC" >/dev/null
          kubectl config set-credentials sa --token="$(cat $SA/token)" --kubeconfig="$HOSTKC" >/dev/null
          kubectl config set-context host --cluster=host --user=sa --namespace="$NS" --kubeconfig="$HOSTKC" >/dev/null
          kubectl config use-context host --kubeconfig="$HOSTKC" >/dev/null
          virtctl --kubeconfig "$HOSTKC" version || true   # proves client + apiserver path
          scrape() {
            # OUTER timeout is load-bearing: run 2 wedged >45min inside this
            # pipeline with only the inner timeout — never trust it alone
            (sleep 2; printf "\n"; sleep 2;
             printf "echo KCFG-A; base64 -w0 /etc/rancher/rke2/rke2.yaml; echo; echo KCFG-Z\n"; sleep 8) \
              | timeout -k 5 50 script -qec "timeout 40 virtctl --kubeconfig $HOSTKC console $VM -n $NS" /dev/null || true
          }
          b64=
          for i in $(seq 1 15); do   # rke2-server writes rke2.yaml minutes after boot
            echo "scrape attempt $i: connecting..."
            out=$(scrape)
            echo "scrape attempt $i: got ${#out} bytes from console"
            [ -n "$out" ] && printf '%s' "$out" | tr -cd '[:print:]\n' | tail -c 300 | sed 's/^/  console| /'
            b64=$(python3 -c '
          import re, sys
          s = sys.stdin.read().replace("\r", "")
          s = re.sub(r"\x1b\][^\x07\x1b]*(\x07|\x1b\\\\)", "", s)
          s = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]", "", s)
          s = re.sub(r"\x1b[=>]", "", s)
          pairs = re.findall(r"KCFG-A(.*?)KCFG-Z", s, re.S)
          if pairs:
              print("".join(c for c in pairs[-1] if c.isalnum() or c in "+/="))
          ' <<<"$out")
            [ -n "$b64" ] && printf '%s' "$b64" | base64 -d 2>/dev/null | head -1 | grep -q '^apiVersion:' && break
            b64=; sleep 20
          done
          [ -n "$b64" ] || { echo "::error::could not scrape kubeconfig from console"; exit 1; }
          printf '%s' "$b64" | base64 -d | python3 -c '
          import re, sys
          server = sys.argv[1]
          for line in sys.stdin:
              line = line.rstrip("\n")
              line = re.sub(r"^(\s*server:\s*)\S+$", lambda m: m.group(1) + server, line)
              print(line)
          ' "https://$IP:6443" > "$CVMKC"
          chmod 600 "$CVMKC"
          echo "waiting for the in-CVM node Ready..."
          for i in $(seq 1 40); do
            kubectl --kubeconfig "$CVMKC" get nodes 2>/dev/null | grep -q ' Ready' && break
            sleep 10
          done
          kubectl --kubeconfig "$CVMKC" get nodes -o wide

      - name: build c8s CLI at the pinned commit
        run: |
          set -euo pipefail
          cd c8s
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/confidential-dot-ai/c8s/internal/version.Version=$(git describe --tags --always --dirty)" -o build/c8s ./cmd/c8s
          ./build/c8s --help >/dev/null && echo "c8s CLI built: $(git rev-parse --short HEAD)"

      - name: resolve component digests + write ci-values.yaml
        run: |
          set -euo pipefail
          SHORT=$(cd c8s && git rev-parse --short=7 HEAD); echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          OP=$(crane digest ghcr.io/confidential-dot-ai/c8s-operator:$SHORT)
          CDS=$(crane digest ghcr.io/confidential-dot-ai/cds:$SHORT)
          MESH=$(crane digest ghcr.io/confidential-dot-ai/ratls-mesh:$SHORT)
          NRI=$(crane digest ghcr.io/confidential-dot-ai/nri-image-policy:$SHORT)
          ATT=$(crane digest ghcr.io/confidential-dot-ai/attestation-api:main)
          NGINX_D=$(crane digest docker.io/library/nginx:1.27-alpine)
          CURL_D=$(crane digest docker.io/curlimages/curl:8.8.0)
          echo "attestation-api pinned from floating :main -> $ATT (record for reproducibility)"
          cat > ci-values.yaml <<EOF
          image:
            digest: "$OP"
          cds:
            image:
              digest: "$CDS"
            measurements: ["$GOLDEN"]
          attestationApi:
            image:
              digest: "$ATT"
          ratlsMesh:
            enabled: false   # guest kernel lacks xt_set/xt_owner (monolithic) — mesh iptables can't program
            image:
              digest: "$MESH"
          nriImagePolicy:
            image:
              digest: "$NRI"
            bootstrapAllowlist:
              deriveComponents: true
              digests:
                "$NGINX_D": "nginx:1.27-alpine"
                "$CURL_D": "curlimages/curl:8.8.0"
          tlsLb:
            hostPort:
              enabled: false # rke2-ingress-nginx owns hostPort 443 on the single node
          EOF
          cat ci-values.yaml

      - name: c8s install at the pinned commit (inside the attested CVM)
        run: |
          set -euo pipefail
          openssl ecparam -name prime256v1 -genkey -noout -out operator.key
          openssl ec -in operator.key -pubout -out operator.pub
          export KUBECONFIG="$CVMKC"
          ./c8s/build/c8s install \
            --namespace c8s-system --release c8s \
            --single-node --cvm-mode node --hardware-platform sev-snp \
            --image-tag "$SHORT" --resolve-digests=false \
            --operator-keys operator.pub \
            -f ci-values.yaml
          kubectl -n c8s-system get pods -o wide

      - name: attest — genuine SNP + fresh nonce + ENFORCED golden launch digest
        run: |
          set -euo pipefail
          export KUBECONFIG="$CVMKC"
          # the c8s attestation-api DaemonSet reads the node CVM's /dev/sev-guest;
          # reach it via port-forward (tunnels over the :6443 carve-out)
          kubectl -n c8s-system rollout status ds -l app.kubernetes.io/name=attestation-api --timeout=180s 2>/dev/null \
            || kubectl -n c8s-system get ds
          SVC=$(kubectl -n c8s-system get svc -o name | grep -i attestation | head -1)
          [ -n "$SVC" ] || { echo "::error::no attestation-api service in c8s-system"; kubectl -n c8s-system get svc; exit 1; }
          PORT=$(kubectl -n c8s-system get "$SVC" -o jsonpath='{.spec.ports[0].port}')
          kubectl -n c8s-system port-forward "$SVC" "18400:$PORT" >/dev/null 2>&1 &
          PF=$!; sleep 3
          head -c 32 /dev/urandom > n.bin
          B64=$(base64 -w0 n.bin); HEX=$(od -An -tx1 n.bin | tr -d ' \n')
          curl -s -m20 -H 'Content-Type: application/json' -d "{\"report_data\":\"$B64\"}" \
            "http://127.0.0.1:18400/attest" -o att.json -w 'POST /attest -> HTTP %{http_code}\n'
          kill $PF 2>/dev/null || true
          # AMD KDS rate-limits VCEK fetches (429) — retry verify with backoff
          for i in 1 2 3 4 5; do
            if attestation-cli verify --expected-report-data "$HEX" < att.json > claims.json 2>verify.err; then break; fi
            grep -qi '429\|rate' verify.err && { echo "KDS backoff ($i)"; sleep $((i*25)); continue; }
            cat verify.err; exit 1
          done
          jq . claims.json || cat claims.json
          jq -e '.platform=="snp" and .signature_valid==true and .report_data_match==true and (.debug_allowed//false)==false' claims.json >/dev/null \
            || { echo "::error::attestation claims failed"; exit 1; }
          LD=$(jq -r '.launch_digest // empty' claims.json)
          [ -n "$LD" ] || { echo "::error::no launch_digest in claims"; exit 1; }
          [ "$LD" = "$GOLDEN" ] || { echo "::error::launch digest mismatch: attested=$LD golden=$GOLDEN"; exit 1; }
          echo "launch digest ENFORCED: $LD == golden (fresh nonce, non-debug, genuine SNP)"

      - name: e2e — confidential workload smoke + cw-label-policy
        run: |
          set -euo pipefail
          export KUBECONFIG="$CVMKC"
          kubectl apply -f c8s/samples/nginx-confidential-pod.yaml
          kubectl -n default rollout status deploy/demo-nginx --timeout=180s
          cd c8s && ./test/e2e/cw-label-policy.sh

      - name: e2e — c8s cds verify (real attestation, enforced measurement)
        run: |
          set -euo pipefail
          export KUBECONFIG="$CVMKC"
          kubectl -n c8s-system port-forward svc/c8s-cds 8443:8443 >/dev/null 2>&1 &
          PF=$!; sleep 3
          rc=1
          for i in 1 2 3; do   # KDS flake tolerance
            if ./c8s/build/c8s cds verify https://localhost:8443 --measurements "$GOLDEN" -o json | tee cds-verify.json; then rc=0; break; fi
            sleep $((i*20))
          done
          kill $PF 2>/dev/null || true
          [ $rc -eq 0 ] || { echo "::error::c8s cds verify failed"; exit 1; }
          echo "CDS verified as a genuine TEE running the golden measurement"

      - name: diagnostics (on failure)
        if: failure()
        run: |
          kubectl -n "$NS" describe vmi "$VM" 2>/dev/null | tail -40 || true
          kubectl --kubeconfig "$CVMKC" -n c8s-system get pods -o wide 2>/dev/null || true
          kubectl --kubeconfig "$CVMKC" -n c8s-system get events --sort-by=.lastTimestamp 2>/dev/null | tail -30 || true

      - name: "teardown (always — tmpfs CVM: deleting the VM is total)"
        if: always()
        run: kubectl -n "$NS" delete vm "$VM" --ignore-not-found --wait=true
