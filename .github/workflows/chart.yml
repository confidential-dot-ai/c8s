name: Helm Chart

on:
  push:
    branches: [main, "feat/**"]
    paths: &chart-paths
      - "internal/helmchart/**"
      - ".github/workflows/chart.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths: *chart-paths

env:
  REGISTRY: ghcr.io
  CHART_REPO: ghcr.io/confidential-dot-ai/charts
  # The four installable shape charts (internal/helmchart/<shape>). lib/ is a
  # library chart sync.sh vendors into each of them; it is never packaged.
  SHAPES: "pod node-cloud node-metal node-image"

jobs:
  package:
    name: Lint, package & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - name: Vendor shared chart sources
        run: bash internal/helmchart/sync.sh

      - name: Lint & template charts
        run: .github/scripts/chart-verify.sh

      - name: Helm package
        run: |
          mkdir -p dist
          for shape in $SHAPES; do
            # chart-version.sh derives <Chart.yaml version>-g<short-sha> per chart.
            CHART_DIR="internal/helmchart/$shape" GITHUB_OUTPUT="$RUNNER_TEMP/ver-$shape" \
              .github/scripts/chart-version.sh
            version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/ver-$shape")"
            helm package "internal/helmchart/$shape" \
              --version "$version" \
              --app-version "$version" \
              -d dist/
          done

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            helm registry login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

      - name: Helm push
        if: github.event_name == 'push'
        run: |
          for shape in $SHAPES; do
            version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/ver-$shape")"
            helm push "dist/c8s-$shape-$version.tgz" \
              "oci://$CHART_REPO"
          done
