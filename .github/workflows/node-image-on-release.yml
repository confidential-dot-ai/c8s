# Publishing a release dispatches the node-image rebuild at that release's
# commit, so :<variant>[-cdi]-<short-sha> tags exist for the deployment
# re-pin (confidential-metal sync-c8s-pins) without a manual dispatch —
# v0.9.2 needed one by hand. The rebuild runs main's workflow, so it bakes
# main's current CONFOS_REF, not the release commit's; sync-c8s-pins takes
# that via --confos-ref. Components cds:<sha>/nri:<sha> were published by
# the commit's own main-push Docker run; the build fails loudly if not.
name: node image on release

on:
  release:
    types: [published]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch c8s-image at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')
          gh workflow run c8s-image-publish.yml --repo "$GITHUB_REPOSITORY" -f c8s_ref="${sha:0:7}"
          echo "dispatched c8s-image for ${TAG} (${sha:0:7})" >> "$GITHUB_STEP_SUMMARY"
