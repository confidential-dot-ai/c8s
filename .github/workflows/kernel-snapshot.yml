name: Kernel config snapshot

# Builds confos's hardened guest kernel with c8s's container.config fragment and
# publishes the resolved-config snapshot (confos's required+hardening baseline +
# the fragment, merged) as a downloadable artifact. This is the KERNEL HALF of
# the kata-guest-base build, decoupled: no osbuilder, no fetch.sh, no Docker /
# allowlist dependency — so it runs on ANY commit, unlike kata-guest-base.yml
# (which is chained behind the Docker workflow and only fires when Docker does).
#
# Two entrypoints:
#   workflow_dispatch — pull the snapshot for a commit on demand (e.g. to seed
#                       or refresh kata-guest-base/kernel/config-x86_64.snapshot).
#   workflow_call     — reuse from another workflow: the planned snapshot drift
#                       gate calls this, diffs the artifact against the committed
#                       lockfile, and fails on drift.
#

on:
  workflow_dispatch:
    inputs:
      confos_ref:
        description: confos commit/ref to build the kernel from (default = pinned)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      confos_ref:
        description: confos commit/ref to build the kernel from
        required: false
        type: string
        default: ""
    outputs:
      snapshot_sha256:
        description: sha256 of the resolved kernel-config snapshot
        value: ${{ jobs.kernel.outputs.snapshot_sha256 }}

permissions:
  contents: read

jobs:
  kernel:
    name: Build confos kernel + snapshot
    # Same self-hosted SEV-SNP host as kata-guest-base.yml: `confos kernel` runs
    # mkosi/nspawn under sudo for the kernel-builder sandbox, which can't run on
    # a user-namespaced GitHub-hosted runner.
    runs-on: the-machine
    outputs:
      snapshot_sha256: ${{ steps.kernel.outputs.snapshot-sha256 }}
    steps:
      # c8s -> ./c8s and confidential-os-builder -> ./confidential-os-builder,
      # mirroring kata-guest-base.yml so the cache keys (which hashFiles these
      # paths) match byte-for-byte.
      - name: Checkout c8s
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: c8s

      - name: Load measured-build pins
        id: pins
        env:
          CONFOS_REF_OVERRIDE: ${{ inputs.confos_ref }}
        run: |
          set -euo pipefail
          bash c8s/.github/scripts/pin-manifest.sh export \
            --manifest c8s/.github/build-pins.json \
            --domain kernel-snapshot \
            --format github-env \
            --confos-override "$CONFOS_REF_OVERRIDE" >> "$GITHUB_ENV"
          bash c8s/.github/scripts/pin-manifest.sh export \
            --manifest c8s/.github/build-pins.json \
            --domain kernel-snapshot \
            --format github-output \
            --confos-override "$CONFOS_REF_OVERRIDE" >> "$GITHUB_OUTPUT"

      - name: Checkout confidential-os-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confidential-os-builder

      # --- confos kernel-builder sandbox deps (mirror kata-guest-base.yml) ----
      - name: Setup uv (mkosi toolchain)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup mkosi
        # Local action accepts the exact ref resolved from the pin manifest.
        uses: ./c8s/.github/actions/setup-mkosi
        with:
          ref: ${{ steps.pins.outputs.mkosi }}

      - name: Install systemd-container (mkosi sandbox dep)
        run: sudo apt-get update && sudo apt-get install -y systemd-container

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Build guest kernel
        id: kernel
        uses: ./c8s/.github/actions/build-guest-kernel
        with:
          confos-ref: ${{ steps.pins.outputs.confos }}
          mkosi-ref: ${{ steps.pins.outputs.mkosi }}

      - name: Upload kernel-config snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-x86_64.snapshot
          path: c8s/kata-guest-base/kernel/config-x86_64.snapshot
          if-no-files-found: error
          overwrite: true
