# Reproducibility gate for the node image: PRs touching the image definition
# or its pins build the image TWICE (parallel legs, separate runners) and fail
# unless every measured value matches (c8s#264). Runs on EVERY PR and decides
# relevance itself — a paths: filter would leave the required `compare` check
# forever pending on unrelated PRs.
name: image repro gate
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: image-repro-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
      c8s_ref: ${{ steps.diff.outputs.c8s_ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            image=true  # manual dispatch: always run the full gate
          elif gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
                 --jq '.[].filename' \
               | grep -qE "^(node-guest-image/|\.github/workflows/(c8s-image(-publish)?|image-repro-gate)\.yml)"; then
            image=true
          else
            image=false
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Bake the same published components production uses: mkosi.sync's
          # own C8S_REF default, the single source of truth.
          ref=$(sed -n "s/^C8S_REF=\"\\\${C8S_REF:-\(.*\)}\"$/\1/p" node-guest-image/c8s/mkosi.sync)
          test -n "$ref"
          echo "c8s_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "image-relevant: $image (components at \`$ref\`)" >> "$GITHUB_STEP_SUMMARY"

      # PR code must never run with the production module-signing key. This
      # keypair is shared by both legs, used only in unpublished gate images,
      # and has no authority after those images are discarded.
      - name: Generate gate-only module-signing key
        if: steps.diff.outputs.image == 'true'
        run: |
          set -euo pipefail
          install -d -m 0700 gate-signing
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -subj "/CN=c8s image reproducibility gate/" \
            -days 1 -set_serial 1 \
            -keyout gate-signing/module-signing.key \
            -out gate-signing/module-signing.crt
          chmod 0600 gate-signing/module-signing.key

      - name: Share gate-only module-signing key
        if: steps.diff.outputs.image == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: module-signing-${{ github.run_id }}
          path: gate-signing
          if-no-files-found: error
          retention-days: 1
          # Full reruns replace it; failed-job reruns reuse the prior artifact.
          overwrite: true

  build-a:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/c8s-image.yml
    with:
      gate: true
      leg: a
      c8s_ref: ${{ needs.changes.outputs.c8s_ref }}
      gate_signing_artifact: module-signing-${{ github.run_id }}

  build-b:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/c8s-image.yml
    with:
      gate: true
      leg: b
      c8s_ref: ${{ needs.changes.outputs.c8s_ref }}
      gate_signing_artifact: module-signing-${{ github.run_id }}

  compare:
    # The required check: green fast on image-irrelevant PRs, otherwise only
    # after both legs built and every measured value matched.
    needs: [changes, build-a, build-b]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Nothing image-relevant changed
        if: needs.changes.outputs.image != 'true'
        run: echo "no image paths touched — gate not applicable" >> "$GITHUB_STEP_SUMMARY"
      - name: Legs must have succeeded
        if: needs.changes.outputs.image == 'true'
        env:
          A: ${{ needs.build-a.result }}
          B: ${{ needs.build-b.result }}
        run: |
          set -euo pipefail
          test "$A" = success && test "$B" = success || { echo "leg results: a=$A b=$B" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.image == 'true'
        with:
          pattern: gate-*-${{ github.run_id }}-*
          path: evidence
      - name: Every measured value must match
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, sys
          run_id = os.environ["GITHUB_RUN_ID"]
          fail = False
          lines = ["### image repro gate", "", "| platform | field | verdict |", "|---|---|---|"]
          for plat in ("tdx", "snp"):
              legs = {}
              for leg in ("a", "b"):
                  d = f"evidence/gate-rke2-{plat}-{run_id}-{leg}"
                  m = json.load(open(f"{d}/manifest.json"))
                  # The report timestamp is metadata, not a baked byte.
                  m.get("build", {}).pop("timestamp", None)
                  legs[leg] = (m, open(f"{d}/roothash").read().strip())
              (ma, ra), (mb, rb) = legs["a"], legs["b"]
              fail = fail or ma != mb or ra != rb
              lines.append(f"| {plat} | manifest (sans timestamp) | {'identical' if ma == mb else '**DIFFERS**'} |")
              lines.append(f"| {plat} | roothash `{ra[:12]}…` | {'identical' if ra == rb else '**DIFFERS**'} |")
              if ma != mb:
                  a_flat = json.dumps(ma, sort_keys=True, indent=0).splitlines()
                  b_flat = json.dumps(mb, sort_keys=True, indent=0).splitlines()
                  for line in sorted(set(a_flat) ^ set(b_flat)):
                      print(f"{plat} manifest delta: {line.strip()}", file=sys.stderr)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          sys.exit(1 if fail else 0)
          EOF
