# The tls-lb nginx image is a third-party pin (chart values tlsLb.nginx.image),
# so it never goes through the Go/grype scans of our own images. Scan the
# pinned digest for High/Critical CVEs on every change and weekly, so a fresh
# advisory against the pin surfaces as a red run rather than at the next audit.
name: tls-lb image scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: &paths
      - "internal/helmchart/c8s/values.yaml"
      - ".github/workflows/tls-lb-image-scan.yml"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned image
        id: image
        run: |
          set -euo pipefail
          repo=$(yq -r '.tlsLb.nginx.image.repository' internal/helmchart/c8s/values.yaml)
          digest=$(yq -r '.tlsLb.nginx.image.digest' internal/helmchart/c8s/values.yaml)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error file=internal/helmchart/c8s/values.yaml::tlsLb.nginx.image.digest must be a sha256 pin, got '$digest'"; exit 1
          fi
          echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Scan for High/Critical vulnerabilities
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.image.outputs.ref }}
          fail-build: true
          output-format: table
          severity-cutoff: high

      - name: Job summary
        if: always()
        run: |
          {
            echo "## tls-lb nginx image: ${{ steps.image.outputs.ref }}"
            echo '```'
            cat "${{ steps.scan.outputs.table }}" 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
