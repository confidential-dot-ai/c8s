# Watches the confos / attestation-rs source pins the measured builds ride
# and opens bump PRs when upstream main moves — never merges: each bump
# rolls a measurement, so a human owns the merge. The mkosi ref is not
# watched independently: it is scraped from the target confos commit's own
# base.yml, which keeps MinimumVersion= and the installed mkosi in lockstep
# by construction (the v27 bump had to move both by hand). The rewrite
# itself lives in .github/scripts/bump-pins.py — testable locally, and it
# FATALs when a pin site moved rather than shipping a half-bumped PR.
#
# One matrix leg per measurement domain, so each roll is its own PR:
#   node-image:  c8s-image.yml            (node rootfs / RTMR + SNP digests)
#   kata-guest:  kata-guest-base.yml + kernel-snapshot.yml (kata launch digest)
#
# Authentication setup:
# - Create a dedicated organization-owned GitHub App. Grant no organization or
#   account permissions and subscribe to no webhooks. Grant only repository
#   Contents, Pull requests, and Workflows read/write; Workflows is required
#   because these PRs edit workflow files. Install it only on repositories that
#   run pin-watch.
# - Store its client ID in the PIN_WATCH_APP_CLIENT_ID Actions variable and a
#   generated private key in the PIN_WATCH_APP_PRIVATE_KEY Actions secret. For
#   organization-level values, restrict both to the same selected repositories.
#
# A shared App private key can mint tokens for every App installation. Keep the
# installation and variable/secret allowlists identical and minimal, and rotate
# the key after suspected disclosure or compromise of any selected repository.
#
# When the client ID is present, the pinned action mints a short-lived token
# scoped to this repository. Checkout, push, and gh use that same token; PRs
# created with it start checks automatically, and the action revokes it in its
# post-step. A missing or invalid key fails closed.
# Leaving the client ID unset intentionally falls back to GITHUB_TOKEN, limited
# by the permissions below. The repository must enable "Allow GitHub Actions to
# create and approve pull requests"; resulting PR workflow runs await approval.
name: confos pin watch

on:
  schedule:
    - cron: "23 6 * * 1" # weekly; a no-op while the pins match upstream main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: confos-pin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: node-image
            files: .github/workflows/c8s-image.yml
          - domain: kata-guest
            files: .github/workflows/kata-guest-base.yml .github/workflows/kernel-snapshot.yml
    steps:
      - name: Create pin-watch GitHub App token
        id: pin-watch-app-token
        if: ${{ vars.PIN_WATCH_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIN_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Persist the same token used by gh so App-created PR updates also
          # trigger CI automatically; github.token remains the fallback.
          token: ${{ steps.pin-watch-app-token.outputs.token || github.token }}
      - name: Bump stale pins and open the PR
        env:
          GH_TOKEN: ${{ steps.pin-watch-app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          confos_record=$(gh api repos/confidential-dot-ai/confidential-os-builder/commits/main \
            --jq '[.sha, .commit.committer.date[0:10]] | @tsv')
          IFS=$'\t' read -r confos confos_date <<<"$confos_record"
          attest_record=$(gh api repos/confidential-dot-ai/attestation-rs/commits/main \
            --jq '[.sha, .commit.committer.date[0:10]] | @tsv')
          IFS=$'\t' read -r attest attest_date <<<"$attest_record"
          # A source-derived date keeps the proposed tree stable across reruns.
          pin_date=$confos_date
          if [[ $attest_date > $pin_date ]]; then
            pin_date=$attest_date
          fi
          mkosi_line=$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/confidential-dot-ai/confidential-os-builder/${confos}/.github/workflows/base.yml" |
            grep -oE 'systemd/mkosi@[0-9a-f]{40} # v[0-9.]+')
          out=$(.github/scripts/bump-pins.py \
            --confos "$confos" --attest "$attest" \
            --mkosi-sha "$(grep -oE '[0-9a-f]{40}' <<<"$mkosi_line")" \
            --mkosi-ver "$(grep -oE 'v[0-9.]+$' <<<"$mkosi_line")" \
            --date "$pin_date" \
            ${{ matrix.files }})
          echo "$out"
          grep -q '^no-drift$' <<<"$out" && exit 0
          branch="pin-watch/${{ matrix.domain }}-refs"
          title="build(${{ matrix.domain }}): pin-watch bump — confos ${confos:0:7}, attestation-rs ${attest:0:7}"
          git config user.name "confos-pin-watch"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git commit -am "$title"
          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          local_tree=$(git rev-parse 'HEAD^{tree}')
          remote_oid=
          remote_tree=
          if git fetch --no-tags origin \
            "+refs/heads/$branch:refs/remotes/origin/$branch"; then
            remote_oid=$(git rev-parse "refs/remotes/origin/$branch")
            remote_tree=$(git rev-parse "${remote_oid}^{tree}")
            if [ "$local_tree" = "$remote_tree" ] && [ -n "$open_pr" ]; then
              echo "pin-watch PR #$open_pr already has the proposed tree"
              exit 0
            fi
          fi
          if [ -z "$remote_oid" ]; then
            git push origin "HEAD:refs/heads/$branch"
          elif [ "$local_tree" != "$remote_tree" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_oid" \
              origin "HEAD:refs/heads/$branch"
          fi
          if [ -z "$open_pr" ]; then
            gh pr create --title "$title" --body "Automated pin-watch bump to confos main \`${confos:0:9}\` / attestation-rs main \`${attest:0:9}\`, mkosi \`${mkosi_line#systemd/mkosi@}\` scraped from that confos commit's base.yml so the MinimumVersion= lockstep holds by construction. Rolls the affected measurements — review the upstream logs before merging, and run the repro gate. With the default GITHUB_TOKEN fallback, approve the PR's workflow run; GitHub App-created PR checks start automatically."
          fi
