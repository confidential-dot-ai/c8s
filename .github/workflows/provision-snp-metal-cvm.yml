# ═══════════════════════════════════════════════════════════════════════════
# PROVISION the standing snp-metal-cvm ARC runner — the metal twin of azure-cvm.
# ═══════════════════════════════════════════════════════════════════════════
# The lib rail is ONE mechanism on N substrates: ARC + confidential nodes, the
# runner pod lands in the TEE. azure-cvm = ARC on an AKS confidential node pool
# (provision-azure-cvm.yml, built + proven). This is the same thing on metal:
# ARC on the rke2 INSIDE a KubeVirt SNP guest. Spike-proven (run 29791698959).
#
# WHY THIS LOOKS DIFFERENT FROM provision-azure-cvm.yml: azure gets `az aks
# get-credentials` → direct kubectl → `helm install`. Metal has NO host-reachable
# apiserver (host Cilium + in-guest rke2 both on 10.42/16 — the CIDR collision
# that forces the console). So we CONSOLE-INSTALL ARC into a STANDING CVM (via
# cvm-e2e's proven console driver with keep_alive=true). After bootstrap the
# in-guest listener polls GitHub over egress — GitHub is the control plane, the
# host never touches the guest apiserver again.
#
# ONE-TIME, dispatch-only. Re-dispatch to reconcile / re-bootstrap after a VM
# restart (runStrategy:Always restarts the VM, but its tmpfs+verity guest loses
# the ARC install → re-run this). The VM is labelled ci.confidential.ai/standing
# so cvm-e2e's reaper spares it. After this, `runs-on: snp-metal-cvm` schedules a
# job onto an ephemeral runner pod inside the SNP guest (scale-to-zero).
#
# SECRET REQUIRED: ARC_APP_PRIVATE_KEY = the PEM for GitHub App 4309649
# (confidential-ci-runners; SAME app as azure-cvm + cvm-launcher — no new access).
#
# ⚠️ KNOWN GAP (console transport): the App PEM is base64'd into the payload and
# travels the serial console → it lands UNSCRUBBED in guest-console-log + the
# Actions log (a base64-chunk-split secret isn't scrubbable). Same gap the spike
# and every console payload has; the fix is the in-guest HTTP agent (primitive
# v2, research/guest-transport.md), which retires console secret transit. Until
# then this is the accepted dev-sandbox posture (the App can be rotated).
name: provision-snp-metal-cvm
on:
  workflow_dispatch:
    inputs:
      max_runners:
        description: 'max concurrent runner pods in the guest. Default 1: the standing CVM is ONE 4-core/16Gi node — 2 concurrent in-guest rust compiles OOM it (both metal cells died when attestation-rs + kettle merges landed together, runs 29854690919/29854809091). One job at a time; concurrent lib merges queue. azure-cvm can be >1 because AKS gives each pod its own node.'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    outputs:
      b64: ${{ steps.p.outputs.b64 }}
    steps:
      - id: p
        env:
          APP_ID: '4309649'
          APP_INSTALLATION_ID: '146850802'
          ARC_APP_PRIVATE_KEY: ${{ secrets.ARC_APP_PRIVATE_KEY }}
          MAXR: ${{ inputs.max_runners }}
        run: |
          set -euo pipefail
          [ -n "${ARC_APP_PRIVATE_KEY:-}" ] || { echo "::error::secret ARC_APP_PRIVATE_KEY (App 4309649 PEM) is not set — add it before first provision"; exit 1; }
          PEM_B64=$(printf '%s' "$ARC_APP_PRIVATE_KEY" | base64 -w0)
          CHART=oci://ghcr.io/actions/actions-runner-controller-charts
          # payload runs as root IN the guest. rke2 ships helm-controller (HelmChart
          # CRD) — no helm binary needed, the same path c8s installs through. $K is
          # cvm-e2e's in-guest kubectl; say() is defined by the driver preamble.
          cat > p.sh <<PAYLOAD
          # ARC pods need PodSecurity=privileged (same as c8s-system; without it the
          # replicaset can't create a pod: deploy 0/1, rs 1/0 — spike run 2).
          \$K create ns arc-systems >/dev/null 2>&1; \$K create ns arc-runners >/dev/null 2>&1
          for ns in arc-systems arc-runners; do \$K label ns \$ns pod-security.kubernetes.io/enforce=privileged pod-security.kubernetes.io/warn=privileged pod-security.kubernetes.io/audit=privileged --overwrite >/dev/null 2>&1; done
          say NS_PRIVILEGED
          # App creds secret ARC consumes (App auth: id / installation / private key)
          printf '%s' '$PEM_B64' | base64 -d > /tmp/arc.pem
          \$K -n arc-runners create secret generic arc-app \
            --from-literal=github_app_id='$APP_ID' \
            --from-literal=github_app_installation_id='$APP_INSTALLATION_ID' \
            --from-file=github_app_private_key=/tmp/arc.pem >/dev/null 2>&1 && say SECRET_OK || say FAIL_SECRET
          rm -f /tmp/arc.pem
          # 1) ARC controller
          printf 'apiVersion: helm.cattle.io/v1\nkind: HelmChart\nmetadata:\n  name: arc\n  namespace: kube-system\nspec:\n  chart: $CHART/gha-runner-scale-set-controller\n  version: "0.14.2"\n  targetNamespace: arc-systems\n  createNamespace: true\n' | \$K apply -f - 2>&1 | sed 's/^/@@CTL /;s/\$/@@/'
          CTLOK=0
          for i in \$(seq 1 45); do
            dep=\$(\$K -n arc-systems get deploy -o jsonpath='{range .items[*]}{.metadata.name}={.status.availableReplicas}/{.status.replicas} {end}' 2>/dev/null)
            echo "@@CTLW \$i deploy=\${dep:-none}@@"
            printf '%s' "\$dep" | grep -qE '=1/1' && { CTLOK=1; say CTL_UP; break; }
            sleep 12
          done
          if [ "\$CTLOK" != "1" ]; then
            \$K -n kube-system logs job/helm-install-arc --tail=25 2>&1 | sed 's/^/@@HJLOG /;s/\$/@@/'
            \$K -n arc-systems get events --field-selector reason=FailedCreate --sort-by=.lastTimestamp 2>&1 | tail -4 | sed 's/^/@@RSEV /;s/\$/@@/'
            say FAIL_CONTROLLER; exit 0
          fi
          # 2) the STANDING scale set: snp-metal-cvm, scale-to-zero (minRunners:0).
          # runner overlay = privileged + /dev/sev-guest (reads the SNP report = in
          # the TEE) + root (RUNNER_ALLOW_RUNASROOT/runAsUser:0) so jobs can apt-install
          # libtss2 etc. — the azure-cvm overlay pattern, on metal.
          printf 'apiVersion: helm.cattle.io/v1\nkind: HelmChart\nmetadata:\n  name: snp-metal-cvm\n  namespace: kube-system\nspec:\n  chart: $CHART/gha-runner-scale-set\n  version: "0.14.2"\n  targetNamespace: arc-runners\n  createNamespace: true\n  valuesContent: |\n    githubConfigUrl: https://github.com/confidential-dot-ai\n    githubConfigSecret: arc-app\n    runnerScaleSetName: snp-metal-cvm\n    minRunners: 0\n    maxRunners: $MAXR\n    template:\n      spec:\n        containers:\n          - name: runner\n            image: ghcr.io/actions/actions-runner:latest\n            command: ["/home/runner/run.sh"]\n            env:\n              - name: RUNNER_ALLOW_RUNASROOT\n                value: "1"\n            securityContext:\n              privileged: true\n              runAsUser: 0\n            volumeMounts:\n              - name: sev\n                mountPath: /dev/sev-guest\n        volumes:\n          - name: sev\n            hostPath:\n              path: /dev/sev-guest\n' | \$K apply -f - 2>&1 | sed 's/^/@@SS /;s/\$/@@/'
          # 3) GATE: the listener authenticates to github + polls => "Getting next
          # message" — the scale set is live and registered (scaled to zero; a runner
          # pod only materialises when a job is dispatched to runs-on: snp-metal-cvm).
          LOK=0
          for i in \$(seq 1 40); do
            LP=\$(\$K -n arc-systems get pods --no-headers 2>/dev/null | grep -i listener | awk '{print \$1" "\$3}')
            echo "@@LST \$i: \${LP:-none}@@"
            L=\$(\$K -n arc-systems get pods -o name 2>/dev/null | grep -i listener | head -1)
            [ -n "\$L" ] && \$K -n arc-systems logs "\$L" --tail=3 2>/dev/null | grep -q 'Getting next message' && { LOK=1; say LISTENER_REGISTERED; break; }
            sleep 12
          done
          [ "\$LOK" = "1" ] || { \$K -n arc-systems get pods 2>&1 | sed 's/^/@@DBG /;s/\$/@@/'; say FAIL_LISTENER; exit 0; }
          say PAYLOAD_OK
          PAYLOAD
          echo "b64=$(base64 -w0 p.sh)" >> "$GITHUB_OUTPUT"

  # boot a STANDING rke2-node CVM (stable name, reaper-exempt, no teardown) and
  # console-deliver the ARC install into it. Reuses the proven cvm-e2e primitive.
  provision:
    needs: payload
    uses: ./.github/workflows/cvm-e2e.yml
    with:
      platform: snp-metal
      runner: cvm-launcher
      flavor: rke2-node
      keep_alive: true
      vm_name: snp-metal-cvm
      payload_b64: ${{ needs.payload.outputs.b64 }}
      timeout_minutes: 45
    secrets: inherit
