# ═══════════════════════════════════════════════════════════════════════════
# CONSUMER: c8s — the flagship payload ("install c8s + prove a cw workload runs")
# ═══════════════════════════════════════════════════════════════════════════
#
# This file owns only WHAT to test (the c8s payload) and WHEN (the trigger).
# WHERE (boot/attest/teardown a CVM per platform) belongs to the primitive:
#   .github/workflows/cvm-e2e.yml
#
# Adding a platform = adding a matrix row. Adding a DIFFERENT repo's test = a new
# consumer file with a different payload on the SAME primitive (e.g.
# attestation-rs: payload = `cargo test --features attest`, flavor: base-cpu).
#
# WHY NO OCI PULLS BY <sha> TAG: BOTH c8s publish workflows are PATH-GATED, so
# a given main commit may have neither artifact under its own sha:
#  - chart.yml (internal/helmchart/**): a Go-only merge publishes NO chart tag
#    0.1.0-g<sha> -> helm pull 404s, c8s-system stays empty (failure mode 1).
#  - docker.yml (source paths): a commit touching neither runs NO Docker at all,
#    so retag-unchanged never fires and NO :<sha> image tags exist -> pods sit
#    in ImagePullBackOff (failure mode 2; both observed live on main 70aea72).
# Resolution, per artifact kind:
#  - chart: packaged FROM SOURCE at the exact sha (anonymous codeload tarball),
#    inlined via the HelmChart CR's chartContent.
#  - images: can't be built from source here — resolve each component to the
#    NEWEST existing sha tag at-or-before the commit under test (= what that
#    commit would actually deploy). Under the post-merge trigger this is the
#    head sha itself, because workflow_run chains off a completed Docker run.
# No registry credential anywhere in this payload — the whole chain is public.
name: e2e-c8s
on:
  # Reusable: c8s's confidential-e2e.yml wrapper owns triggering (workflow_run
  # off Docker + dispatch). Vendored from confidential-ci for Phase 0 — a public
  # repo (c8s) cannot `uses:` a private repo's (confidential-ci) reusable
  # workflow, so the lane lives here and is called locally (`uses: ./`).
  workflow_call:
    inputs:
      c8s_ref:
        description: c8s commit to test
        type: string
        required: false
        default: main
      aa_ref:
        description: attestation-api image ref (tag or sha-<short>). Caller pins to a known-good build to avoid floating :main drift; default main keeps prior behaviour.
        type: string
        required: false
        default: main

concurrency:
  group: e2e-c8s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── ONE JOB PER PLATFORM ─────────────────────────────────────────────────
  # Vendored from confidential-ci. c8s is PUBLIC and confidential-ci is PRIVATE,
  # so a public repo cannot `uses:` the private reusable workflows and must keep
  # local copies. cvm-e2e.yml here is byte-identical to its original; edit
  # the original, then copy across. The TDX lifecycle is extracted into
  # ../actions/tdx-metal-e2e/action.yml, with c8s-local cidata bait/tripwire,
  # scratch-disk wiring and AppArmor checks guarded by node-guest-image-lint.
  # Preserve the separate staged and automatic-only exact-image wrappers
  # when re-vendoring that shared lifecycle. snp-metal-e2e.yml is
  # c8s-owned (the c8s payload lives in this
  # copy); edit it here.
  #
  # NOT a `matrix:`. A reusable-workflow `uses:` takes no expressions, so a
  # matrix would need an if-gated dispatcher, and because every row instantiates
  # the whole dispatcher that costs rows x jobs entries in the run tree, growing
  # quadratically. Plain jobs give one real entry each.
  #
  # THE AZURE ROWS ARE ABSENT ON PURPOSE, and this is the ONE way this file
  # differs from its confidential-ci original. Two hard blockers, both outside
  # CI: (1) the Entra federated credential trusts
  # `repo:confidential-dot-ai/confidential-ci`, so an OIDC token minted here is
  # rejected with AADSTS700213; granting c8s its own credential is an access
  # change, not a code change. (2) azure-tdx-e2e.yml reads
  # c8s-e2e/azure-tdx-driver.sh, which lives in confidential-ci and does not
  # exist in this repo. Until both are resolved, azure-snp and azure-tdx run
  # from confidential-ci on a schedule.

  snp-metal:
    permissions:
      contents: read
      # The CVM reaper asks GitHub whether the owning run finished; without this
      # it 403s silently and falls back to reaping on age alone.
      actions: read
    uses: ./.github/workflows/snp-metal-e2e.yml
    with:
      c8s_ref: ${{ inputs.c8s_ref }}

  tdx-metal:
    # Staged-stack regression only. Exact-image AppArmor acceptance is called
    # by c8s-image-publish.yml after publishing digest/measurement evidence.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tdx-metal-e2e.yml
    with:
      # Empty = the merge head, installed on the node image built from that
      # same commit. Only that pair works: the node image's measured base
      # allowlist (confidential-os-builder mkosi/base/mkosi.profiles/c8s/
      # image-policy.yaml.in) pins ONE cds digest, its own build's, and CDS is
      # what admits everything else, so a chart from any other commit has its
      # CDS denied at container create and nothing converges. The
      # merge-triggered e2e chains off the node-image publish, so the image
      # exists when this runs. This is the only lane in either repo that runs
      # nri-image-policy fail-closed on TDX and asserts a real admission denial.
      c8s_ref: ''
