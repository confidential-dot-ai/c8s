# ═══════════════════════════════════════════════════════════════════════════
# CONSUMER: c8s — the flagship payload ("install c8s + prove a cw workload runs")
# ═══════════════════════════════════════════════════════════════════════════
#
# This file owns only WHAT to test (the c8s payload) and WHEN (the trigger).
# WHERE (boot/attest/teardown a CVM per platform) belongs to the primitive:
#   .github/workflows/cvm-e2e.yml
#
# Adding a platform = adding a matrix row. Adding a DIFFERENT repo's test = a new
# consumer file with a different payload on the SAME primitive (e.g.
# attestation-rs: payload = `cargo test --features attest`, flavor: base-cpu).
#
# WHY NO OCI PULLS BY <sha> TAG: BOTH c8s publish workflows are PATH-GATED, so
# a given main commit may have neither artifact under its own sha:
#  - chart.yml (internal/helmchart/**): a Go-only merge publishes NO chart tag
#    0.1.0-g<sha> -> helm pull 404s, c8s-system stays empty (failure mode 1).
#  - docker.yml (source paths): a commit touching neither runs NO Docker at all,
#    so retag-unchanged never fires and NO :<sha> image tags exist -> pods sit
#    in ImagePullBackOff (failure mode 2; both observed live on main 70aea72).
# Resolution, per artifact kind:
#  - chart: packaged FROM SOURCE at the exact sha (anonymous codeload tarball),
#    inlined via the HelmChart CR's chartContent.
#  - images: can't be built from source here — resolve each component to the
#    NEWEST existing sha tag at-or-before the commit under test (= what that
#    commit would actually deploy). Under the post-merge trigger this is the
#    head sha itself, because workflow_run chains off a completed Docker run.
# No registry credential anywhere in this payload — the whole chain is public.
name: e2e-c8s
on:
  # MERGE LANE: called by c8s's own post-merge wrapper (workflow_run off Docker,
  # passing the merge head_sha) — "merge to c8s main -> integration happens".
  workflow_call:
    inputs:
      c8s_ref:
        description: c8s commit to test
        type: string
        required: false
        default: main
      aa_ref:
        description: attestation-api image ref (tag or sha-<short>). Pin to a known-good build to avoid floating :main drift; default main keeps prior behaviour.
        type: string
        required: false
        default: main
  workflow_dispatch:
    inputs:
      c8s_ref:
        description: c8s commit to test (any ref — the chart is packaged from source at that sha)
        required: false
        default: main
      aa_ref:
        description: attestation-api image ref (tag or sha-<short>). Pin to a known-good build to avoid floating :main drift; default main keeps prior behaviour.
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-c8s.yml'
      - '.github/workflows/cvm-e2e.yml'
      - 'c8s-e2e/**'
  # DRIFT LANE: nightly against c8s main × the current base image — catches
  # image/registry/orchestration drift no c8s merge triggered.
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: e2e-c8s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── ONE JOB PER PLATFORM, AND NOTHING ELSE IN THIS FILE ──────────────────
  # Every job has the same shape: no `needs`, no payload plumbing, just a lane.
  # Each lane workflow is self-contained and independently dispatchable, so this
  # file is only the answer to "which platforms does c8s run on".
  #
  # Adding a platform is one job block here plus its lane workflow.
  #
  # NOT a `matrix:`. A reusable-workflow `uses:` takes no expressions, so a
  # matrix would need a dispatcher whose jobs are `if:`-gated per row, and since
  # every row instantiates the whole dispatcher that costs rows x jobs entries
  # in the run tree: 16 at four platforms, 12 of them phantom, growing
  # quadratically. Four jobs give four real entries.

  snp-metal:
    permissions:
      contents: read
      # The CVM reaper asks GitHub whether the owning run finished.
      actions: read
    uses: ./.github/workflows/snp-metal-e2e.yml
    with:
      c8s_ref: ${{ inputs.c8s_ref || '' }}
      aa_ref: ${{ inputs.aa_ref || '' }}

  tdx-metal:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tdx-metal-e2e.yml
    with:
      # DELIBERATELY EMPTY. Empty means "use the ref the node image was built
      # from", published in the tdx-rke2-image-refs ConfigMap.
      #
      # WHY, and the earlier comment here had this WRONG. It claimed the image
      # bakes a floor "from its build ref, so installing any other ref gets that
      # ref's own components denied". That is not the mechanism. The measured
      # always_allow in the node image (confidential-os-builder
      # mkosi/base/mkosi.profiles/c8s/image-policy.yaml.in) holds exactly TWO
      # entries, the nri-image-policy image and the cds image. It has never
      # contained the operator, ratls-mesh, tls-lb, get-cert or attestation-api
      # at any ref, so "that ref's components" were never in it to be missing.
      #
      # THE ACTUAL BINDING IS A BOOTSTRAP ORDERING. CDS serves the allowlist that
      # admits everything else, so CDS itself has to be admitted first, and the
      # only thing that can admit it before it is running is that two-entry
      # measured floor, which pins ONE cds digest: the node image's. Install a
      # different ref and its cds image is a different digest, so it is denied at
      # container create in c8s-system (not an exempt namespace), never serves a
      # seed, and helm --wait expires. Narrow in principle, since retag-unchanged
      # preserves the digest whenever cds itself is untouched, but measured on
      # 2026-07-27 it was 0 of the last 3 merge heads.
      #
      # Note --resolve-digests does NOT help here: it derives component digests
      # into the CDS-SERVED seed, which is downstream of the bootstrap. That is
      # why arbitrary third-party digests (the ARC images) can be seeded at
      # install and admitted: those pods start after CDS is already serving.
      #
      # CONSEQUENCE, UNCHANGED: this lane proves the stack, the host, the image
      # and the runner, not the code in the merge that triggered it. It is also
      # the ONLY lane in either repo that runs nri-image-policy in ENFORCE mode
      # and asserts a real admission denial; the snp-metal lane installs the
      # merge head but with policy.mode: audit, so it tests newer code with
      # enforcement off. The two are complementary, not redundant.
      c8s_ref: ''

  azure-snp:
    # ── COST GATE ─────────────────────────────────────────────────────────
    # The metal lanes run on our own hardware and are effectively free. Each
    # azure row bills a real cloud resource per run: an ephemeral AKS cluster
    # here, a DC4es_v6 in azure-tdx. So they run on the nightly and on demand,
    # not on every push.
    #
    # WHAT EACH TRIGGER IS FOR: a push here only ever edits CI workflows (the
    # push trigger is path-gated to three workflow paths), so the question it
    # answers is "did I break a lane", which the metal pair answers cheaply.
    # The nightly answers "did the world change underneath us", which is where
    # the azure lanes earn their cost, and is also the failure class our real
    # outages came from: a filling disk, a deprecated runner image, drifted
    # collateral. None of those are caused by a commit.
    if: github.event_name != 'push'
    permissions:
      contents: read
      # OIDC to Azure. The metal jobs deliberately do NOT hold this, so a job on
      # our own bare-metal runners cannot mint an Azure credential.
      id-token: write
    uses: ./.github/workflows/azure-e2e.yml
    with:
      # push and schedule carry no inputs.
      c8s_ref: ${{ inputs.c8s_ref || 'main' }}

  azure-tdx:
    # Same cost gate as azure-snp above.
    if: github.event_name != 'push'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/azure-tdx-e2e.yml
    with:
      c8s_ref: ${{ inputs.c8s_ref || 'main' }}
