# Product checks boot published measured node images on each hardware platform.
# The image and its complete identity come from the lane's producer refs CM.
# c8s_ref selects the external CLI/test source; it does not replace baked code.
name: e2e-c8s
on:
  workflow_call:
    inputs:
      c8s_ref:
        description: 'Compatible CLI/test source ref; empty uses each image build ref'
        type: string
        required: false
        default: ''

concurrency:
  group: e2e-c8s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snp-metal:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/snp-metal-e2e.yml
    with:
      c8s_ref: ${{ inputs.c8s_ref }}

  tdx-metal:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tdx-metal-e2e.yml
    with:
      c8s_ref: ${{ inputs.c8s_ref }}
