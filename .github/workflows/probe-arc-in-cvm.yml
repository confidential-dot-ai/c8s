# ═══════════════════════════════════════════════════════════════════════════
# SPIKE: prove ARC (ephemeral runners) can run INSIDE the measured rke2-node CVM
# ═══════════════════════════════════════════════════════════════════════════
# De-risks the ADR's lib rail (share-the-runner): before building snp-metal-cvm
# for real, prove the load-bearing assumption on hardware — that ARC installs
# into the in-guest rke2, its listener REGISTERS with github from inside the SNP
# guest (egress + auth work), and a runner pod comes up IN THE TEE.
#
# Reuses the PROVEN cvm-e2e primitive (boot + console-deliver + teardown). The
# payload = install ARC in-guest (via rke2 helm-controller HelmChart CRs, same
# mechanism that installs c8s) + prove the listener reaches "Getting next
# message" (authenticated to github, polling for jobs) + a runner pod Running +
# that pod reads a genuine SNP report (in the TEE).
#
# Scope: this proves INSTALL + REGISTER + RUNNER-IN-TEE (the crux). Actually
# ROUTING a job to it is standard ARC once a runner is online — a cheap
# follow-up, not the risk. Secret note: the App PEM is base64'd into the payload
# and travels the serial console (known dev-sandbox leak; acceptable for a spike,
# uses a throwaway scale-set name). DELETE this workflow after the spike.
name: probe-arc-in-cvm
on:
  workflow_dispatch: {}

jobs:
  payload:
    runs-on: ubuntu-latest
    outputs:
      b64: ${{ steps.p.outputs.b64 }}
    steps:
      - id: p
        env:
          APP_ID: '4309649'
          APP_INSTALLATION_ID: '146850802'
          ARC_APP_PRIVATE_KEY: ${{ secrets.ARC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PEM_B64=$(printf '%s' "$ARC_APP_PRIVATE_KEY" | base64 -w0)
          CHART=oci://ghcr.io/actions/actions-runner-controller-charts
          cat > p.sh <<PAYLOAD
          # rke2 ships helm-controller (HelmChart CRD) — no helm binary needed,
          # same path c8s installs through. \$K is the in-guest kubectl.
          \$K create ns arc-systems >/dev/null 2>&1; \$K create ns arc-runners >/dev/null 2>&1
          # the rke2 guest enforces PodSecurity; ARC pods need privileged (same fix
          # as c8s-system in the flagship — without it the replicaset can't create a
          # pod: deploy 0/1, rs DESIRED=1/CURRENT=0, which is exactly what run 2 hit).
          for ns in arc-systems arc-runners; do \$K label ns \$ns pod-security.kubernetes.io/enforce=privileged pod-security.kubernetes.io/warn=privileged pod-security.kubernetes.io/audit=privileged --overwrite >/dev/null 2>&1; done
          say NS_PRIVILEGED
          # App creds secret ARC consumes (App auth: id / installation / private key)
          printf '%s' '$PEM_B64' | base64 -d > /tmp/arc.pem
          \$K -n arc-runners create secret generic arc-app \
            --from-literal=github_app_id='$APP_ID' \
            --from-literal=github_app_installation_id='$APP_INSTALLATION_ID' \
            --from-file=github_app_private_key=/tmp/arc.pem >/dev/null 2>&1 && say SECRET_OK || say FAIL_SECRET
          rm -f /tmp/arc.pem
          # 1) ARC controller
          printf 'apiVersion: helm.cattle.io/v1\nkind: HelmChart\nmetadata:\n  name: arc\n  namespace: kube-system\nspec:\n  chart: $CHART/gha-runner-scale-set-controller\n  version: "0.14.2"\n  targetNamespace: arc-systems\n  createNamespace: true\n' | \$K apply -f - 2>&1 | sed 's/^/@@CTL /;s/\$/@@/'
          # gate on the controller DEPLOYMENT being Available (not just the CRD) —
          # dump the helm-install job + arc-systems if it never comes up.
          CTLOK=0
          for i in \$(seq 1 45); do
            hj=\$(\$K -n kube-system get job helm-install-arc -o jsonpath='{.status.succeeded}|{.status.failed}|{.status.active}' 2>/dev/null)
            dep=\$(\$K -n arc-systems get deploy -o jsonpath='{range .items[*]}{.metadata.name}={.status.availableReplicas}/{.status.replicas} {end}' 2>/dev/null)
            echo "@@CTLW \$i job(s|f|a)=\${hj:-none} deploy=\${dep:-none}@@"
            printf '%s' "\$dep" | grep -qE '=1/1' && { CTLOK=1; say CTL_UP; break; }
            sleep 12
          done
          if [ "\$CTLOK" != "1" ]; then
            \$K -n kube-system get job helm-install-arc -o wide 2>&1 | sed 's/^/@@HJ /;s/\$/@@/'
            \$K -n kube-system logs job/helm-install-arc --tail=25 2>&1 | sed 's/^/@@HJLOG /;s/\$/@@/'
            \$K -n arc-systems get all 2>&1 | sed 's/^/@@ARCSYS /;s/\$/@@/'
            \$K -n arc-systems get events --field-selector reason=FailedCreate --sort-by=.lastTimestamp 2>&1 | tail -4 | sed 's/^/@@RSEV /;s/\$/@@/'
            \$K -n kube-system get helmchart arc -o jsonpath='{.status}' 2>&1 | sed 's/^/@@HCST /;s/\$/@@/'
            say FAIL_CONTROLLER; exit 0
          fi
          # 2) the scale set (label snp-metal-cvm-spike, minRunners:1 so a runner comes up now)
          printf 'apiVersion: helm.cattle.io/v1\nkind: HelmChart\nmetadata:\n  name: snp-metal-cvm-spike\n  namespace: kube-system\nspec:\n  chart: $CHART/gha-runner-scale-set\n  version: "0.14.2"\n  targetNamespace: arc-runners\n  createNamespace: true\n  valuesContent: |\n    githubConfigUrl: https://github.com/confidential-dot-ai\n    githubConfigSecret: arc-app\n    runnerScaleSetName: snp-metal-cvm-spike\n    minRunners: 1\n    maxRunners: 1\n' | \$K apply -f - 2>&1 | sed 's/^/@@SS /;s/\$/@@/'
          # 3) THE CRUX: listener authenticates to github + polls => "Getting next message"
          LOK=0
          for i in \$(seq 1 40); do
            LP=\$(\$K -n arc-systems get pods --no-headers 2>/dev/null | grep -i listener | awk '{print \$1" "\$3}')
            echo "@@LST \$i: \${LP:-none}@@"
            L=\$(\$K -n arc-systems get pods -o name 2>/dev/null | grep -i listener | head -1)
            [ -n "\$L" ] && \$K -n arc-systems logs "\$L" --tail=3 2>/dev/null | grep -q 'Getting next message' && { LOK=1; say LISTENER_REGISTERED; break; }
            sleep 12
          done
          [ "\$LOK" = "1" ] || { \$K -n arc-systems get pods 2>&1 | sed 's/^/@@DBG /;s/\$/@@/'; say FAIL_LISTENER; exit 0; }
          # 4) a runner pod comes up Running, and is IN THE TEE (reads the SNP report)
          for i in \$(seq 1 30); do
            RP=\$(\$K -n arc-runners get pods --no-headers 2>/dev/null | grep -i 'snp-metal-cvm-spike' | head -1)
            echo "@@RUN \$i: \${RP:-none}@@"
            printf '%s' "\$RP" | grep -qE ' Running' && { say RUNNER_POD_UP; break; }
            sleep 10
          done
          RPOD=\$(\$K -n arc-runners get pods -o name 2>/dev/null | grep -i 'snp-metal-cvm-spike' | head -1)
          if [ -n "\$RPOD" ]; then
            # configfs-tsm inside the runner pod == a genuine in-guest SNP report interface
            \$K -n arc-runners exec "\$RPOD" -- sh -c 'ls /sys/kernel/config/tsm/report >/dev/null 2>&1 || ls /dev/sev-guest >/dev/null 2>&1' 2>/dev/null && say RUNNER_IN_TEE || say RUNNER_TEE_UNCONFIRMED
          fi
          [ "\$LOK" = "1" ] && say PAYLOAD_OK
          PAYLOAD
          echo "b64=$(base64 -w0 p.sh)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: payload
    uses: ./.github/workflows/cvm-e2e.yml
    with:
      platform: snp-metal
      runner: cvm-launcher
      flavor: rke2-node
      payload_b64: ${{ needs.payload.outputs.b64 }}
      timeout_minutes: 40
