# Lifecycle extracted from the confidential-ci TDX lane, with c8s-local
# cidata/scratch, AppArmor and private-image-import checks. Preserve these
# when re-vendoring; both TDX workflow wrappers share this implementation.
# Source checkout and evidence validation belong to the workflow wrappers.
name: TDX metal lifecycle
description: Boot, attest, test and clean up a c8s node image on the TDX launcher.
inputs:
  exact_image:
    description: 'Use the already validated exact-image evidence in RUNNER_TEMP.'
    default: 'false'
  c8s_ref:
    description: 'c8s ref to test (staged-stack mode). Empty = the checked-out c8s HEAD. The node image built from that exact commit is required.'
    default: ''
  keep_cvm:
    description: 'Keep the CVM for staged-run debugging.'
    default: 'false'
runs:
  using: composite
  steps:
  - name: tools (kubectl, go, crane, helm)
    shell: bash
    run: |
      set -euo pipefail
      # Every fetch here crosses the public internet from an ephemeral ARC
      # pod, and one hiccup fails the lane before it reaches a CVM.
      mkdir -p "$PWD/bin"
      # retry <shell-snippet>: 4 attempts, exponential backoff 2s/4s/8s.
      # A file, not a function, because each `run:` block is a fresh shell.
      printf '%s\n' \
        'retry() {' \
        '  local i delay=2' \
        '  for i in 1 2 3 4; do' \
        '    if eval "$1"; then return 0; fi' \
        '    [ "$i" -eq 4 ] && break' \
        '    echo "attempt $i failed, retrying in ${delay}s: $1" >&2' \
        '    sleep "$delay"' \
        '    delay=$((delay * 2))' \
        '  done' \
        '  echo "::error::gave up after 4 attempts: $1" >&2' \
        '  return 1' \
        '}' > bin/retry.sh
      . bin/retry.sh
      retry 'curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o bin/kubectl'
      chmod +x bin/kubectl
      echo "$PWD/bin" >> "$GITHUB_PATH"
      if ! command -v go >/dev/null; then
        # `|| true`: under `set -e` a failed substitution exits before the
        # pinned fallback on the next line can be reached.
        GOVER="$(curl -fsSL https://go.dev/VERSION?m=text 2>/dev/null | head -1 | sed 's/^go//' || true)"
        [ -n "$GOVER" ] || GOVER=1.27.1
        retry "curl -fsSL 'https://go.dev/dl/go${GOVER}.linux-amd64.tar.gz' | sudo tar -C /usr/local -xz"
      fi
      # $GITHUB_PATH only affects LATER steps, so `go` is still not on PATH
      # inside THIS one. `go install crane` below needs it here and now.
      export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
      echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # crane: `c8s install --resolve-digests=true` below shells out to it.
      # Pinned rather than fetched through the GitHub releases API, which
      # rate-limits by IP on a shared self-hosted host.
      command -v crane >/dev/null || retry 'go install github.com/google/go-containerregistry/cmd/crane@v0.21.6'
      # helm: c8s install shells out to it too. The ephemeral ARC pod has
      # neither binary, unlike the host, so install rather than assume.
      if ! command -v helm >/dev/null; then
        retry 'curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar -xz -C "$PWD/bin" --strip-components=1 linux-amd64/helm'
      fi

  # reap-before-provision: a killed run leaks a CVM (and its scratch PVC).
  # Fail SAFE: only reap on a positive "completed", or on age. An unknown
  # status (403/404/no token) KEEPS the CVM rather than killing a live run.
  - name: reap leaked CVMs from finished runs
    shell: bash
    run: |
      set +e +o pipefail
      NOW=$(date -u +%s)
      for vm in $(kubectl -n "$NS" get vm -l ci.confidential.ai/managed=true -o name 2>/dev/null); do
        rid=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.labels.ci\.confidential\.ai/run-id}' 2>/dev/null)
        standing=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.labels.ci\.confidential\.ai/standing}' 2>/dev/null)
        [ "$standing" = "true" ] && { echo "keeping $vm (standing runner)"; continue; }
        [ -z "$rid" ] && continue
        [ "$rid" = "${{ github.run_id }}" ] && continue
        ct=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.creationTimestamp}' 2>/dev/null)
        age=$(( NOW - $(date -u -d "$ct" +%s 2>/dev/null || echo "$NOW") ))
        # Ask GitHub whether the owning run is actually finished, rather than
        # waiting out the 3h age fallback while a CVM squats a finite host.
        # ANY org repo can invoke this lane, so the owning repo is read from
        # the annotation (a label value cannot hold the '/' in owner/repo).
        # Ported from cvm-e2e.yml, which has had this since the SNP lane
        # started leaking CVMs on cancelled runs.
        # NOTE: this needs `actions: read`. Without it the call 403s, $st is
        # empty, and we degrade to exactly the age-only behaviour this
        # replaces, which is safe but slow.
        orepo=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.annotations.ci\.confidential\.ai/repo}' 2>/dev/null)
        st=$(gh api "repos/${orepo:-${{ github.repository }}}/actions/runs/$rid" -q .status 2>/dev/null)
        if [ "$st" = "completed" ]; then
          echo "reaping $vm (run ${orepo:-${{ github.repository }}}#$rid completed)"
          kubectl -n "$NS" delete "$vm" --ignore-not-found --wait=false
          kubectl -n "$NS" delete pvc "${vm#virtualmachine.kubevirt.io/}-scratch" --ignore-not-found --wait=false
        elif [ -z "$st" ] && [ "$age" -gt 10800 ]; then
          echo "reaping $vm (status unknown, age ${age}s > 3h -> orphaned)"
          kubectl -n "$NS" delete "$vm" --ignore-not-found --wait=false
          kubectl -n "$NS" delete pvc "${vm#virtualmachine.kubevirt.io/}-scratch" --ignore-not-found --wait=false
        else
          echo "keeping $vm (run ${orepo:-${{ github.repository }}}#$rid status=${st:-unknown} age=${age}s)"
        fi
      done
      # Shared root disks outlive their runs by design; drop the ones no VMI
      # references once they are a week old, so images do not pile up.
      inuse=$(kubectl -n "$NS" get vmi -o jsonpath='{range .items[*]}{range .spec.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}{end}' 2>/dev/null)
      for pvc in $(kubectl -n "$NS" get pvc -l ci.confidential.ai/resource=tdx-node-root -o name 2>/dev/null); do
        name=${pvc#persistentvolumeclaim/}
        grep -qx "$name" <<<"$inuse" && continue
        ct=$(kubectl -n "$NS" get "$pvc" -o jsonpath='{.metadata.creationTimestamp}' 2>/dev/null)
        age=$(( NOW - $(date -u -d "$ct" +%s 2>/dev/null || echo "$NOW") ))
        [ "$age" -gt 604800 ] && { echo "reaping root disk $name (unused, ${age}s old)"; kubectl -n "$NS" delete "$pvc" --ignore-not-found --wait=false; }
      done
      exit 0
    env:
      GH_TOKEN: ${{ github.token }}

  - name: reap abandoned exact-image imports
    if: inputs.exact_image == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
    shell: bash
    run: bash .github/scripts/tdx-image-acceptance.sh reap "$NS" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"

  - name: import the exact published image into a private root PVC
    if: inputs.exact_image == 'true'
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    shell: bash
    run: |
      set -euo pipefail
      # Preflight namespace-scoped existing authority; no RBAC mutation.
      for resource in persistentvolumeclaims pods; do
        for verb in get create delete; do
          test "$(kubectl auth can-i "$verb" "$resource" -n "$NS")" = yes
        done
      done
      test "$(kubectl auth can-i patch persistentvolumeclaims -n "$NS")" = yes
      # Verify the evidence still names the published manifest by digest.
      artifact=$(jq -r .artifact "$RUNNER_TEMP/tdx-image-acceptance/acceptance.json")
      expected=$(jq -r .manifest_sha256 "$RUNNER_TEMP/tdx-image-acceptance/acceptance.json")
      published=$(crane manifest "$artifact" | jq -er '
        [.layers[] | select(.annotations["org.opencontainers.image.title"] == "manifest.json")]
        | if length == 1 then .[0].digest else error("expected one manifest.json layer") end')
      test "$published" = "sha256:$expected"
      # Create, not apply: never adopt an existing disk with the same name.
      bash .github/scripts/tdx-image-acceptance.sh pvc \
        "$RUNNER_TEMP/tdx-image-acceptance" "$SOURCE_SHA" "$GITHUB_RUN_ID" \
        "$VM" "$NS" "$GITHUB_REPOSITORY" | kubectl create -f -
      # A namespace-scoped, restricted consumer selects a TDX node for
      # local-path storage. It has no volumeMount and cannot read the disk.
      # Only start CDI after binding, so its importer cannot select a
      # different node. No cluster-scoped node-list authority is needed.
      bash .github/scripts/tdx-image-acceptance.sh binder \
        "$VM" "$NS" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" | kubectl create -f -
      timeout 130 kubectl -n "$NS" wait --for=condition=PodScheduled "pod/$VM-binder" --timeout=120s
      timeout 130 kubectl -n "$NS" wait --for=jsonpath='{.status.phase}'=Bound "pvc/$VM-root" --timeout=120s
      bash .github/scripts/tdx-image-acceptance.sh start-import \
        "$RUNNER_TEMP/tdx-image-acceptance" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$VM" "$NS" "$GITHUB_REPOSITORY"
      # The binder has done its job once the PVC is bound to the TDX node and
      # the import is requested. CDI will not create its importer while any
      # pod still mounts the claim (ImportTargetInUse), so release it before
      # waiting, not after.
      bash .github/scripts/tdx-image-acceptance.sh cleanup-binder "$VM" "$NS" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
      bash .github/scripts/tdx-image-acceptance.sh wait "$VM" "$NS" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"

  - name: build the c8s CLI under test
    env:
      EXACT_IMAGE: ${{ inputs.exact_image == 'true' }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      C8S_REF_INPUT: ${{ inputs.c8s_ref }}
    shell: bash
    run: |
      set -euo pipefail
      # Same exposure as the tools step: this clone and the module fetches
      # behind `go install` cross the public internet under `set -e`.
      . "$GITHUB_WORKSPACE/bin/retry.sh"
      # This clone reproduces fine anonymously from a pod in arc-runners and
      # from this runner image, so when it fails HERE the cause is something
      # in the job's own context, and the bare error says nothing useful:
      #   fatal: could not read Username for 'https://github.com'
      # Capture the config git actually reads and the exchange it actually
      # gets, redacting any credential the trace would otherwise print.
      clone_diag() {
        echo "::group::c8s clone diagnostics"
        git config --list --show-origin 2>&1 \
          | sed -E 's/(extraheader|authorization|helper|password|token)=.*/\1=<redacted>/I' \
          | sed 's/^/cfg  /' | head -40
        env | grep -iE '^(GIT_|GH_|GITHUB_TOKEN|https?_proxy|HTTPS?_PROXY)' \
          | sed -E 's/=.*/=<set>/' | sed 's/^/env  /'
        GIT_TERMINAL_PROMPT=0 GIT_CURL_VERBOSE=1 \
          git ls-remote https://github.com/confidential-dot-ai/c8s.git HEAD 2>&1 \
          | sed -E 's/(authorization|Authorization|AUTHORIZATION):.*/\1: <redacted>/' \
          | tail -40 | sed 's/^/wire /'
        echo "::endgroup::"
      }
      if [ "$EXACT_IMAGE" = true ]; then
        # The wrapper verified main ancestry and checked out this full SHA.
        # Reuse it: a tag can shadow the short ref used for OCI image tags.
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid exact-image source SHA"; exit 1; }
        [ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA" ] \
          || { echo "::error::exact-image workspace does not match the verified source SHA"; exit 1; }
        C8S_SOURCE_DIR=$GITHUB_WORKSPACE
      elif [ -z "${C8S_REF_INPUT:-}" ]; then
        # The c8s this action runs from: the merge head under c8s's own
        # trigger, lane_ref's HEAD under confidential-ci's wrapper. No clone:
        # a pull_request checkout is a merge commit no remote branch has.
        C8S_SOURCE_DIR=$GITHUB_WORKSPACE
      else
        retry 'rm -rf /tmp/c8s-src && git clone -q https://github.com/confidential-dot-ai/c8s.git /tmp/c8s-src' \
          || { clone_diag; exit 1; }
        git -C /tmp/c8s-src checkout -q "$C8S_REF_INPUT" || { echo "::error::bad c8s ref '$C8S_REF_INPUT'"; exit 1; }
        C8S_SOURCE_DIR=/tmp/c8s-src
      fi
      export C8S_SOURCE_DIR
      echo "C8S_SOURCE_DIR=$C8S_SOURCE_DIR" >> "$GITHUB_ENV"
      C8S_SHA=$(git -C "$C8S_SOURCE_DIR" rev-parse HEAD)
      echo "C8S_SHA=$C8S_SHA" >> "$GITHUB_ENV"
      echo "c8sRef=${C8S_SHA:0:7}" >> "$GITHUB_ENV"
      echo "c8s ref sha: $C8S_SHA"
      retry '( cd "$C8S_SOURCE_DIR" && go install ./cmd/c8s )'
      # An unstamped build reports "dev", which is exactly why --image-tag
      # is passed explicitly at install rather than trusting build metadata.
      c8s --version || true

  - name: resolve the node image built from the commit under test
    if: inputs.exact_image != 'true'
    env:
      IMAGE_REPO: ghcr.io/confidential-dot-ai/node-guest-base
    shell: bash
    run: |
      set -euo pipefail
      # The image built from this exact commit, rke2-tdx-cdi-<sha>, and the
      # manifest.json its build published (a layer of the oras artifact beside
      # the CDI disk) for the measured tuple the attestation gate pins. Only
      # this pair works: the image bakes a fail-closed NRI plugin whose floor
      # pins its own CDS digest, so any other chart has its CDS denied at
      # container create. c8s-image publishes one image per main commit, and
      # the merge-triggered e2e chains off that publish, so for a merge run
      # it exists; for a dispatch it must too.
      . "$GITHUB_WORKSPACE/bin/retry.sh"
      tok=$(retry 'curl -fsSL --max-time 20 "https://ghcr.io/token?scope=repository:${IMAGE_REPO#ghcr.io/}:pull"' | jq -er .token)
      accept='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json'
      IMG_DIGEST=""; code=""
      for attempt in 1 2 3 4; do
        hdr=$(curl -sI --max-time 20 -H "Authorization: Bearer $tok" -H "Accept: $accept" \
          "https://ghcr.io/v2/${IMAGE_REPO#ghcr.io/}/manifests/rke2-tdx-cdi-${c8sRef}" | tr -d '\r')
        code=$(awk 'NR==1{print $2}' <<<"$hdr")
        case "$code" in
          200) IMG_DIGEST=$(awk 'tolower($1)=="docker-content-digest:"{print $2}' <<<"$hdr"); break ;;
          404) echo "::error::no node image for the commit under test: ${IMAGE_REPO}:rke2-tdx-cdi-${c8sRef} is not published. The lane needs the exact pair; wait for this commit's c8s-image run, or dispatch with a c8s_ref whose image exists"; exit 1 ;;
          *)   sleep $((attempt * 3)) ;;
        esac
      done
      [[ "$IMG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::ghcr answered ${code:-none} for rke2-tdx-cdi-${c8sRef} on 4 attempts"; exit 1; }
      oras=$(retry 'curl -fsSL --max-time 60 -H "Authorization: Bearer $tok" -H "Accept: $accept" "https://ghcr.io/v2/${IMAGE_REPO#ghcr.io/}/manifests/rke2-tdx-${c8sRef}"')
      mlayer=$(jq -er '.layers[] | select(.annotations["org.opencontainers.image.title"]=="manifest.json") | .digest' <<<"$oras")
      retry 'curl -fsSL --max-time 60 -H "Authorization: Bearer $tok" "https://ghcr.io/v2/${IMAGE_REPO#ghcr.io/}/blobs/$mlayer" > /tmp/image-manifest.json'
      jq -e '.build.platform == "tdx" and (.tdx.mrtd | length) == 96' /tmp/image-manifest.json >/dev/null \
        || { echo "::error::rke2-tdx-${c8sRef} manifest.json is not a TDX node image manifest"; exit 1; }
      short12=${IMG_DIGEST#sha256:}; short12=${short12:0:12}
      {
        echo "image=${IMAGE_REPO}@${IMG_DIGEST}"
        echo "rootPvc=c8s-root-${short12}"
        echo "mrtd=$(jq -er .tdx.mrtd /tmp/image-manifest.json)"
        echo "rtmr1=$(jq -er .tdx.rtmr1 /tmp/image-manifest.json)"
        echo "rtmr2=$(jq -er .tdx.rtmr2 /tmp/image-manifest.json)"
      } >> "$GITHUB_ENV"
      echo "c8s under test ${c8sRef} on its own node image rke2-tdx-cdi-${c8sRef} (${IMG_DIGEST:0:19}...), mrtd $(jq -r '.tdx.mrtd[0:16]' /tmp/image-manifest.json)..."

  - name: stage the node image on the host (no-op when already staged)
    if: inputs.exact_image != 'true'
    shell: bash
    run: |
      set -euo pipefail
      # A CDI registry import into a PVC named by image digest, shared
      # read-only by every run of this image. Requested through the PVC
      # annotations CDI honours, with immediate binding so no binder pod is
      # needed on this single-node host.
      if ! kubectl -n "$NS" get pvc "$rootPvc" >/dev/null 2>&1; then
        kubectl apply -f - <<EOF
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: $rootPvc
        namespace: $NS
        labels:
          ci.confidential.ai/managed: "true"
          ci.confidential.ai/resource: tdx-node-root
          confai.confidential.ai/source-digest-sha256: "${rootPvc#c8s-root-}"
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
          cdi.kubevirt.io/storage.import.source: registry
          cdi.kubevirt.io/storage.import.endpoint: "docker://$image"
          cdi.kubevirt.io/storage.import.secretName: ghcr-pull
          cdi.kubevirt.io/storage.contentType: kubevirt
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        volumeMode: Filesystem
        resources: {requests: {storage: 4Gi}}
      EOF
      fi
      for i in $(seq 1 120); do
        phase=$(kubectl -n "$NS" get pvc "$rootPvc" -o jsonpath='{.metadata.annotations.cdi\.kubevirt\.io/storage\.pod\.phase}' 2>/dev/null || true)
        case "$phase" in
          Succeeded) echo "root disk $rootPvc ready"; break ;;
          Failed) kubectl -n "$NS" describe pvc "$rootPvc" | tail -15; echo "::error::CDI import of $image failed"; exit 1 ;;
        esac
        [ "$i" -lt 120 ] || { kubectl -n "$NS" describe pvc "$rootPvc" | tail -15; echo "::error::CDI import of $image did not finish in 20 min (phase ${phase:-none})"; exit 1; }
        sleep 10
      done

  - name: preflight, TDX device capacity
    # KubeVirt's socket device-plugin probes the QGS socket ONLY at
    # virt-handler startup and never re-checks. After a host reboot or a
    # qgsd/bridge restart it advertises 0 forever and every TDX VM fails to
    # schedule with a misleading "Insufficient devices". Seen in the wild
    # 2026-07-26 on a 26h-old virt-handler while QGS was perfectly healthy.
    # Cheap to detect here; the remedy needs cluster-scoped rights the
    # bm-e2e SA deliberately lacks, so this reports rather than fixes.
    shell: bash
    run: |
      set -uo pipefail
      if kubectl auth can-i get nodes >/dev/null 2>&1; then
        N=$(kubectl get node -l kubevirt.io/tdx=true -o jsonpath='{.items[0].status.allocatable.devices\.kubevirt\.io/tdx}' 2>/dev/null)
        echo "devices.kubevirt.io/tdx = ${N:-unknown}"
        if [ "${N:-0}" = "0" ]; then
          echo "::error title=TDX devices exhausted::virt-handler is advertising 0 TDX devices. Fix on the host: kubectl -n kubevirt rollout restart daemonset/virt-handler"
          exit 1
        fi
      else
        echo "no node read permission (expected: bm-e2e is namespace-scoped); relying on the scheduling gate below"
      fi

  - name: per-run operator key + opkeydata secret
    # The initrd mounts the ISO labelled "opkeydata", SHA-384s the file
    # named `pubkey`, and extends that into RTMR[3]. cred-release then
    # refuses to serve if the on-disk key does not match RTMR[3], so the
    # kubeconfig we fetch is cryptographically bound to THIS keypair.
    shell: bash
    run: |
      set -euo pipefail
      umask 077
      openssl ecparam -name prime256v1 -genkey -noout -out /tmp/op.key
      openssl ec -in /tmp/op.key -pubout -out /tmp/op.pub 2>/dev/null
      kubectl -n "$NS" create secret generic "$VM-opkey" \
        --from-file=pubkey=/tmp/op.pub --dry-run=client -o yaml | kubectl apply -f -
      echo "operator key bound (sha384 $(sha384sum < /tmp/op.pub | cut -c1-16)...)"

  - name: boot the TDX CVM
    shell: bash
    run: |
      set -euo pipefail
      kubectl apply -f - <<EOF
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: $VM-scratch
        namespace: $NS
        labels: {ci.confidential.ai/managed: "true"}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 80Gi}}
        storageClassName: local-path
      ---
      apiVersion: v1
      kind: Secret
      metadata: {name: $VM-cloudinit, namespace: $NS}
      type: Opaque
      # Bait, not configuration: the node image disables cloud-init, so
      # this host disk must be inert (asserted by the tripwire step
      # below). c8s-local patch — mirror to confidential-ci before
      # re-vendoring.
      stringData:
        userdata: |
          #cloud-config
          hostname: cidata-bait
      ---
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        name: $VM
        namespace: $NS
        labels:
          ci.confidential.ai/managed: "true"
          ci.confidential.ai/run-id: "${{ github.run_id }}"
        annotations:
          ci.confidential.ai/repo: "${{ github.repository }}"
          ci.confidential.ai/run-url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      spec:
        runStrategy: Always
        template:
          metadata:
            labels: {kubevirt.io/domain: $VM}
          spec:
            nodeSelector:
              kubevirt.io/tdx: "true"
            domain:
              cpu:
                # host-passthrough is MANDATORY: QEMU rejects a named model
                # for TDX ("Named cpu model is not supported for TDX yet!").
                model: host-passthrough
                cores: 4
              devices:
                autoattachVSOCK: true
                disks:
                  - name: rootdisk
                    # dm-verity rootfs: never written. readonly takes a
                    # SHARED qemu lock so concurrent CVMs coexist; a
                    # writable open takes an EXCLUSIVE one and starves every
                    # other guest on the same PVC (cost the SNP lane a day).
                    # NB: readonly is a field of `disk`, not a sibling of it;
                    # KubeVirt's strict decoder rejects the sibling form.
                    disk: {bus: virtio, readonly: true}
                  - name: scratch
                    disk: {bus: virtio}
                    # HARD requirement: the initrd keys the encrypted
                    # overlay off this exact serial. Without it the guest
                    # falls back to a 2G tmpfs and rke2 wedges when full.
                    serial: confai-scratch
                  - name: opkey
                    disk: {bus: virtio}
                  - name: cloudinit
                    disk: {bus: virtio}
                interfaces: [{name: default, masquerade: {}}]
                rng: {}
              firmware: {bootloader: {efi: {secureBoot: false}}}
              # Empty object: TDX takes no per-VM policy. Cluster config
              # lives in the KubeVirt CR (confidentialCompute.tdx.attestation).
              launchSecurity: {tdx: {}}
              memory: {guest: 16Gi}
              resources: {requests: {memory: 16Gi}}
            networks: [{name: default, pod: {}}]
            volumes:
              - name: rootdisk
                persistentVolumeClaim: {claimName: $rootPvc}
              - name: scratch
                persistentVolumeClaim: {claimName: $VM-scratch}
              - name: opkey
                secret: {secretName: $VM-opkey, volumeLabel: opkeydata}
              - name: cloudinit
                cloudInitNoCloud: {secretRef: {name: $VM-cloudinit}}
      EOF
      for i in $(seq 1 60); do
        PHASE=$(kubectl -n "$NS" get vmi "$VM" -o jsonpath='{.status.phase}' 2>/dev/null || true)
        [ "$PHASE" = Running ] && break
        sleep 5
      done
      if [ "${PHASE:-}" != Running ]; then
        kubectl -n "$NS" describe vmi "$VM" | tail -25
        echo "::error::VMI not Running (phase=${PHASE:-none}). 'Insufficient devices.kubevirt.io/tdx' means virt-handler latched 0: rollout restart daemonset/virt-handler -n kubevirt"
        exit 1
      fi
      IP=$(kubectl -n "$NS" get vmi "$VM" -o jsonpath='{.status.interfaces[0].ipAddress}')
      [ -n "$IP" ] || { echo "::error::no guest IP"; exit 1; }
      echo "GUEST_IP=$IP" >> "$GITHUB_ENV"
      echo "VMI Running at $IP"

  - name: assert genuine TDX launch
    shell: bash
    run: |
      set -euo pipefail
      POD=$(kubectl -n "$NS" get pods -l kubevirt.io/domain="$VM" -o name | head -1)
      kubectl -n "$NS" exec "$POD" -c compute -- \
        bash -c 'tr "\0" "\n" < /proc/$(pgrep -f qemu-system | head -1)/cmdline | grep -c "tdx-guest"' | tee /tmp/tdx.cnt
      [ "$(cat /tmp/tdx.cnt)" -ge 1 ] || { echo "::error::qemu has no tdx-guest object: not a genuine trust domain"; exit 1; }
      echo "OK: qemu launched with -object tdx-guest"

  - name: wait for guest services (attestation-api, apiserver, cred-release)
    shell: bash
    run: |
      set -euo pipefail
      for i in $(seq 1 90); do
        H=$(curl -s --connect-timeout 2 --max-time 4 "http://$GUEST_IP:8400/health" 2>/dev/null || true)
        [ -n "$H" ] && { echo "attestation-api: $H"; break; }
        sleep 10
      done
      echo "$H" | grep -q '"platform":"tdx"' || { echo "::error::attestation-api did not report platform=tdx"; exit 1; }
      for i in $(seq 1 60); do
        C=$(curl -sk --max-time 4 -o /dev/null -w '%{http_code}' "https://$GUEST_IP:6443/livez" 2>/dev/null || true)
        case "$C" in 200|401|403) echo "kube-apiserver: HTTP $C"; break;; esac
        sleep 5
      done
      for i in $(seq 1 60); do
        C=$(curl -sk --max-time 4 -o /dev/null -w '%{http_code}' "https://$GUEST_IP:8443/" 2>/dev/null || true)
        [ -n "$C" ] && [ "$C" != 000 ] && { echo "cred-release: HTTP $C"; break; }
        sleep 5
      done

  - name: get an attested, operator-key-bound kubeconfig (RA-TLS)
    shell: bash
    run: |
      set -euo pipefail
      c8s get-kubeconfig --node "$GUEST_IP" --operator-key /tmp/op.key --image-manifest /tmp/image-manifest.json --out /tmp/guest.kubeconfig --timeout 180s
      [ -s /tmp/guest.kubeconfig ] || { echo "::error::no kubeconfig returned"; exit 1; }
      WHO=$(KUBECONFIG=/tmp/guest.kubeconfig kubectl auth whoami -o jsonpath='{.status.userInfo.username}')
      [ "$WHO" = operator ] || { echo "::error::unexpected identity '$WHO'"; exit 1; }
      echo "OK: attested kubeconfig, identity=$WHO"
      KUBECONFIG=/tmp/guest.kubeconfig kubectl get nodes

  - name: assert the host cidata disk is inert
    shell: bash
    run: .github/scripts/cidata-tripwire.sh

  - name: assert AppArmor runtime confinement and admission
    if: inputs.exact_image == 'true'
    # c8s-local image invariant, alongside the cidata tripwire above.
    # Keep on re-vendor; the source workflow does not ship this script.
    env:
      KUBECONFIG: /tmp/guest.kubeconfig
    shell: bash
    run: bash node-guest-image/tests/apparmor-runtime-test.sh

  - name: install the c8s bundle under test
    shell: bash
    run: |
      set -euo pipefail
      export KUBECONFIG=/tmp/guest.kubeconfig
      # The CLI was built at the paired ref, which can predate the node ->
      # bare-metal rename (#607). Ask it which name it takes.
      mode=bare-metal
      c8s install --help 2>&1 | grep -q -- '--cvm-mode.*bare-metal' || mode=node
      echo "cvm-mode for c8s@$c8sRef: $mode"
      c8s install --cvm-mode "$mode" --single-node --hardware-platform tdx \
        --image-tag "$c8sRef" \
        --operator-keys /tmp/op.pub \
        --measurements "$mrtd" \
        --resolve-digests=true
      kubectl -n c8s-system get pods -o wide

  - name: assert components converged
    shell: bash
    run: |
      set -euo pipefail
      export KUBECONFIG=/tmp/guest.kubeconfig
      if ! bash "$C8S_SOURCE_DIR/test/e2e/components-ready.sh"; then
        # components-ready prints the listing and a describe tail; the reason a
        # pod is stuck is in its containers' logs, init containers included.
        for p in $(kubectl -n c8s-system get pods --no-headers 2>/dev/null | awk '{split($2,a,"/"); if (a[1]!=a[2] || $3!="Running") print $1}'); do
          echo "::group::$p"
          kubectl -n c8s-system describe pod "$p" 2>&1 | sed -n '/^Events:/,$p' | tail -15
          # The node image's kubelet serves no debugging handlers, so pods/log
          # is refused; exit codes and termination messages are still in status.
          kubectl -n c8s-system get pod "$p" -o json 2>/dev/null | jq -r '
            (.status.initContainerStatuses // []) + (.status.containerStatuses // []) | .[]
            | "\(.name): restarts=\(.restartCount) state=\(.state | keys[0]) last=\(.lastState.terminated // {} | "exit=\(.exitCode // "-") reason=\(.reason // "-") message=\(.message // "-" | tostring | .[0:600])")"'
          echo "::endgroup::"
        done
        exit 1
      fi

  - name: assert the image floor denies, then opens to a signed write
    # router fronts /allowlist on hostPort 443, and bare-metal mode puts CDS in
    # the node CVM, so the endpoint pins to the node MRTD.
    shell: bash
    run: |
      set -euo pipefail
      export KUBECONFIG=/tmp/guest.kubeconfig
      export C8S_ALLOWLIST_URL="https://$GUEST_IP:443"
      export C8S_MEASUREMENTS="$mrtd"
      export C8S_OPERATOR_KEY=/tmp/op.key
      bash "$C8S_SOURCE_DIR/test/e2e/allowlist-enforcement.sh"

  - name: assert a confidential workload runs with an injected cert
    shell: bash
    run: |
      set -euo pipefail
      export KUBECONFIG=/tmp/guest.kubeconfig
      export C8S_ALLOWLIST_URL="https://$GUEST_IP:443"
      export C8S_MEASUREMENTS="$mrtd"
      export C8S_OPERATOR_KEY=/tmp/op.key
      bash "$C8S_SOURCE_DIR/test/e2e/cw-workload.sh"

  - name: summary
    if: always()
    shell: bash
    run: |
      {
        echo "### c8s on TDX metal"
        echo ""
        echo "| | |"
        echo "|---|---|"
        echo "| image | \`${image:-?}\` |"
        echo "| coverage | ${{ inputs.exact_image == 'true' && 'exact published image' || 'commit under test on its own node image' }} |"
        echo "| rootPvc | \`${rootPvc:-?}\` |"
        echo "| c8s ref | \`${c8sRef:-?}\` |"
        echo "| MRTD | \`${mrtd:0:32}...\` |"
        echo "| guest | \`${GUEST_IP:-?}\` |"
      } >> "$GITHUB_STEP_SUMMARY"

  - name: teardown
    if: always() && inputs.keep_cvm != 'true'
    env:
      EXACT_IMAGE: ${{ inputs.exact_image == 'true' }}
    shell: bash
    run: |
      set +e
      cleanup_failed=0
      kubectl -n "$NS" delete vm "$VM" --ignore-not-found --wait=true --timeout=120s || cleanup_failed=1
      kubectl -n "$NS" delete secret "$VM-opkey" "$VM-cloudinit" --ignore-not-found || cleanup_failed=1
      kubectl -n "$NS" delete pvc "$VM-scratch" --ignore-not-found --wait=false || cleanup_failed=1
      # The helper ignores absent disks and refuses anything not owned by
      # this run, including the shared staged root PVC.
      if [ "$EXACT_IMAGE" = true ]; then
        bash .github/scripts/tdx-image-acceptance.sh cleanup "$VM" "$NS" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" || cleanup_failed=1
      fi
      if [ "$cleanup_failed" != 0 ]; then
        echo "::error::TDX cleanup incomplete; owned resources may need orphan reaping"
      fi
      exit "$cleanup_failed"
