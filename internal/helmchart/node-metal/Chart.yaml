apiVersion: v2
name: c8s-node-metal
description: |
  c8s node-as-CVM shape for self-managed bare-metal CVM nodes: every node is a confidential VM (SEV-SNP or TDX) running ordinary Kubernetes pods. Installs the operator, webhook, CDS trust root, ratls-mesh, attestation-api DaemonSet, NRI image-policy installer, and tls-lb.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.30.0-0"
keywords:
  - confidential
  - tee
  - attestation
  - ratls
maintainers:
  - name: confidential-dot-ai
home: https://github.com/confidential-dot-ai
dependencies:
  - name: c8s-lib
    version: 0.1.0
    repository: file://../lib
