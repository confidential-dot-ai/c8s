# Source: c8s/templates/volumed-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: c8s-volumed
  namespace: c8s-system
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: volumed
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: c8s
      app.kubernetes.io/component: volumed
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: c8s
        app.kubernetes.io/component: volumed
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      # SO_PEERCRED reports a peer's PID in the reader's PID namespace, so a
      # caller in another pod resolves to 0 without this.
      hostPID: true
      # It reaches no API server: everything it acts on is node-local.
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoExecute
          operator: Exists
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: volumed
          image: ghcr.io/confidential-dot-ai/volumed:gold
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            # The image is nonroot (USER 65532) and privileged grants no
            # effective caps to a non-root process; the daemon must be root.
            runAsUser: 0
            runAsGroup: 0
          # The image entrypoint is ["/app/c8s", "volumed"], so args start at
          # the first flag — same as cds.yaml.
          args:
            - --socket-dir
            - "/var/run/nri-image-policy"
            - --kubelet-root
            - "/var/lib/kubelet"
            - --cgroup-root
            - "/sys/fs/cgroup"
            - --reap-interval
            - "15s"
            - --max-mounts
            - "64"
          volumeMounts:
            # Bidirectional: the mount is made here and has to reach the
            # workload's pod directory on the node.
            - name: kubelet-root
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            # /sys whole, not /sys/block: the block entries are symlinks into
            # /sys/devices, and the serial is read through them.
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            # The daemon's socket must live in the inventory's socket directory:
            # the deny-host-namespaces VAP carves out that exact path by string
            # equality, and it is what the webhook mounts into cw pods.
            - name: inventory-socket-dir
              mountPath: /var/run/nri-image-policy
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: kubelet-root
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: inventory-socket-dir
          hostPath:
            path: /var/run/nri-image-policy
            type: DirectoryOrCreate

