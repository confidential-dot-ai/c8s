            - --min-ca-validity=1h
            - --cert-ttl=24h
            - --named-cert-ttl=6h
            - --max-ttl=24h
            - --challenge-ttl=60s
            - --request-timeout=5s
            - --max-request-size=262144
            - --secrets-max-paths=1024
            - --secrets-max-paths-per-workload=64
            - --readiness-interval=10s
            - --san-validation=false
            - --dns-san-pattern=^[a-z0-9-]+[.][a-z0-9-]+[.]svc$
            - --token-signer-rotation-interval=720h
            - --token-signer-overlap=25h
            - --token-signer-rotation-jitter=0.1
            - --rate-limit=10
            - --rate-burst=20
            - --rate-limiter-max-entries=10000
            - --rate-limiter-evict-interval=1m
            - --rate-limiter-idle-timeout=5m
            - --ratls-platform=snp
            - --ratls-cert-ttl=24h
          # cvmMode=node: expands $(HOST_IP) in --attestation-api-url to the node
