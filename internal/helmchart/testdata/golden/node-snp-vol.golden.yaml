          startupProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/ratls-iptables-ready
            periodSeconds: 1
            failureThreshold: 60
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 5m
              memory: 32Mi
      containers:
        - name: ratls-mesh
          image: ghcr.io/confidential-dot-ai/ratls-mesh:gold
          imagePullPolicy: IfNotPresent
          workingDir: /tmp
          securityContext:
            runAsUser: 1337
            runAsGroup: 1337
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            
          args:
            - --platform
            - "sev-snp"
            - --attestation-api-url
            - "http://$(HOST_IP):8400"
            - --outbound-port
