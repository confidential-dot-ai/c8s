apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratls-mesh-tcp-only-egress
  namespace: c8s-system
  labels:
    helm.sh/chart: ratls-mesh-0.1.0
    app: c8s-ratls-mesh
    app.kubernetes.io/name: ratls-mesh
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/version: ""
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: c8s
    app.kubernetes.io/component: egress-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow all TCP egress (intercepted by ratls-mesh); non-TCP egress is
    # dropped by the mesh's fail-closed guard. DNS/53 (UDP) to kube-system is
    # the sanctioned plaintext exception.
    - ports:
        - protocol: TCP
    - ports:
        - protocol: UDP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

