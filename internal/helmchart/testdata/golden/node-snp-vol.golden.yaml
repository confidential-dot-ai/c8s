  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: c8s-ratls-mesh
        app.kubernetes.io/name: ratls-mesh
        app.kubernetes.io/instance: c8s
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15021"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: system-node-critical
      # iptables-sync must run in the host network namespace to intercept
      # node-level pod traffic rather than only the mesh pod's own traffic.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: c8s-ratls-mesh
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        
      initContainers:
        # Native sidecar (K8s 1.29+): cleanup runs last on shutdown because
        # sidecars stop in reverse initContainer order.
        - name: iptables-cleanup
          restartPolicy: Always
          image: ghcr.io/confidential-dot-ai/ratls-mesh:gold
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                # NET_ADMIN for iptables/ipset; NET_RAW for the xt_set match's
                # socket to the ip_set subsystem (the nf_tables-compat path
                # needs it, else `iptables -m set` fails with "Can't open socket
                # to ipset" even though NET_ADMIN alone can run ipset commands).
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: xtables-lock
              mountPath: /run/xtables.lock
          command:
            - /bin/sh
            - -c
            - "trap 'exit 0' TERM; while true; do sleep 3600 & wait $!; done"
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # --keep-guard keeps the guard live: unmeshed inbound and
                    # non-TCP egress are still dropped; TCP to non-pod destinations
                    # was never meshed.
                    /app/c8s ratls-mesh iptables-cleanup --keep-guard
                    sleep 5
          resources:
            limits:
              cpu: 10m
              memory: 16Mi
            requests:
              cpu: 1m
              memory: 8Mi
        - name: iptables-sync
          restartPolicy: Always
          image: ghcr.io/confidential-dot-ai/ratls-mesh:gold
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                # NET_ADMIN for iptables/ipset; NET_RAW for the xt_set match's
                # socket to the ip_set subsystem (the nf_tables-compat path
                # needs it, else `iptables -m set` fails with "Can't open socket
                # to ipset" even though NET_ADMIN alone can run ipset commands).
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: xtables-lock
              mountPath: /run/xtables.lock
            - name: tmp
              mountPath: /tmp
          command:
            - /app/c8s
            - ratls-mesh
            - iptables-sync
            - --outbound-port
            - "15001"
            - --uid
            - "1337"
            - --exclude-uids
            - "0"
            - --exclude-source-namespaces
            - "kube-system"
            - --node-ip
            - $(NODE_IP)
            - --resync-period
            - "30s"
            - --watchdog-period
            - "2s"
            - --ipset-maxelem
            - "262144"
            - --cw-inbound-passthrough=udp:53,tcp:53
            - --ready-file
