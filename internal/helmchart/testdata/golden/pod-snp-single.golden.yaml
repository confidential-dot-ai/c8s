apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: c8s-cw-label-integrity
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cw-label-integrity
spec:
  policyName: c8s-cw-label-integrity
  validationActions: [Deny]
  matchResources:
    # Mirror the namespace exclusions of the pod webhook so injection scope
