        app.kubernetes.io/instance: c8s
        app.kubernetes.io/component: cds
      annotations:
        confidential.ai/trust-root-mode: "inMemory"
    spec:
      # Run the trust root inside a confidential VM. Its mesh CA and EAR signing
      # keys live only in SEV-SNP-encrypted guest memory, and peers verify cds's
      # RA-TLS serving cert against the guest launch measurement. Pinned directly
      # (not via the confidential.ai/cw webhook path) because get-cert would dial
      # cds — cds fetching a leaf from itself is a bootstrap cycle. See
      # docs/install-flows.md ("Why CDS doesn't use cw for its runtimeClass").
      runtimeClassName: kata-qemu-snp
      serviceAccountName: c8s-cds
      # The live node-list bound needs the API token; static CIDRs do not.
      automountServiceAccountToken: true
      
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: confidential.ai/kata-guest-ready
                    operator: In
                    values: ["true"]
      securityContext:
        # In a kata-qemu-snp guest with shared_fs="none", the kubelet fsGroup
        # chown lands on a host emptyDir the guest never mounts, so the agent
        # creates a fresh root-owned /data inside the guest and UID 65532 cannot
        # write allowlist.db. Run as in-guest root — safe, since the SNP VM is the
        # trust boundary and cds is its sole workload.
        runAsUser: 0
        runAsNonRoot: false
      containers:
        - name: cds
          image: ghcr.io/confidential-dot-ai/cds@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          args:
            - --port=8443
            - --log-level=info
            # Per-mode resolution: see c8s.attestationApiURL.
            - --attestation-api-url=http://127.0.0.1:8400
            - --allowlist-db=/data/allowlist.db
            - --allowlist-persistent=false
            - --allowlist-seed=/etc/cds/allowlist-seed.json
            - --ear-issuer=cds
            - --jwt-clock-skew=30
            - --ca-common-name=c8s Mesh CA
            - --ca-cert-validity=8760h
            - --min-ca-validity=1h
            - --cert-ttl=24h
            - --named-cert-ttl=6h
            - --max-ttl=24h
            - --challenge-ttl=60s
            - --request-timeout=5s
            - --max-request-size=262144
            - --secrets-max-paths=1024
            - --secrets-max-paths-per-workload=64
            - --readiness-interval=10s
            - --san-validation=false
            - --dns-san-pattern=^[a-z0-9-]+[.][a-z0-9-]+[.]svc$
            - --token-signer-rotation-interval=720h
            - --token-signer-overlap=25h
            - --token-signer-rotation-jitter=0.1
            - --rate-limit=10
            - --rate-burst=20
            - --rate-limiter-max-entries=10000
            - --rate-limiter-evict-interval=1m
            - --rate-limiter-idle-timeout=5m
            - --ratls-platform=snp
            - --ratls-cert-ttl=24h
          ports:
            - name: https
              containerPort: 8443
          # In-guest cds serves mutual RA-TLS: the kubelet prober presents no
          # attested client cert, so an httpGet handshake is rejected. The port
          # only opens once cds has provisioned its RA-TLS serving cert (which
          # needs a healthy in-guest attestation-service), so an open socket is
          # the correct "attested and serving" signal.
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 30
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            
            - name: allowlist-seed
              mountPath: /etc/cds
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir: {}
        
        - name: allowlist-seed
          configMap:
            name: c8s-cds-allowlist-seed
