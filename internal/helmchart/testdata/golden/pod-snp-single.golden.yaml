# Source: c8s/templates/tls-lb-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c8s-tls-lb
  labels:
    helm.sh/chart: tls-lb-0.5.0
    app.kubernetes.io/name: tls-lb
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tls-lb
      app.kubernetes.io/instance: c8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tls-lb
        app.kubernetes.io/instance: c8s
      annotations:
        checksum/nginx-config: 15f5d302ee06a0b3d43a40242361217af9937233fcff2b213c183fc49b78165f
    spec:
      # Chart-managed mesh component: the webhook excludes the release
      # namespace, so the chart pins the RuntimeClass directly (same pattern as
      # cds.yaml). kata-qemu-snp specifically: the get-cert init containers dial
      # the in-guest attestation-api on loopback under kata
      # (c8s.attestationApiURL), which only exists inside an SNP guest — and
      # tls-lb terminates client TLS with mesh-issued keys, so its plaintext
      # must stay inside the TEE boundary.
      runtimeClassName: kata-qemu-snp
      
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: confidential.ai/kata-guest-ready
                    operator: In
                    values: ["true"]
      
      shareProcessNamespace: true
      initContainers:
        - name: c8s-cert
          image: ghcr.io/confidential-dot-ai/c8s-operator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - get-cert
            - --cds-url=https://c8s-cds.c8s-system.svc:8443
            - --attestation-api-url=http://127.0.0.1:8400
            - --san=c8s-tls-lb.c8s-system.svc
            - --out=/tls/cert.pem
            - --key-out=/tls/key.pem
            - --key-mode=0640
            - --ca-out=/tls/ca.pem
            # Retry CDS in-process during a roll instead of exiting into kubelet
            # CrashLoopBackOff; still fails closed once the timeout elapses.
            - --initial-retry-timeout=2m
            - --renew-interval=1h
            - --reload-nginx=true
            - --continue-on-initial-error
            - --discovery-out=/discovery/discovery.json
            - --discovery-cds-cert-url=/.well-known/cds-cert.pem
            - --discovery-public-tls-mode=cds
            - --discovery-mesh-ca-url=/.well-known/mesh-ca.pem
            - --ca-watch-interval=1m
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
            - name: discovery
              mountPath: /discovery
          # The workload is gated on the initial cert by the c8s-cert-wait init
          # container below, not a startupProbe here: a native sidecar is "started"
          # the moment its process launches, and an exec startupProbe is denied by the
          # locked kata-qemu-snp guest (ExecProcessRequest := false), so it could never
          # pass there and the workload would hang in Init forever.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        # c8s-cert-wait gates the workload on the initial cert without an exec probe.
        # A plain (run-once) init container that blocks on the cert file is a
        # CreateContainerRequest the locked guest allows, and normal init-completion
        # ordering holds the workload until the attested cert exists — fail-closed.
        # The `/c8s` path is the binary location from cmd/c8s/Dockerfile; command
        # bypasses the ENTRYPOINT so the full path must match.
        - name: c8s-cert-wait
          image: ghcr.io/confidential-dot-ai/c8s-operator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          command:
            - /c8s
            - probe-file
            - --wait
            - --timeout=3m
            - /tls/cert.pem
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged@sha256:11f3f6249b4ae3d7a4ec2a51797060107b88ead52b33b6ed3c6c33f55ca96200
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              hostPort: 443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          # Under kata the RA-TLS mesh moves into the guest, which redirects
          # inbound TCP into a proxy expecting mutual attested TLS — but the
          # guest exempts exactly this port (C8S_MESH_INBOUND_PASSTHROUGH=
          # tcp:8443, pinned by the render guard above), so the certless kubelet
          # prober does reach nginx. A TCP accept is kept as the liveness and
          # readiness signal here because nginx's own /healthz says nothing the
          # accept does not; the cds-attest gate below is what needs a real
          # request, and it takes the httpGet path. Same shape as cds.yaml.
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            - name: discovery
              mountPath: /discovery
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
        - name: cds-attest
          image: ghcr.io/confidential-dot-ai/c8s-operator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          args:
            - cds-attest
            - --host=127.0.0.1
            - --port=8800
            - --platform=snp
            - --generation=genoa
            - --attestation-api-url=http://127.0.0.1:8400
            # attest-lb transport trust rests on the serving key being TEE-held:
            # a publicTLS Secret's key is host-visible, so that front door is
            # attest-pq-only and the sidecar refuses attest-lb with
            # unsupported_front_door.
            - --front-door-mode=cds
            # Bind the *exact* leaf nginx presents on the wire (ssl_certificate =
            # publicCertPath), so the attest-lb binding (GET
            # /.well-known/c8s/attest-lb) commits report_data to the leaf DER a
            # direct-TLS client actually sees. With the default (publicTLS
            # unset) this is the mesh leaf at tlsMountPath/cert.pem; with a
            # publicTLS secret it is that cert (mounted below, attest-pq-only
            # per --front-door-mode above). Re-read per request, so get-cert
            # renewals are picked up.
            - --serving-cert-file=/tls/cert.pem
            # The identity-bound PQ flow must use the TEE-held mesh
            # credential, never the optional publicTLS Secret: report_data
            # commits the hybrid session key to this leaf and the sidecar
            # proves possession with its matching private key.
            - --mesh-identity-cert-file=/tls/cert.pem
            - --mesh-identity-key-file=/tls/key.pem
            - --mesh-identity-ca-file=/tls/ca.pem
            # Terminate over-encryption here and forward to the same workload
            # backend nginx proxies to. An http upstream is plaintext at the
            # app layer; pointed at a headless Service (an adopted workload),
            # the node mesh wraps the pod-IP hop in attested mTLS. An https
            # upstream terminates TLS itself and gets the mTLS args below.
            # No adopted workload (empty upstream address) -> omit --upstream
            # entirely; the sidecar then serves attestation with its echo
            # backend instead of crashing on a scheme-only URL.
            - --upstream=http://c8s-infer.c8s-system.svc.cluster.local:8000
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
        # nginx terminates the public, tls-lb-attested connection and forwards
        # /allowlist over pod loopback. This sidecar establishes the second
        # trust hop: it verifies CDS's RA-TLS evidence before proxying.
        - name: allowlist-proxy
          image: ghcr.io/confidential-dot-ai/c8s-operator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          args:
            - allowlist-proxy
            - --host=127.0.0.1
            - --port=8801
            - --cds-url=https://c8s-cds.c8s-system.svc:8443
            - --attestation-api-url=http://127.0.0.1:8400
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: discovery
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # medium: Memory is load-bearing under kata-qemu-snp with
        # shared_fs="none": a default (disk-backed) emptyDir gets provisioned
        # through kata-agent's CDH secure-storage path inside the guest and
        # fails CreateContainer ("[CDH] [ERROR]: Secure Mount failed").
        # tmpfs-backed emptyDirs are mounted directly by the guest kernel.
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-config
          configMap:
            name: c8s-tls-lb-nginx
        
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

