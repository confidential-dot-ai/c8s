# Source: c8s/templates/kata-image-puller.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: c8s-kata-deploy-image-puller
  namespace: c8s-system
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: kata-image-puller
data:
  pull-and-configure.sh: |
    #!/bin/sh
    # Pull the kata-guest-base rootfs image (hardened kernel + dm-verity
    # rootfs) into the host kata-images dir and rewrite the confidential
    # kata runtime's config so kata-runtime boots our kernel + verity rootfs
    # for every pod (measured direct-kernel boot, no IGVM).
    #
    # One kata-guest-base artifact serves both kata-qemu-snp (AMD SEV-SNP) and
    # kata-qemu-tdx (Intel TDX): the vmlinuz has both TEE guest drivers built
    # in (runtime-probed), the rootfs bytes are TEE-neutral, and the dm-verity
    # root_hash is the same across shims. SHIM_NAME selects which shim's toml
    # to rewrite. On the SNP shims we also pin default_vcpus=1 because the SNP
    # launch digest measures per-vCPU VMSAs; the TDX shims need no pin — see
    # the default_vcpus note below.
    #
    # The confidential-GPU shim (qemu-nvidia-gpu-snp) is driven by the same
    # script from its own puller DaemonSet: TAG points at the separate
    # kata-guest-base:<tag>-nvidia artifact (stock kata NVIDIA confidential
    # rootfs, see docs/kata-gpu.md) and the GPU_* knobs add the VFIO
    # cold-plug config on top. Same drop-in mechanism, same measured
    # direct-kernel boot.
    #
    # Pure POSIX shell, kept as a standalone file (templated into the
    # kata-image-puller ConfigMap via .Files.Get) so it gets shellcheck.
    # All configuration comes from the environment, set on the puller
    # initContainer from .Values.kata.guestImage.* — there is no helm
    # interpolation inside this script.
    #
    #   REGISTRY        guest-image registry (e.g. ghcr.io/confidential-dot-ai)   [required]
    #   TAG             kata-guest-base tag (e.g. main, or main-nvidia) [required]
    #   HOST_IMG_DIR    /host-prefixed dir the puller writes into       [required]
    #   SHIM_NAME       confidential shim to configure: qemu-snp, qemu-tdx, or
    #                   qemu-nvidia-gpu-snp (confidential GPU — adds the VFIO
    #                   cold-plug knobs below)
    #                   [default qemu-snp — backward compat with pre-TDX chart]
    #   GPU_PCIE_ROOT_PORT  `pcie_root_port = N` (VFIO cold-plug); REQUIRED for
    #                   the GPU shim, ignored otherwise                 [optional]
    #   GPU_DEFAULT_MEMORY  `default_memory = N` (MiB) for the GPU shim [optional]
    #   KATA_DEBUG      "true" to keep debug_console_enabled + journal-to-console
    #                   in the shim toml (dev only — host reads guest journal).
    #                   Default false = puller strips both so a leaked hand-patch
    #                   or a debug-variant install-then-normal-reinstall doesn't
    #                   silently ship a guest that streams its journal to the host.
    #   ORAS_INSECURE   "true" to pull over plain HTTP (local mirror)   [optional]
    #
    # Usage: pull-and-configure.sh [check]
    #   "check" validates only (fingerprint + pulled artifacts) and exits 0/1
    #   without pulling or writing — the puller's readiness probe.
    set -eu
    
    MODE="${1:-reconcile}"
    : "${REGISTRY:?REGISTRY must be set (kata.guestImage.repository)}"
    : "${TAG:?TAG must be set (kata.guestImage.tag)}"
    : "${HOST_IMG_DIR:?HOST_IMG_DIR must be set (/host + kata.guestImage.hostPath)}"
    HOST_IMG_DIR="${HOST_IMG_DIR%/}"
    SHIM_NAME="${SHIM_NAME:-qemu-snp}"
    case "${SHIM_NAME}" in
        qemu-snp|qemu-tdx|qemu-nvidia-gpu-snp|qemu-nvidia-gpu-tdx) ;;
        *) echo "ERROR: SHIM_NAME must be qemu-snp, qemu-tdx, qemu-nvidia-gpu-snp, or qemu-nvidia-gpu-tdx (got '${SHIM_NAME}')" >&2; exit 1 ;;
    esac
    KATA_DEBUG="${KATA_DEBUG:-false}"
    GPU_PCIE_ROOT_PORT="${GPU_PCIE_ROOT_PORT:-}"
    GPU_DEFAULT_MEMORY="${GPU_DEFAULT_MEMORY:-}"
    # pcie_root_port is load-bearing for the GPU shim: VFIO cold-plug attaches
    # each passed-through GPU behind a pcie-root-port, and the stock SNP-GPU
    # config ships 0 (passthrough disabled). A GPU pod boots fine with 0 but has
    # NO device, surfacing only as a missing /dev/nvidia* in-guest — so an unset
    # knob is a hard error, not a warning: the puller exits non-zero and stays
    # NotReady (visible at rollout) rather than silently shipping a deviceless
    # runtime. default_memory is a tuning knob (the in-guest NVIDIA driver's
    # BAR-mapping path OOMs the stock guest during device init), not load-bearing
    # for passthrough, so it stays optional.
    case "${SHIM_NAME}" in
        qemu-nvidia-gpu-*)
            case "${GPU_PCIE_ROOT_PORT}" in
                ''|0)
                    echo "ERROR: GPU_PCIE_ROOT_PORT must be >= 1 for SHIM_NAME=${SHIM_NAME} (kata.gpu.guestImage.pcieRootPort, also enforced at chart render) — refusing to ship a GPU runtime with VFIO cold-plug disabled" >&2
                    exit 1
                    ;;
            esac
            ;;
    esac
    # --plain-http makes oras talk to an insecure (HTTP, no TLS) registry — for
    # local / in-cluster mirrors only. Empty for a normal TLS registry.
    ORAS_OPTS=""
    [ "${ORAS_INSECURE:-false}" = "true" ] && ORAS_OPTS="--plain-http"
    HOST_KATA_DIR="${HOST_KATA_DIR:-/host/opt/kata}"
    KATA_CONFIG_DIR="${HOST_KATA_DIR}/share/defaults/kata-containers"
    
    echo "==> c8s-kata-image-puller: registry=${REGISTRY} tag=${TAG}"
    
    # Resolve the target shim config before doing any work: the main toml is
    # also an input to the drop-in (base kernel_params), and failing before the
    # pull beats failing after it while kata-deploy is still installing.
    cfg_dir="${KATA_CONFIG_DIR}/runtimes/${SHIM_NAME}"
    main_cfg="${cfg_dir}/configuration-${SHIM_NAME}.toml"
    if [ ! -f "${main_cfg}" ]; then
        echo "ERROR: ${main_cfg} missing — has kata-deploy finished?" >&2
        exit 1
    fi
    base_kernel_params="$(sed -n 's/^kernel_params = "\(.*\)"$/\1/p' "${main_cfg}" | head -1)"
    
    dropin_dir="${cfg_dir}/config.d"
    dropin="${dropin_dir}/50-c8s.toml"
    
    # Level-triggered reconcile: the drop-in embeds a fingerprint of every input
    # that shapes it. Re-run the full pull+rewrite when the fingerprint differs
    # (values change, kata-deploy bumped the base kernel_params) or the artifact
    # went missing; exit early otherwise so the steady-state tick stays free of
    # writes (no clobber races) and network pulls. A re-published artifact under
    # the SAME tag is deliberately not detected: running clusters do NOT pick up
    # new kata-guest-base artifacts.
    # gen= versions the generator itself: bump it whenever the emitted TOML
    # changes shape, so nodes with unchanged inputs still rewrite. gen=3 wires the
    # host qemu wrapper via `[hypervisor.qemu] path=`; an older drop-in without it
    # leaves volume-annotated pods hanging at first StartContainer.
    config_fingerprint="gen=3|registry=${REGISTRY}|tag=${TAG}|dir=${HOST_IMG_DIR}|shim=${SHIM_NAME}|debug=${KATA_DEBUG}|pcie=${GPU_PCIE_ROOT_PORT}|mem=${GPU_DEFAULT_MEMORY}|base_params=${base_kernel_params}"
    marker="# c8s-config: ${config_fingerprint}"
    
    out_dir="${HOST_IMG_DIR}/base"
    wrapper_dst="${HOST_KATA_DIR}/bin/kata-qemu-scratch-wrapper.sh"
    up_to_date=false
    if [ -f "${dropin}" ] && grep -qFx "${marker}" "${dropin}"; then
        up_to_date=true
        for required in vmlinuz kata-rootfs.img kernel_verity_params rootfs_type; do
            [ -f "${out_dir}/${required}" ] || up_to_date=false
        done
        # A wrapper that got swept between reconciles must trigger the full pass so
        # the drop-in and the on-disk wrapper stay in lockstep.
        [ -x "${wrapper_dst}" ] || up_to_date=false
    fi
    if [ "${up_to_date}" = "true" ]; then
        echo "==> c8s-kata-image-puller: up to date (shim=${SHIM_NAME}, mode=${MODE})"
        exit 0
    fi
    # check = the readiness probe: report not-current, change nothing. Readiness
    # gates on the CURRENT fingerprint + artifacts, so a stale drop-in left by
    # older values cannot mark the pod Ready (or pass helm --wait) while the
    # reconcile loop is failing to apply the new configuration.
    if [ "${MODE}" = "check" ]; then
        echo "check: node not reconciled to the current puller config (shim=${SHIM_NAME})" >&2
        exit 1
    fi
    
    mkdir -p "${HOST_IMG_DIR}" "${KATA_CONFIG_DIR}"
    
    # Pull into a clean staging dir and activate by whole-dir rename: oras does
    # not remove files absent from the new artifact, so an in-place pull could
    # leave a mix of releases that still passes the existence checks below.
    staging="${HOST_IMG_DIR}/.staging"
    rm -rf "${staging}"
    mkdir -p "${staging}"
    
    echo "==> Pulling kata-guest-base:${TAG}"
    # oras unpacks the artifact's contents into CWD.
    # shellcheck disable=SC2086  # ORAS_OPTS is a controlled single flag ("" or --plain-http)
    ( cd "${staging}" && oras pull ${ORAS_OPTS} "${REGISTRY}/kata-guest-base:${TAG}" )
    
    # Sanity, in staging BEFORE activation: the artifact must contain the
    # kernel, the verity rootfs image, and the verity params + rootfs-type
    # sidecars. Fail loudly and leave the previous artifact live — silently
    # activating a config that points at a missing file (or, worse, one with
    # empty verity params, which would DISABLE dm-verity and drop the rootfs
    # out of the measurement) leaves the runtime broken or insecure in a way
    # that only surfaces at pod start.
    for required in vmlinuz kata-rootfs.img kernel_verity_params rootfs_type; do
        if [ ! -f "${staging}/${required}" ]; then
            echo "ERROR: ${staging}/${required} missing after oras pull" >&2
            exit 1
        fi
    done
    
    # Verity params + rootfs type come from the build (these sidecars
    # mirror manifest.json). kernel_verity_params is load-bearing: an
    # empty value would make kata boot WITHOUT dm-verity (rootfs no longer
    # measured / tamper-evident), so refuse anything but a real root_hash.
    KVP="$(tr -d '\n' < "${staging}/kernel_verity_params")"
    RFT="$(tr -d '\n' < "${staging}/rootfs_type")"
    case "${KVP}" in
        root_hash=*) ;;
        *) echo "ERROR: kernel_verity_params is not a 'root_hash=…' string: '${KVP}'" >&2; exit 1 ;;
    esac
    [ -n "${RFT}" ] || RFT=ext4
    
    # Activate the validated staging dir in place of the previous artifact —
    # nothing from an older release survives the swap.
    old_dir="${out_dir}.old"
    rm -rf "${old_dir}"
    [ ! -d "${out_dir}" ] || mv "${out_dir}" "${old_dir}"
    mv "${staging}" "${out_dir}"
    rm -rf "${old_dir}"
    
    # Translate /host<...> back to the on-host absolute path the
    # kata configuration TOML will reference. The puller pod sees
    # the host root at /host; kata-runtime running on the host
    # sees the same files without the prefix.
    host_out_dir="${out_dir#/host}"
    
    # Install the host-side qemu wrapper next to kata's real qemu binary. It
    # resolves the pod's encrypted-volume annotation into a `-device virtio-blk`
    # argv addition before exec'ing the real qemu. Copy is via a temp path +
    # rename so a puller restart mid-copy can't leave a partial script in the
    # path kata is about to exec. Executable-bit is load-bearing: kata calls
    # hypervisor.qemu path directly, no shell in between. wrapper_dst was pinned
    # above so the up-to-date check gates on the same file this write produces.
    wrapper_src="/scripts/kata-qemu-scratch-wrapper.sh"
    host_wrapper_dst="${wrapper_dst#/host}"
    mkdir -p "$(dirname "${wrapper_dst}")"
    cp "${wrapper_src}" "${wrapper_dst}.c8s-tmp"
    chmod 0755 "${wrapper_dst}.c8s-tmp"
    mv -f "${wrapper_dst}.c8s-tmp" "${wrapper_dst}"
    
    # c8s writes ONLY a config.d/ drop-in — never the main configuration-<shim>.toml.
    #
    # kata-deploy owns the main toml (`configuration-qemu-snp.toml` /
    # `configuration-qemu-tdx.toml`) and rewrites it every time the DaemonSet's pod
    # restarts. Editing the main file in place produces a race the puller keeps
    # losing: kata-deploy restarts → clobbers our patch → next sandbox launches
    # with stock kata paths → containerd stack fails at rootfs mount (SNP: stock
    # vmlinuz doesn't have the c8s in-guest bits; TDX: stock vmlinuz doesn't have
    # TDX guest driver either).
    #
    # kata-runtime's config loader (src/runtime/pkg/katautils/config.go
    # decodeDropIns / updateFromDropIn) reads every *.toml in a `config.d/`
    # subdirectory next to the main file in alphabetical order AFTER the main
    # file, and each drop-in's set fields override the main file's values.
    # kata-deploy never touches config.d/, so a drop-in survives DS restarts
    # by design. This is exactly the mechanism the main-toml header comment
    # points operators at ("do not modify this file; put overrides in
    # config.d/").
    mkdir -p "${dropin_dir}"
    
    echo "  Writing ${dropin}"
    # Compose the drop-in. Fields we set:
    #
    #   [hypervisor.qemu]
    #     kernel / image       -> our hardened vmlinuz + dm-verity rootfs
    #     rootfs_type          -> ext4 (from the osbuilder rootfs_type sidecar)
    #     kernel_verity_params -> the root_hash/salt/blocks matching the rootfs;
    #                             kata builds the dm-verity table from these and
    #                             folds the resulting hash into the launch
    #                             measurement (SNP kernel-hashes / TDX RTMR[1])
    #     shared_fs = "none"   -> no virtio-fs into the confidential guest
    #     kernel_params        -> the stock shim toml's params, preserved verbatim
    #                             (re-emitted so a drop-in rewrite can't clobber them)
    #     default_vcpus/maxvcpus = 1 -> SNP-ONLY (both SNP shims, CPU and GPU).
    #                             Pins the boot-time VMSA count so the launch
    #                             digest is stable across pods. No pin on the TDX
    #                             shims: the one TDX register c8s pins (MRTD, the
    #                             launch_digest allowlist) measures TDVF firmware
    #                             pages + SEPT — vCPU init (TDH.VP.INIT) and guest
    #                             RAM size never enter it. The (vCPU, memory)-
    #                             sensitive register is RTMR[0] (TDVF's TD-HOB),
    #                             which c8s does not verify (the CC event log is
    #                             stripped — see c8s pkg/attestclient/tdx.go).
    #     pcie_root_port        -> GPU shim only: VFIO cold-plug root ports
    #                             (kata.gpu.pcieRootPort; validated non-empty
    #                             above).
    #     default_memory        -> GPU shim only, optional: guest memory floor
    #                             for the NVIDIA driver's BAR mapping
    #                             (kata.gpu.defaultMemoryMiB).
    #     debug_console_enabled -> forced false unless KATA_DEBUG=true (the
    #                             chart derives this from kata.guestImage.debug).
    #
    #   [runtime]
    #     experimental_force_guest_pull = true -> with shared_fs="none" the
    #                             kata-agent inside the VM pulls the workload
    #                             OCI image over the guest network (image-rs +
    #                             CDH). Without this, the shim fails at
    #                             `failed to mount /run/kata-containers/shared/
    #                             containers/<id>/rootfs ... ENOENT`.
    tmp="${dropin}.c8s-tmp"
    {
        echo '# c8s kata-image-puller drop-in — MANAGED FILE, DO NOT EDIT.'
        echo '#'
        echo '# Layered on top of the sibling configuration-'"${SHIM_NAME}"'.toml by'
        echo '# kata-runtime (see src/runtime/pkg/katautils/config.go decodeDropIns).'
        echo '# Regenerated on every c8s-kata-image-puller reconcile from the'
        echo '# published kata-guest-base:<tag> artifact under '"${host_out_dir}"'.'
        echo '# The c8s-config line is the reconcile fingerprint — a mismatch with'
        echo '# the current puller env triggers a full re-pull + rewrite.'
        echo "${marker}"
        echo ''
        echo '[hypervisor.qemu]'
        # Wrap qemu so the launcher can attach this pod's encrypted volume devices
        # (docs/volumes.md): kata's direct-volume path assumes ciphertext-free
        # storage kata-agent can mount, and the wrapper carries only the volume
        # attachment logic — the base qemu path is CONFAI_REAL_QEMU. Without the
        # override the LIO disk `c8s volume attach` writes to the node is never
        # attached to the guest, and the sandbox times out at first StartContainer.
        printf 'path = "%s"\n' "${host_wrapper_dst}"
        printf 'kernel = "%s/vmlinuz"\n' "${host_out_dir}"
        printf 'image = "%s/kata-rootfs.img"\n' "${host_out_dir}"
        printf 'rootfs_type = "%s"\n' "${RFT}"
        printf 'kernel_verity_params = "%s"\n' "${KVP}"
        echo 'shared_fs = "none"'
        # kata's decodeDropIns REPLACES scalar keys (updateFromDropIn decodes
        # over the loaded struct), so a bare kernel_params here would clobber the
        # stock toml's load-bearing params (qemu-tdx: cgroup_no_v1=all
        # systemd.unified_cgroup_hierarchy=1; qemu-nvidia-gpu-*: cgroup_no_v1=all
        # pci=realloc pci=nocrs pci=assign-busses nvrc.smi.srs=1 — dropping
        # cgroup_no_v1 kills the NVRC-exec'd kata-agent at startup). Re-emit the
        # base value verbatim. A live session once saw drop-in kernel_params edits
        # not reach the qemu -append line — unexplained — but the config semantics
        # make this preservation load-bearing whenever the drop-in IS honored, so
        # it stays.
        if [ -n "${base_kernel_params}" ]; then
            printf 'kernel_params = "%s"\n' "${base_kernel_params}"
        fi
        case "${SHIM_NAME}" in
            *-snp)
                echo 'default_vcpus = 1'
                echo 'default_maxvcpus = 1'
                ;;
        esac
        case "${SHIM_NAME}" in
            qemu-nvidia-gpu-*)
                printf 'pcie_root_port = %s\n' "${GPU_PCIE_ROOT_PORT}"
                if [ -n "${GPU_DEFAULT_MEMORY}" ]; then
                    printf 'default_memory = %s\n' "${GPU_DEFAULT_MEMORY}"
                fi
                ;;
        esac
        # debug_console_enabled is an [agent.kata] key, not [hypervisor.qemu]:
        # kata's decodeDropIns validates each drop-in key against the config
        # struct and fails the whole sandbox on a misplaced key
        # ("error applying key 'hypervisor.qemu.debug_console_enabled'").
        echo ''
        echo '[agent.kata]'
        if [ "${KATA_DEBUG}" = "true" ]; then
            echo 'debug_console_enabled = true'
        else
            echo 'debug_console_enabled = false'
        fi
        case "${SHIM_NAME}" in
            qemu-snp|qemu-tdx)
                # Stock CPU-shim dial/create timeouts (60-90s across kata
                # versions) are too short for a large-memory TEE guest (TDX page
                # acceptance, observed flaky at 128 GiB) to reach the agent's
                # vsock listener. 600s matches the kubelet runtime-request-timeout
                # guidance (QUICKSTART); the GPU shims already ship 1200s in their
                # base toml — leave those alone.
                echo 'dial_timeout = 600'
                ;;
        esac
        echo ''
        echo '[runtime]'
        echo 'experimental_force_guest_pull = true'
        case "${SHIM_NAME}" in
            qemu-snp|qemu-tdx)
                echo 'create_container_timeout = 600'
                ;;
        esac
    } > "${tmp}"
    mv -f "${tmp}" "${dropin}"
    
    echo "==> c8s-kata-image-puller: done (shim=${SHIM_NAME}, dropin=${dropin})"
    
  # Host-side qemu wrapper. Attaches this pod's encrypted volume devices to the
  # kata guest, since kata's own direct-volume path assumes ciphertext-free
  # storage. Installed onto the host and pointed at from the drop-in's
  # [hypervisor.qemu] path by pull-and-configure.sh. Byte-identical to
  # kata-guest-base/scripts/kata-qemu-scratch-wrapper.sh (enforced by
  # internal/helmchart/chart_test.go).
  kata-qemu-scratch-wrapper.sh: |
    #!/bin/bash
    # PROTOTYPE kata qemu wrapper. It attaches two kinds of disk to a guest:
    #
    #  1. a per-VM ephemeral scratch disk, so the in-guest confidential image store
    #     (extra/usr/local/lib/c8s/scratch-setup.sh) can unpack large images to
    #     encrypted disk instead of RAM;
    #  2. this pod's encrypted volumes (docs/volumes.md), so the in-guest volumed
    #     can open them. kata-agent always mounts a block storage it is handed, and
    #     these carry ciphertext it cannot mount, so they must reach the guest as
    #     bare devices rather than through kata's direct-volume assignment.
    #
    # Kata has no native per-sandbox disk knob for either, so we intercept the qemu
    # launch: set [hypervisor.qemu] path = <this script> in the kata-qemu-tdx
    # config. Each disk is found in the guest by its virtio serial
    # (/sys/block/<dev>/serial), and carries only ciphertext — the host cannot read
    # either one.
    #
    # Which volumes to attach comes from the pod's host-written annotation, which is
    # a selector and not a trust input: naming another tenant's device attaches
    # ciphertext the host already holds, and the guest still cannot open it without
    # the key CDS releases against the allowlist grant (docs/volumes.md, "The serial
    # is a selector, not a trust input"). Devices are attached read-write: a mutable
    # volume exists to be written, and the host cannot tell one from immutable —
    # the mode lives in the key blob, which the host never sees. An immutable
    # volume's writes are refused in the guest, at its dm-crypt mapping.
    #
    # PRODUCTION NOTE: still a prototype. The clean version attaches the disks from
    # the kata runtime (or a CDI device) rather than wrapping qemu. Tunables via env:
    # CONFAI_REAL_QEMU, CONFAI_SCRATCH_DIR, CONFAI_SCRATCH_SIZE, CONFAI_GC_GRACE_SECS,
    # CONFAI_BUNDLE_ROOTS, CONFAI_SYS_BLOCK.
    set -euo pipefail
    
    QEMU="${CONFAI_REAL_QEMU:-/opt/kata/bin/qemu-system-x86_64}"
    SDIR="${CONFAI_SCRATCH_DIR:-/var/lib/kata-scratch}"
    SIZE="${CONFAI_SCRATCH_SIZE:-30G}"
    GRACE="${CONFAI_GC_GRACE_SECS:-120}"
    SYSBLOCK="${CONFAI_SYS_BLOCK:-/sys/block}"
    # Where containerd writes the sandbox's OCI bundle. RKE2/k3s keep their own
    # state root, so both are searched unless overridden.
    BUNDLE_ROOTS="${CONFAI_BUNDLE_ROOTS:-/run/containerd/io.containerd.runtime.v2.task/k8s.io /run/k3s/containerd/io.containerd.runtime.v2.task/k8s.io}"
    
    # The annotation naming this pod's volumes, and the serial prefix the guest
    # matches on. Both must agree with the Go side: pkg/allowlist (the annotation)
    # and internal/cmds/volume (SerialPrefix).
    VOLUMES_ANNOTATION="confidential.ai/c8s-volumes"
    SERIAL_PREFIX="c8s-vol-"
    
    # The scratch file MUST be keyed on a reliably-unique id: two VMs sharing one
    # raw disk would corrupt each other. Kata passes the sandbox id in the -name
    # argument ("-name sandbox-<64hex>,..."); take the id from THAT arg only (not
    # "first 64-hex anywhere in argv", which could match an unrelated value). If we
    # can't find it, FAIL — never fall back to a shared name.
    name=""
    prev=""
    for a in "$@"; do
        [ "$prev" = "-name" ] && { name="$a"; break; }
        prev="$a"
    done
    SBID="$(printf '%s' "$name" | grep -oE '[a-f0-9]{64}' | head -1 || true)"
    if [ -z "$SBID" ]; then
        echo "kata-qemu-scratch-wrapper: no sandbox id in -name ('$name'); refusing to launch with a shared scratch disk" >&2
        exit 1
    fi
    
    mkdir -p "$SDIR"
    
    # GC scratch files from VMs that are gone: no process holds the file open AND it
    # is older than the grace window. The grace window makes this safe against a
    # concurrently-launching VM whose file already exists but whose qemu has not
    # opened it yet — that file is fresh, so it is skipped.
    for f in "$SDIR"/scratch-*.img; do
        [ -e "$f" ] || continue
        if [ -z "$(find "$f" -newermt "-${GRACE} seconds" 2>/dev/null)" ] && ! fuser "$f" >/dev/null 2>&1; then
            rm -f "$f"
        fi
    done
    
    IMG="$SDIR/scratch-$SBID.img"
    truncate -s "$SIZE" "$IMG"
    
    # volume_names prints this pod's volume names, one per line.
    #
    # The bundle's config.json holds the pod annotations. Rather than parse JSON,
    # the fixed key's value is extracted and every candidate name is validated
    # against the same DNS-1123 label rule (and 12-char serial cap) the webhook, the
    # sidecar and volumed all apply — so a value crafted to confuse the extraction
    # yields names that fail validation and are skipped, never a shell word.
    volume_names() {
        local cfg="" root
        for root in $BUNDLE_ROOTS; do
            if [ -f "$root/$SBID/config.json" ]; then
                cfg="$root/$SBID/config.json"
                break
            fi
        done
        [ -n "$cfg" ] || return 0
    
        local raw
        raw="$(grep -o "\"$VOLUMES_ANNOTATION\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" "$cfg" |
            head -1 | sed 's/.*:[[:space:]]*"//; s/"$//' || true)"
        [ -n "$raw" ] || return 0
    
        # Trailing newline matters: without it `read` drops the last entry, and the
        # pod would silently lose its final volume.
        printf '%s\n' "$raw" | tr ',' '\n' | while IFS= read -r entry; do
            local name="${entry%%=*}"
            if printf '%s' "$name" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' &&
                [ "${#name}" -le 12 ]; then
                printf '%s\n' "$name"
            else
                echo "kata-qemu-scratch-wrapper: ignoring malformed volume entry '$entry'" >&2
            fi
        done
    }
    
    # serial_of prints a block device's serial, from whichever sysfs spelling its
    # transport provides: virtio-blk publishes <dev>/serial, SCSI publishes VPD
    # page 0x80 at <dev>/device/vpd_pg80. `c8s volume attach` drives LIO, so a
    # host that cannot set a virtio serial reaches the guest only through the
    # latter. Prints nothing when the device has no serial at all.
    # Mirrors SerialDevices.serialOf in internal/cmds/volumed.
    serial_of() {
        local d="$1"
        if [ -r "$d/serial" ]; then
            tr -d '[:space:]' <"$d/serial"
            return 0
        fi
        [ -r "$d/device/vpd_pg80" ] || return 0
        # Device type, page code 0x80, big-endian uint16 length, then the serial
        # padded to a fixed width. sysfs reports size 0, so the declared length is
        # the only bound; it is trusted only as far as the bytes actually read.
        od -An -tu1 -v "$d/device/vpd_pg80" 2>/dev/null | awk '
            { for (i = 1; i <= NF; i++) b[n++] = $i }
            END {
                if (n < 4) exit
                end = 4 + b[2] * 256 + b[3]
                if (end <= 4 || end > n) end = n
                s = ""
                for (i = 4; i < end; i++) if (b[i] != 0) s = s sprintf("%c", b[i])
                print s
            }' | tr -d '[:space:]'
    }
    
    # device_for prints the block device carrying serial $SERIAL_PREFIX$1.
    #
    # A serial matching more than one device is refused rather than resolved to
    # whichever was read first: the host can attach two devices claiming the same
    # serial, and picking one would make which volume a pod gets depend on scan
    # order. Mirrors SerialDevices.Device in internal/cmds/volumed.
    device_for() {
        local want="$SERIAL_PREFIX$1" found=() d serial
        for d in "$SYSBLOCK"/*; do
            serial="$(serial_of "$d")"
            [ -n "$serial" ] || continue
            [ "$serial" = "$want" ] && found+=("$(basename "$d")")
        done
        if [ "${#found[@]}" -ne 1 ]; then
            echo "kata-qemu-scratch-wrapper: ${#found[@]} block devices carry serial $want; not attaching" >&2
            return 1
        fi
        printf '/dev/%s\n' "${found[0]}"
    }
    
    # A missing or ambiguous device is logged and skipped rather than failing the
    # launch: refusing here surfaces as an opaque shim error on a pod that never
    # starts, whereas letting it boot leaves the in-guest daemon to answer "volume
    # device is not present", which is where an operator is already looking.
    volume_args=()
    n=0
    while IFS= read -r vol; do
        [ -n "$vol" ] || continue
        if dev="$(device_for "$vol")"; then
            volume_args+=(
                -drive "file=$dev,format=raw,if=none,id=confaivol$n,cache=none"
                -device "virtio-blk-pci,drive=confaivol$n,serial=$SERIAL_PREFIX$vol"
            )
            n=$((n + 1))
        fi
    done < <(volume_names)
    
    # file.locking left at the qemu default (on): with unique per-sandbox files a
    # lock conflict now means a real bug (two launches, same id) and should fail
    # loudly rather than silently share the disk.
    exec "$QEMU" "$@" \
        -drive "file=$IMG,format=raw,if=none,id=confaiscratch,cache=none" \
        -device virtio-blk-pci,drive=confaiscratch,serial=confai-scratch \
        "${volume_args[@]+"${volume_args[@]}"}"
---
# Source: c8s/templates/tls-lb-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: c8s-tls-lb-nginx
  labels:
    helm.sh/chart: tls-lb-0.5.0
    app.kubernetes.io/name: tls-lb
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';
        access_log /var/log/nginx/access.log main;

        sendfile on;
        keepalive_timeout 65;

        # Rate-limit /allowlist while nginx still has the public client IP;
        # empty map keys are not accounted by limit_req. Mutations count per
        # client and in aggregate (the constant-key zone guards the shared
        # per-pod-IP CDS bucket; see docs/operator.md), reads per client;
        # OPTIONS (CORS preflight) is exempt. The total key chains off the
        # write key so the exempt-method list exists once.
        map $request_method $allowlist_write_rate_key {
            default $binary_remote_addr;
            GET "";
            HEAD "";
            OPTIONS "";
        }
        map $allowlist_write_rate_key $allowlist_write_total_key {
            "" "";
            default "all";
        }
        map $request_method $allowlist_read_rate_key {
            default "";
            GET $binary_remote_addr;
            HEAD $binary_remote_addr;
        }
        limit_req_zone $allowlist_write_rate_key zone=allowlist_write_per_client:10m rate=1r/s;
        limit_req_zone $allowlist_write_total_key zone=allowlist_write_total:1m rate=8r/s;
        limit_req_zone $allowlist_read_rate_key zone=allowlist_read_per_client:10m rate=20r/s;
        # A mesh-wrapped catch-all is dialed via a variable (see location /), so
        # nginx re-resolves it here at request time per record TTL: a static
        # upstream block would pin the pod IPs the adopted workload's headless
        # Service resolved to at startup and 502 after pod churn. Nothing
        # authenticates the answer -- the app-layer hop is plaintext and the
        # mesh binds the pod IP it is handed, not the name -- so an adversary
        # who can forge cluster DNS retargets this hop. Every other upstream
        # gets a static block below and no resolver is rendered at all.
        resolver kube-dns.kube-system.svc.cluster.local;

        server {
            listen 8443 ssl;
            server_name c8s-tls-lb.c8s-system.svc;

            ssl_certificate     /tls/cert.pem;
            ssl_certificate_key /tls/key.pem;

            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers on;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 1d;

            # Headroom for upstream responses with large headers.
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            # Built-in control-plane route. The exact + slash-prefix pair
            # exposes only /allowlist and its API subtree, not lookalike paths.
            location = /allowlist {
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Expose-Headers;
                if ($request_method = 'OPTIONS') {
                    add_header Access-Control-Allow-Origin  "*" always;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-C8s-Session" always;
                    add_header Access-Control-Max-Age       "600" always;
                    add_header Content-Length 0;
                    return 204;
                }
                add_header Access-Control-Allow-Origin "*" always;
                # These run before nginx collapses callers onto the loopback proxy source.
                # Each zone's map key is empty for the methods it does not cover, so
                # mutations count per client and in aggregate, reads per client only.
                limit_req zone=allowlist_write_per_client burst=5 nodelay;
                limit_req zone=allowlist_write_total burst=15 nodelay;
                limit_req zone=allowlist_read_per_client burst=40 nodelay;
                limit_req_status 429;
                proxy_pass http://127.0.0.1:8801$request_uri;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            location /allowlist/ {
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Expose-Headers;
                if ($request_method = 'OPTIONS') {
                    add_header Access-Control-Allow-Origin  "*" always;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-C8s-Session" always;
                    add_header Access-Control-Max-Age       "600" always;
                    add_header Content-Length 0;
                    return 204;
                }
                add_header Access-Control-Allow-Origin "*" always;
                # These run before nginx collapses callers onto the loopback proxy source.
                # Each zone's map key is empty for the methods it does not cover, so
                # mutations count per client and in aggregate, reads per client only.
                limit_req zone=allowlist_write_per_client burst=5 nodelay;
                limit_req zone=allowlist_write_total burst=15 nodelay;
                limit_req zone=allowlist_read_per_client burst=40 nodelay;
                limit_req_status 429;
                proxy_pass http://127.0.0.1:8801$request_uri;
                proxy_set_header Host $host;
                proxy_set_header Authorization $http_authorization;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            location = /v1/discovery {
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Expose-Headers;
                if ($request_method = 'OPTIONS') {
                    add_header Access-Control-Allow-Origin  "*" always;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-C8s-Session" always;
                    add_header Access-Control-Max-Age       "600" always;
                    add_header Content-Length 0;
                    return 204;
                }
                add_header Access-Control-Allow-Origin "*" always;
                access_log off;
                default_type application/json;
                add_header Cache-Control "no-store" always;
                alias /discovery/discovery.json;
            }

            location = /.well-known/cds-cert.pem {
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Expose-Headers;
                if ($request_method = 'OPTIONS') {
                    add_header Access-Control-Allow-Origin  "*" always;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-C8s-Session" always;
                    add_header Access-Control-Max-Age       "600" always;
                    add_header Content-Length 0;
                    return 204;
                }
                add_header Access-Control-Allow-Origin "*" always;
                access_log off;
                default_type application/x-pem-file;
                add_header Cache-Control "no-store" always;
                alias /tls/cert.pem;
            }
            location = /.well-known/mesh-ca.pem {
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Expose-Headers;
                if ($request_method = 'OPTIONS') {
                    add_header Access-Control-Allow-Origin  "*" always;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-C8s-Session" always;
                    add_header Access-Control-Max-Age       "600" always;
                    add_header Content-Length 0;
                    return 204;
                }
                add_header Access-Control-Allow-Origin "*" always;
                access_log off;
                default_type application/x-pem-file;
                add_header Cache-Control "no-store" always;
                alias /tls/ca.pem;
            }
            # The sidecar's readiness gate, proxied so kubelet can reach it.
            # cds-attest listens on loopback (its one listener also carries the
            # attestation, handshake and tunnel routes, which must not be
            # published on the pod IP), and under kata the guest redirects every
            # inbound port but this one into the mutual RA-TLS proxy, which
            # rejects the certless prober. So the probe rides the front door:
            # exact-match, ahead of any catch-all upstream.
            location = /readyz {
                access_log off;
                proxy_pass http://127.0.0.1:8800;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # c8s-verify attestation + over-encryption sidecar (loopback).
            # nginx serves the static cert(s) via discovery above; the dynamic
            # per-session endpoints — the explicit attest-pq and attest-lb
            # challenges and the PQ handshake/tunnel — are proxied to the
            # in-pod `cds-attest` sidecar. The prefix also covers the retired
            # /attestation path so the sidecar serves its explicit versioned
            # 400 (no alias or downgrade) instead of nginx 404ing it.
            # X-Real-IP is the address the sidecar meters each client by.
            location /.well-known/c8s/ {
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Expose-Headers;
                if ($request_method = 'OPTIONS') {
                    add_header Access-Control-Allow-Origin  "*" always;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-C8s-Session" always;
                    add_header Access-Control-Max-Age       "600" always;
                    add_header Content-Length 0;
                    return 204;
                }
                add_header Access-Control-Allow-Origin "*" always;
                proxy_pass http://127.0.0.1:8800;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            location / {
                set $backend_addr c8s-infer.c8s-system.svc.cluster.local:8000;
                proxy_pass http://$backend_addr;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_http_version 1.1;
            }

            location /healthz {
                access_log off;
                return 200 "ok\n";
                add_header Content-Type text/plain;
            }
        }
    }

