apiVersion: apps/v1
kind: Deployment
metadata:
  name: c8s-cds
  namespace: c8s-system
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cds
