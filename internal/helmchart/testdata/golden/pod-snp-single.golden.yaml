            # GPUs wedged by sandboxes killed mid-flight. Harmless: on no code
            # path the plugin's iommufd auto-detection takes. See the prior-art
            # role for the full history.
            - name: mask-iommu
              mountPath: /dev/iommu
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: vfio
          hostPath:
            path: /dev/vfio
        - name: sys
          hostPath:
            path: /sys
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: mask-iommu
          emptyDir: {}

