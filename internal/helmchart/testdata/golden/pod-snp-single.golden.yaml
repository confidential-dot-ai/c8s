spec:
  # Fail closed: a CEL evaluation error denies the pod. Every expression is
  # has()-guarded, so it should not error in practice.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        # pods/ephemeralcontainers is a separate resource to matchConstraints:
        # "pods" alone leaves an ephemeral container unevaluated, and one can
        # carry both a hostPath mount and a hostPort.
        resources: ["pods", "pods/ephemeralcontainers"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - c8s-system
            - kube-system
  validations:
    - expression: >-
        !has(object.spec.hostNetwork) || object.spec.hostNetwork == false
      message: "hostNetwork is reserved for c8s node components: a pod sharing the node network namespace could bind the privileged port CDS uses to identify the admission inventory, and impersonate it."
    - expression: >-
        !has(object.spec.hostPID) || object.spec.hostPID == false
      message: "hostPID is denied: sharing the node PID namespace defeats the kernel peer-credential binding the admission inventory uses to identify its caller."
    - expression: >-
        !has(object.spec.hostIPC) || object.spec.hostIPC == false
      message: "hostIPC is denied for tenant pods."
    - expression: >-
        (!has(object.spec.containers) || object.spec.containers.all(c,
          !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)))
      message: "hostPort is reserved for c8s node components: workloadclaims.DigestsPort (1019) is the admission inventory's identity, and a hostPort publishes a pod on the node's address without hostNetwork — so a tenant pod could answer as the inventory and have CDS resolve its signing key."
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath) ||
          (v.hostPath.path == "/var/run/nri-image-policy" &&
           has(v.hostPath.type) && v.hostPath.type == 'Directory' &&
           object.spec.containers.all(c, !has(c.volumeMounts) ||
             c.volumeMounts.all(m, m.name != v.name || (has(m.readOnly) && m.readOnly == true))) &&
           (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.volumeMounts) ||
             c.volumeMounts.all(m, m.name != v.name || (has(m.readOnly) && m.readOnly == true)))) &&
           (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.volumeMounts) ||
             c.volumeMounts.all(m, m.name != v.name || (has(m.readOnly) && m.readOnly == true))))))
      message: "hostPath volumes are denied, except a read-only mount of the admission inventory socket directory (the webhook-injected claims volume; it also holds the attestation-api socket): a writable mount of the node filesystem could swap those sockets (docs/getcert-workload-binding.md, Corner 7)."
---
# Source: c8s/templates/kata-enforcement.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: c8s-kata-enforcement
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: kata-enforcement
spec:
  # Fail closed: a CEL evaluation error denies the pod. The expression is
  # has()-guarded so it should not error in practice.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        # runtimeClassName is immutable after creation, so CREATE is the only
        # operation that can introduce a disallowed value.
        operations: [CREATE]
        resources: [pods]
  validations:
    # Allow a pod when it requests one of the kata RuntimeClasses this chart
    # installs — the non-confidential pair plus the declared platform's
    # confidential (CPU, GPU) pair (c8s.kataAllowedRuntimeClasses; keep in
    # lockstep with the RuntimeClasses and SHIMS_X86_64 in
    # templates/kata.yaml) — or when it uses a host namespace (kata cannot
    # run those — the webhook leaves them as ordinary containers). Reject
    # everything else, including a pod with no runtimeClassName: with
    # enforcement on the webhook injects one, so a pod reaching validation
    # without a class means the webhook did not run.
    - expression: >-
        (has(object.spec.runtimeClassName) && object.spec.runtimeClassName in ['kata-qemu', 'kata-clh', 'kata-qemu-snp', 'kata-qemu-snp-nvidia'])
        || (has(object.spec.hostNetwork) && object.spec.hostNetwork)
        || (has(object.spec.hostPID) && object.spec.hostPID)
        || (has(object.spec.hostIPC) && object.spec.hostIPC)
      message: >-
        c8s kata enforcement: workload pods must run under a kata RuntimeClass
        (kata-qemu, kata-clh, kata-qemu-snp, kata-qemu-snp-nvidia).
        The c8s operator webhook injects one automatically for pods that do
        not set runtimeClassName; a rejection here means the pod explicitly
        set a non-kata runtimeClassName, or the c8s operator is not running.
        Host-namespace pods are exempt.
      reason: Forbidden
---
