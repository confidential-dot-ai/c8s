            # per --front-door-mode above). Re-read per request, so get-cert
            # renewals are picked up.
            - --serving-cert-file=/tls/cert.pem
            # The identity-bound PQ flow must use the TEE-held mesh
            # credential, never the optional publicTLS Secret: report_data
            # commits the hybrid session key to this leaf and the sidecar
            # proves possession with its matching private key.
            - --mesh-identity-cert-file=/tls/cert.pem
            - --mesh-identity-key-file=/tls/key.pem
            - --mesh-identity-ca-file=/tls/ca.pem
            # Terminate over-encryption here and forward to the same workload
            # backend nginx proxies to. An http upstream is plaintext at the
            # app layer; pointed at a headless Service (an adopted workload),
            # the node mesh wraps the pod-IP hop in attested mTLS. An https
            # upstream terminates TLS itself and gets the mTLS args below.
            # No adopted workload (empty upstream address) -> omit --upstream
            # entirely; the sidecar then serves attestation with its echo
            # backend instead of crashing on a scheme-only URL.
            - --upstream=http://c8s-infer.c8s-system.svc.cluster.local:8000
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            
            - name: attestation-api-socket
              mountPath: /var/run/nri-image-policy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
