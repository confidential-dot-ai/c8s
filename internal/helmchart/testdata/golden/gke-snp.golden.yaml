apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-ratls-mesh-uid
  labels:
    helm.sh/chart: ratls-mesh-0.1.0
    app: c8s-ratls-mesh
    app.kubernetes.io/name: ratls-mesh
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/version: ""
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: c8s
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - c8s-system
            - kube-system
  validations:
    # 1337 is the mesh proxy's reserved UID; 0 means a root workload that
    # falls in no exemption cgroup. Both egress outside the mesh's scope —
    # deny them up-front.
    - expression: >-
        !has(object.spec.securityContext) ||
        !has(object.spec.securityContext.runAsUser) ||
        (object.spec.securityContext.runAsUser != 1337 &&
         object.spec.securityContext.runAsUser != 0)
      message: "Pod-level runAsUser 1337 is reserved for the ratls-mesh proxy; runAsUser 0 is not in any in-guest exemption cgroup."
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.runAsUser) ||
          (c.securityContext.runAsUser != 1337 &&
           c.securityContext.runAsUser != 0)
        )
      message: "Containers must not run as UID 1337 (reserved for the ratls-mesh proxy) or 0 (not in an exemption cgroup)."
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.runAsUser) ||
          (c.securityContext.runAsUser != 1337 &&
           c.securityContext.runAsUser != 0)
        )
      message: "Init containers must not run as UID 1337 (reserved for the ratls-mesh proxy) or 0 (not in an exemption cgroup)."
