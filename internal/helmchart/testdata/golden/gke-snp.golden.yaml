apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: c8s-attestation-api
  namespace: c8s-system
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: attestation-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: c8s
      app.kubernetes.io/component: attestation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: c8s
        app.kubernetes.io/component: attestation-api
      annotations:
        checksum/config: bdb0549d5c77ec6372665123327a5d455a263597e9b40e1d4f0ba46264837c5f
    spec:
      serviceAccountName: c8s-attestation-api
      tolerations:
        - operator: Exists
      containers:
        - name: attestation-api
          image: ghcr.io/confidential-dot-ai/attestation-api:gold
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/attestation-api/config.toml]
          ports:
            - name: http
              containerPort: 8400
          securityContext:
            # All modes need privileged. A hostPath device mount does NOT add a
            # device-cgroup rule, so open(/dev/sev-guest|/dev/tdx-guest|/dev/tpm0)
            # is EPERM from an unprivileged container regardless of SYS_RAWIO
            # (cgroup v2 eBPF device controller; K8s has no securityContext field
            # for a single device rule). TODO: drop privileged by routing SNP/TDX
            # attest through the TSM configfs report interface
            # (/sys/kernel/config/tsm/report), which is a filesystem and not
            # device-cgroup gated.
            privileged: true
            readOnlyRootFilesystem: true
            # Seccomp is independent of privileged: even a privileged container
            # keeps a syscall filter, and the attestation-api makes only normal
            # syscalls. RuntimeDefault narrows the kernel surface (this container
            # is the widest on the node) and matches every other component.
            # runAsNonRoot/cap-drop are moot while privileged, so this is the one
            # substantive hardening available until the configfs path lands.
            seccompProfile:
              type: RuntimeDefault
          # The API's health signal is the attest-proxy's exec probe: the API
          # binds pod loopback, which kubelet cannot dial.
          volumeMounts:
            - name: config
              mountPath: /etc/attestation-api
              readOnly: true
            - name: sev-guest
              mountPath: /dev/sev-guest
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
        # The on-node front door: publishes the pod-loopback API on a
        # hostPath Unix socket next to the admission inventory's socket, so
        # exactly host processes and pods the socket dir is mounted into can
        # request evidence.
        - name: attest-proxy
          image: ghcr.io/confidential-dot-ai/c8s-operator:gold
          imagePullPolicy: IfNotPresent
          args:
            - attest-proxy
            - --socket=/var/run/nri-image-policy/attestation-api.sock
            - --upstream=http://127.0.0.1:8400
          # uid 0 so the socket is root-owned (callers reject a socket owned
          # by anyone but root or themselves); runAsGroup is the socket's
          # group so the chgrp needs no CAP_CHOWN.
          securityContext:
            runAsUser: 0
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: [/c8s, attest-proxy, healthcheck, --socket, /var/run/nri-image-policy/attestation-api.sock]
            initialDelaySeconds: 2
            # Above the healthcheck's internal 3s budget (kubelet default is 1s).
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [/c8s, attest-proxy, healthcheck, --socket, /var/run/nri-image-policy/attestation-api.sock]
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/attestation-api
              readOnly: true
            - name: socket-dir
              mountPath: /var/run/nri-image-policy
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: config
          configMap:
            name: c8s-attestation-api
        # hostPath.type=CharDevice forces a hard failure on nodes that
        # lack the device, instead of silently mounting an empty file —
        # attestation evidence would then be silently bogus. Toggle each
        # device individually based on the host hardware shape.
        - name: sev-guest
          hostPath:
            path: /dev/sev-guest
            type: CharDevice
        # Shared with the admission inventory — see c8s.attestationApiSocket.
        - name: socket-dir
          hostPath:
            path: /var/run/nri-image-policy
            type: DirectoryOrCreate
