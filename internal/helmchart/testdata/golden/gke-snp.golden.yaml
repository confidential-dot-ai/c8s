apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: c8s-ratls-mesh
  namespace: c8s-system
  labels:
    helm.sh/chart: ratls-mesh-0.1.0
    app: c8s-ratls-mesh
    app.kubernetes.io/name: ratls-mesh
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/version: ""
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: c8s
    app.kubernetes.io/component: service-mesh
spec:
  selector:
    matchLabels:
      app: c8s-ratls-mesh
      app.kubernetes.io/name: ratls-mesh
      app.kubernetes.io/instance: c8s
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: c8s-ratls-mesh
        app.kubernetes.io/name: ratls-mesh
        app.kubernetes.io/instance: c8s
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15021"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: system-node-critical
      # iptables-sync must run in the host network namespace to intercept
      # node-level pod traffic rather than only the mesh pod's own traffic.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: c8s-ratls-mesh
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # workloadclaims.InventorySocketGID: the attest-proxy's socket is
        # group-owned by it; the mesh runs as uid 1337 and needs the group to
        # connect.
        supplementalGroups: [65532]
      
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        
        - name: attestation-api-socket
          hostPath:
            path: /var/run/nri-image-policy
            type: DirectoryOrCreate
      initContainers:
        # Native sidecar (K8s 1.29+): cleanup runs last on shutdown because
        # sidecars stop in reverse initContainer order.
