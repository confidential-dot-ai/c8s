spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow all TCP egress (intercepted by ratls-mesh); non-TCP egress is
    # dropped by the mesh's fail-closed guard. DNS/53 (UDP) to kube-system is
    # the sanctioned plaintext exception.
    - ports:
        - protocol: TCP
    - ports:
        - protocol: UDP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

