          imagePullPolicy: IfNotPresent
          args:
            - allowlist-proxy
            - --host=127.0.0.1
            - --port=8801
            - --cds-url=https://c8s-cds.c8s-system.svc:8443
            - --attestation-api-url=unix:///var/run/nri-image-policy/attestation-api.sock
          volumeMounts:
            
            - name: attestation-api-socket
              mountPath: /var/run/nri-image-policy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: discovery
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # medium: Memory is load-bearing under kata-qemu-snp with
        # shared_fs="none": a default (disk-backed) emptyDir gets provisioned
        # through kata-agent's CDH secure-storage path inside the guest and
        # fails CreateContainer ("[CDH] [ERROR]: Secure Mount failed").
        # tmpfs-backed emptyDirs are mounted directly by the guest kernel.
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-config
          configMap:
            name: c8s-tls-lb-nginx
        
        - name: attestation-api-socket
          hostPath:
            path: /var/run/nri-image-policy
            type: DirectoryOrCreate
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        # workloadclaims.InventorySocketGID: the inventory and attest-proxy
        # chgrp their sockets to this group so the non-root get-cert sidecar
        # (on the nginx uid) can connect. get-cert must stay on the nginx uid —
        # it SIGHUPs nginx on renewal, and a different uid gets "operation not
        # permitted", after which nginx serves a stale leaf that every
        # exact-DER client correctly refuses.
        supplementalGroups: [65532]
        seccompProfile:
          type: RuntimeDefault

