# Source: c8s/templates/operator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c8s-operator
  namespace: c8s-system
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: operator
spec:
  # The webhook serving CA is minted inside this pod and patched into one
  # MutatingWebhookConfiguration. Running multiple replicas can race CA bundles
  # and break admission TLS for requests routed to the wrong pod.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: c8s
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: c8s
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: c8s-operator
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: operator
          image: ghcr.io/confidential-dot-ai/c8s-operator:gold
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          args:
            - operator
            - --leader-election-namespace=c8s-system
            - --status-mirror-enabled=true
            - --get-cert-image=ghcr.io/confidential-dot-ai/c8s-operator:gold
            - --cds-url=https://c8s-cds.c8s-system.svc:8443
            - --webhook-config-name=c8s-pod-injector
            - --webhook-service-name=c8s-operator
            - --webhook-service-namespace=c8s-system
            - --attestation-api-url=unix:///var/run/nri-image-policy/attestation-api.sock
            - --cert-fs-group=65532
            - --cert-key-mode=0640
            - --get-cert-renew-interval=2h
            - --get-cert-run-as-user=65532
            - --get-cert-run-as-group=65532
            - --get-cert-run-as-non-root=true
            - --workload-claims-host-dir=/var/run/nri-image-policy
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 30
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            # readOnlyRootFilesystem: true forces any transient files
            # (controller-runtime cache tempfiles, etc.) to land in
            # this emptyDir rather than the immutable image.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
