# Source: c8s/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8s-operator
  labels:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: c8s
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [confidential.ai]
    resources: [confidentialworkloads]
    verbs: [get, list, watch]
  - apiGroups: [confidential.ai]
    resources: [confidentialworkloads/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods]
    # delete: the startup reinject sweep deletes un-injected cw pods so their
    # controllers recreate them through the webhook.
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    # The workload-service reconciler watches these for the confidential.ai/cw
    # pod-template annotation.
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    # The operator provisions one headless Service per annotated workload in
    # the workload's namespace — the only c8s-managed resource outside the
    # release namespace.
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [events]
    # The controller-runtime manager's event recorder (leader election,
    # reconcile events) creates and patch-aggregates events across the
    # namespaces it watches; without this it logs "events is forbidden".
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, update, patch]
