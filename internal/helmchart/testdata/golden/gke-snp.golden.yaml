data:
  config.toml: |
    [server]
    # Pod loopback only: consumers enter through the attest-proxy sidecar's
    # node-local Unix socket; nothing routable can reach /attest.
    bind = "127.0.0.1:8400"
    
    [server.tls]
    enabled = false
    
    [attestation]
    enabled = true
    platforms = ["snp", "tdx", "az-snp", "az-tdx", "gcp-snp", "gcp-tdx"]
    
    [certs]
    cache_max_entries = 1024
