            - --rate-limiter-evict-interval=1m
            - --rate-limiter-idle-timeout=5m
            - --ratls-platform=snp
            - --ratls-cert-ttl=24h
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 30
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            
            - name: attestation-api-socket
              mountPath: /var/run/nri-image-policy
              readOnly: true
            - name: allowlist-seed
              mountPath: /etc/cds
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
