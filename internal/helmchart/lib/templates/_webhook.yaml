{{- define "c8s-lib.webhook" -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "c8s-lib.fullname" . }}-pod-injector
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
  {{- $webhookAnnotations := deepCopy (.Values.webhook.annotations | default dict) }}
  {{- /* AKS's admissionsenforcer rewrites webhook namespaceSelectors and takes
         field ownership, conflicting with later `helm upgrade` applies; opt out
         on the Azure (vTPM) platforms. An explicit value here wins. */}}
  {{- if and (hasPrefix "az-" .Values.platform) (not (hasKey $webhookAnnotations "admissions.enforcer/disabled")) }}
  {{- $_ := set $webhookAnnotations "admissions.enforcer/disabled" "true" }}
  {{- end }}
  {{- with $webhookAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
webhooks:
  - name: pods.c8s.confidential.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: 5
    reinvocationPolicy: IfNeeded
    # get-cert injection is opt-in (confidential.ai/cw), so an un-annotated pod
    # is a no-op regardless of namespace. The exclusion matters for kata
    # enforcement, which forces a runtimeClassName onto any in-scope pod with
    # no annotation: without it, --kata-enforce would try to run c8s's own
    # control plane (operator, cds, attestation-api, tls-lb are not
    # hostNetwork) as kata VMs. The reinject sweep excludes the same set.
    namespaceSelector:
      matchExpressions:
        {{- include "c8s-lib.webhookExcludedNamespaces" . | nindent 8 }}
    rules:
      - operations: [CREATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        scope: Namespaced
      # Ephemeral containers attach to a running pod and are stripped from a
      # CREATE, so they are only visible on this subresource. Without it,
      # `kubectl debug` could mount the volume holding a released secret or the
      # pod's private key and read it out (docs/secrets.md).
      - operations: [UPDATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods/ephemeralcontainers]
        scope: Namespaced
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "c8s-lib.operatorName" . }}
        path: /mutate-pods
        port: {{ .Values.webhook.service.port }}
      {{- if .Values.webhook.caBundle }}
      caBundle: {{ .Values.webhook.caBundle }}
      {{- end }}
{{- end }}
