{{- define "c8s-lib.ratlsMeshUIDPolicy" -}}
{{- if .Values.ratlsMesh.uidAdmissionPolicy.enabled }}
{{- $uid := include "c8s-lib.int" .Values.ratlsMesh.uid }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-ratls-mesh-uid
  labels:
    {{- include "c8s-lib.ratlsMesh.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ .Release.Namespace }}
            - kube-system
  validations:
    # 1337 is the mesh proxy's reserved UID; 0 means a root workload that
    # falls in no exemption cgroup. Both egress outside the mesh's scope —
    # deny them up-front.
    - expression: >-
        !has(object.spec.securityContext) ||
        !has(object.spec.securityContext.runAsUser) ||
        (object.spec.securityContext.runAsUser != {{ $uid }} &&
         object.spec.securityContext.runAsUser != 0)
      message: "Pod-level runAsUser {{ $uid }} is reserved for the ratls-mesh proxy; runAsUser 0 is not in any in-guest exemption cgroup."
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.runAsUser) ||
          (c.securityContext.runAsUser != {{ $uid }} &&
           c.securityContext.runAsUser != 0)
        )
      message: "Containers must not run as UID {{ $uid }} (reserved for the ratls-mesh proxy) or 0 (not in an exemption cgroup)."
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.runAsUser) ||
          (c.securityContext.runAsUser != {{ $uid }} &&
           c.securityContext.runAsUser != 0)
        )
      message: "Init containers must not run as UID {{ $uid }} (reserved for the ratls-mesh proxy) or 0 (not in an exemption cgroup)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-ratls-mesh-uid
  labels:
    {{- include "c8s-lib.ratlsMesh.labels" . | nindent 4 }}
spec:
  policyName: deny-ratls-mesh-uid
  validationActions:
    - Deny
---
# The pods/ephemeralcontainers subresource has its own object shape
# (spec.ephemeralContainers only), so its validation lives in a separate
# policy rather than sharing expressions that reference pod-only fields —
# those would fail type-check/deny every kubectl debug.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-ratls-mesh-uid-ephemeral
  labels:
    {{- include "c8s-lib.ratlsMesh.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods/ephemeralcontainers"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ .Release.Namespace }}
            - kube-system
  validations:
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.runAsUser) ||
          (c.securityContext.runAsUser != {{ $uid }} &&
           c.securityContext.runAsUser != 0)
        )
      message: "Ephemeral containers must not run as UID {{ $uid }} (reserved for the ratls-mesh proxy) or 0 (not in an exemption cgroup)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-ratls-mesh-uid-ephemeral
  labels:
    {{- include "c8s-lib.ratlsMesh.labels" . | nindent 4 }}
spec:
  policyName: deny-ratls-mesh-uid-ephemeral
  validationActions:
    - Deny
{{- end }}
{{- end }}
