    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        {{- include "c8s-lib.nri.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nri-installer-worker
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      hostPID: true
      {{- with .Values.nriImagePolicy.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "c8s-lib.imagePullSecrets" (dict "root" . "local" .Values.nriImagePolicy.imagePullSecrets) | nindent 6 }}
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
