{{- define "c8s-lib.cds" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "c8s-lib.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
{{ include "c8s-lib.serviceAccountImagePullSecrets" . }}
---
# The allowlist seed: CDS serves a non-empty /allowlist from first boot for
# whichever admission path consumes it — the host NRI plugin (node-cloud,
# node-metal), the baked node-image plugin, or the in-guest policy-monitor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s-lib.cdsName" . }}-allowlist-seed
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
data:
  allowlist-seed.json: {{ include "c8s-lib.allowlistSeedJSON" . | trim | quote }}
---
{{- if .Values.cds.operatorKeys }}
{{- if not (contains "BEGIN PUBLIC KEY" .Values.cds.operatorKeys) }}
{{- fail "cds.operatorKeys must be the PEM content of the operator public-key bundle, not a file path — use `c8s install --operator-keys <file>`, `c8s render-values --operator-keys <file>`, or helm --set-file cds.operatorKeys=<file>" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s-lib.cdsName" . }}-operator-keys
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
data:
  # PEM bundle of operator EC public keys that authorize allowlist writes.
  # Public key material — not a secret.
  keys.pem: {{ .Values.cds.operatorKeys | quote }}
---
{{- end }}
{{- if .Values.cds.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "c8s-lib.cdsName" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.cds.persistence.size }}
  {{- if .Values.cds.persistence.storageClassName }}
  storageClassName: {{ .Values.cds.persistence.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c8s-lib.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
  annotations:
    confidential.ai/trust-root-mode: "inMemory"
spec:
  {{/* Fixed at 1: EAR signing keys are per pod, so a second Ready endpoint
       breaks EAR verification. */}}
  replicas: 1
  # Recreate: two pods would mint divergent roots and can't co-mount the RWO
  # data PVC. Dependents ride out the gap via get-cert retry.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cds
      annotations:
        confidential.ai/trust-root-mode: "inMemory"
        {{- if .Values.cds.measurementsConfig }}
        # Roll the pod when the pinned measurements config changes.
        checksum/measurements-config: {{ .Values.cds.measurementsConfig | sha256sum }}
        {{- end }}
    spec:
      {{- with include "c8s-lib.controlPlaneRuntimeClass" . }}
      runtimeClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "c8s-lib.cdsName" . }}
      # The live node-list bound needs the API token; static CIDRs do not.
      automountServiceAccountToken: {{ empty .Values.cds.sandboxInventoryCIDRs }}
      {{- /* CDS is a singleton trust root reached over a node-local NodePort
             and (with persistence) an RWO volume, so pin it to a known node.
             The CDS digest is always in the NRI floor (c8s-lib.imageAllowlist),
             so image policy admits CDS on whichever node it lands. */}}
      {{- with .Values.cds.node.selector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cds.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "c8s-lib.kataGuestReadyAffinity" . | nindent 6 }}
      securityContext:
      {{- if eq (include "c8s-lib.kata" .) "true" }}
        # In a kata guest with shared_fs="none", the kubelet fsGroup chown
        # lands on a host emptyDir the guest never mounts, so the agent
        # creates a fresh root-owned /data inside the guest and UID 65532
        # cannot write allowlist.db. Run as in-guest root — safe, since the VM
        # is the trust boundary and cds is its sole workload.
        runAsUser: 0
        runAsNonRoot: false
      {{- else }}
{{ toYaml .Values.podSecurityContext | indent 8 }}
      {{- end }}
      containers:
        - name: cds
          image: {{ include "c8s-lib.cdsImage" . }}
          imagePullPolicy: {{ .Values.cds.image.pullPolicy }}
          args:
            - --port={{ .Values.cds.port }}
            - --log-level={{ .Values.cds.logLevel }}
            - --attestation-api-url={{ include "c8s-lib.attestationURL" . }}
            - --allowlist-db={{ .Values.cds.allowlistDB }}
            - --allowlist-persistent={{ .Values.cds.persistence.enabled }}
            - --allowlist-seed=/etc/cds/allowlist-seed.json
            - --ear-issuer={{ .Values.cds.earIssuer }}
            {{- if .Values.cds.expectedIssuer }}
            - --expected-issuer={{ .Values.cds.expectedIssuer }}
            {{- end }}
            - --jwt-clock-skew={{ .Values.cds.jwtClockSkew }}
            - --ca-common-name={{ .Values.cds.ca.commonName }}
            - --ca-cert-validity={{ .Values.cds.ca.certValidity }}
            - --min-ca-validity={{ .Values.cds.ca.minValidity }}
            - --cert-ttl={{ .Values.cds.certTTL }}
            - --named-cert-ttl={{ .Values.cds.namedCertTTL }}
            - --max-ttl={{ .Values.cds.maxTTL }}
            - --challenge-ttl={{ .Values.cds.challengeTTL }}
            - --request-timeout={{ .Values.cds.requestTimeout }}
            - --max-request-size={{ .Values.cds.maxRequestSize }}
            - --secrets-max-paths={{ include "c8s-lib.positiveInt" (dict "value" .Values.cds.secretsMaxPaths "label" "cds.secretsMaxPaths") }}
            - --secrets-max-paths-per-workload={{ include "c8s-lib.positiveInt" (dict "value" .Values.cds.secretsMaxPathsPerWorkload "label" "cds.secretsMaxPathsPerWorkload") }}
            - --readiness-interval={{ .Values.cds.readinessInterval }}
            - --san-validation={{ .Values.cds.sanValidation }}
            {{- /* Always allow in-cluster Service SANs so the mesh's own
                   get-cert/ratls-mesh CSRs validate; operators append public
                   hostnames via cds.dnsSanPatterns without restating this. */}}
            - --dns-san-pattern={{ include "c8s-lib.cdsDnsSanPattern" . }}
            {{- range .Values.cds.dnsSanPatterns }}
            - --dns-san-pattern={{ . }}
            {{- end }}
            {{- if .Values.cds.cnPattern }}
            - --allowed-cn-pattern={{ .Values.cds.cnPattern }}
            {{- end }}
            {{- if .Values.cds.measurementsConfig }}
            - --measurements-config=/etc/c8s-measurements/cds.json
            {{- else }}
            {{- with .Values.cds.measurements }}
            - --measurements={{ join "," . }}
            {{- end }}
            {{- with .Values.cds.rtmrs }}
            - --rtmrs={{ join "," . }}
            {{- end }}
            {{- end }}
            {{- with .Values.cds.sandboxInventoryCIDRs }}
            - --sandbox-inventory-cidr={{ join "," . }}
            {{- end }}
            {{- if .Values.cds.operatorKeys }}
            - --operator-keys=/etc/cds-operator-keys/keys.pem
            {{- end }}
            - --token-signer-rotation-interval={{ .Values.cds.tokenSignerRotationInterval }}
            - --token-signer-overlap={{ .Values.cds.tokenSignerOverlap }}
            - --token-signer-rotation-jitter={{ .Values.cds.tokenSignerRotationJitter }}
            - --rate-limit={{ .Values.cds.rateLimit }}
            - --rate-burst={{ .Values.cds.rateBurst }}
            - --rate-limiter-max-entries={{ .Values.cds.rateLimiterMaxEntries }}
            - --rate-limiter-evict-interval={{ .Values.cds.rateLimiterEvictInterval }}
            - --rate-limiter-idle-timeout={{ .Values.cds.rateLimiterIdleTimeout }}
            - --ratls-platform={{ include "c8s-lib.ratlsPlatform" . }}
            - --ratls-cert-ttl={{ .Values.cds.ratlsCertTTL }}
          {{- with (include "c8s-lib.attestationHostIPEnv" .) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.cds.port }}
          {{- if eq (include "c8s-lib.kata" .) "true" }}
          # In-guest cds serves mutual RA-TLS, which the kubelet prober cannot
          # handshake; the port only opens once cds has provisioned its RA-TLS
          # serving cert, so an open socket is the "attested and serving"
          # signal.
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 30
          {{- else }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 30
          {{- end }}
          resources:
{{ toYaml .Values.cds.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- include "c8s-lib.attestationSocketMount" . | nindent 12 }}
            - name: allowlist-seed
              mountPath: /etc/cds
              readOnly: true
            {{- if .Values.cds.operatorKeys }}
            - name: operator-keys
              mountPath: /etc/cds-operator-keys
              readOnly: true
            {{- end }}
            {{- if .Values.cds.measurementsConfig }}
            - name: measurements-config
              mountPath: /etc/c8s-measurements
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          {{- if eq (include "c8s-lib.kata" .) "true" }}
            runAsUser: 0
            runAsNonRoot: false
          {{- else }}
            runAsNonRoot: true
            runAsUser: 65532
          {{- end }}
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          {{- if .Values.cds.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "c8s-lib.cdsName" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "c8s-lib.attestationSocketVolume" . | nindent 8 }}
        - name: allowlist-seed
          configMap:
            name: {{ include "c8s-lib.cdsName" . }}-allowlist-seed
        {{- if .Values.cds.operatorKeys }}
        - name: operator-keys
          configMap:
            name: {{ include "c8s-lib.cdsName" . }}-operator-keys
        {{- end }}
        {{- if .Values.cds.measurementsConfig }}
        - name: measurements-config
          configMap:
            name: {{ include "c8s-lib.fullname" . }}-measurements
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s-lib.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  {{- if eq (include "c8s-lib.kata" .) "true" }}
  # Headless under kata: the in-guest ratls-mesh outbound proxy dials the
  # workload's original destination IP on port 15006, so cluster DNS must
  # return the cds pod IP, not a Service ClusterIP with no 15006 endpoint.
  type: ClusterIP
  clusterIP: None
  {{- else }}
  type: {{ .Values.cds.service.type }}
  {{- end }}
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cds
  ports:
    - name: http
      port: {{ .Values.cds.port }}
      targetPort: https
      {{- if and (ne (include "c8s-lib.kata" .) "true") (eq .Values.cds.service.type "NodePort") .Values.cds.service.nodePort }}
      nodePort: {{ .Values.cds.service.nodePort }}
      {{- end }}
---
{{- if empty .Values.cds.sandboxInventoryCIDRs }}
# CDS derives the sandbox-digests dial bound from the live node list unless
# cds.sandboxInventoryCIDRs pins it statically — only the derived mode needs
# the node read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c8s-lib.cdsName" . }}-node-reader
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c8s-lib.cdsName" . }}-node-reader
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c8s-lib.cdsName" . }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s-lib.cdsName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- if .Values.cds.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "c8s-lib.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s-lib.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  # maxUnavailable 0: a voluntary eviction destroys the in-memory CA and EAR
  # keys and forces every workload to re-bootstrap.
  maxUnavailable: {{ include "c8s-lib.int" .Values.cds.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cds
{{- end }}
{{- end }}
