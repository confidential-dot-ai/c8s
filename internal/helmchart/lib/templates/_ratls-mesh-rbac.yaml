{{- define "c8s-lib.ratlsMeshRBAC" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c8s-lib.ratlsMesh.fullname" . }}
  labels:
    {{- include "c8s-lib.ratlsMesh.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c8s-lib.ratlsMesh.fullname" . }}
  labels:
    {{- include "c8s-lib.ratlsMesh.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c8s-lib.ratlsMesh.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s-lib.ratlsMesh.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
