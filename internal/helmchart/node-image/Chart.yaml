apiVersion: v2
name: c8s-node-image
description: |
  c8s node-as-CVM shape for nodes booted from the c8s node-guest-image: the image bakes the attestation-api and NRI image-policy plugin, so the chart installs the operator, webhook, CDS trust root, ratls-mesh, tls-lb, and a pins-only NRI installer that carries this release\'s CDS pins to the baked plugin.
