{{- if .Values.hostNamespacePolicy.enabled }}
{{- /*
Denies tenant pods the pod-spec privileges that would let them impersonate a
node-level c8s component from inside the node's own TCB. The sandbox-identity
flow rests on this: CDS distinguishes the admission inventory from a tenant by
requiring it to answer on a privileged port in the *node's* network namespace,
which a pod can only reach with hostNetwork. hostPath is denied for the same
reason at the filesystem layer — the inventory's socket directory is root-owned
0711, which only holds while tenants cannot RW-mount it
(docs/getcert-workload-binding.md, Corner 7).

c8s's own node-level components (the nri-image-policy installer, ratls-mesh)
legitimately use both and run in the release namespace, which is exempt along
with kube-system and any operator-supplied additions.

One hostPath is carved out: the webhook injects a read-only mount of the
inventory socket directory (nriImagePolicy.hostPaths.runtimeDir) into every
CW pod's cert sidecar, so the policy admits exactly that dir, type Directory,
with every referencing mount readOnly.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "c8s.fullname" . }}-deny-host-namespaces
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: host-namespace-policy
spec:
  # Fail closed: a CEL evaluation error denies the pod. Every expression is
  # has()-guarded, so it should not error in practice.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ .Release.Namespace }}
            - kube-system
            {{- range .Values.hostNamespacePolicy.exemptNamespaces }}
            - {{ . | quote }}
            {{- end }}
  validations:
    - expression: >-
        !has(object.spec.hostNetwork) || object.spec.hostNetwork == false
      message: "hostNetwork is reserved for c8s node components: a pod sharing the node network namespace could bind the privileged port CDS uses to identify the admission inventory, and impersonate it."
    - expression: >-
        !has(object.spec.hostPID) || object.spec.hostPID == false
      message: "hostPID is denied: sharing the node PID namespace defeats the kernel peer-credential binding the admission inventory uses to identify its caller."
    - expression: >-
        !has(object.spec.hostIPC) || object.spec.hostIPC == false
      message: "hostIPC is denied for tenant pods."
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath) ||
          (v.hostPath.path == {{ .Values.nriImagePolicy.hostPaths.runtimeDir | quote }} &&
           has(v.hostPath.type) && v.hostPath.type == 'Directory' &&
           object.spec.containers.all(c, !has(c.volumeMounts) ||
             c.volumeMounts.all(m, m.name != v.name || (has(m.readOnly) && m.readOnly == true))) &&
           (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.volumeMounts) ||
             c.volumeMounts.all(m, m.name != v.name || (has(m.readOnly) && m.readOnly == true))))))
      message: "hostPath volumes are denied, except a read-only mount of the admission inventory socket directory (the webhook-injected claims volume): a writable mount of the node filesystem could swap the inventory's socket (docs/getcert-workload-binding.md, Corner 7)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "c8s.fullname" . }}-deny-host-namespaces
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: host-namespace-policy
spec:
  policyName: {{ include "c8s.fullname" . }}-deny-host-namespaces
  validationActions:
    - Deny
{{- end }}
