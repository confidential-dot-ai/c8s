{{- if .Values.tlsLb.enabled }}
{{- $svc := .Values.tlsLb.service }}
{{- if and (eq $svc.type "ClusterIP") (or $svc.nodePort $svc.httpNodePort) }}
{{- fail "tlsLb.service nodePort settings require type NodePort or LoadBalancer" }}
{{- end }}
{{- if and $svc.httpNodePort (ne (include "tls-lb.publicTLSMode" .) "acme") }}
{{- fail "tlsLb.service.httpNodePort requires publicTLS.mode=acme" }}
{{- end }}
{{- if and $svc.nodePort $svc.httpNodePort (eq (int $svc.nodePort) (int $svc.httpNodePort)) }}
{{- fail "tlsLb.service.nodePort and httpNodePort must differ" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tls-lb.fullname" . }}
  labels:
    {{- include "tls-lb.labels" . | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- if or (eq $svc.type "LoadBalancer") (eq $svc.type "NodePort") }}
  {{- $renderAllowlistRoute := eq (include "tls-lb.renderAllowlistRoute" .) "true" }}
  {{- $perClientLimits := or $renderAllowlistRoute .Values.tlsLb.attest.enabled }}
  {{- $policy := default (ternary "Local" "Cluster" $perClientLimits) $svc.externalTrafficPolicy }}
  {{- if not (or (eq $policy "Local") (eq $policy "Cluster")) }}
  {{- fail (printf "tlsLb.service.externalTrafficPolicy must be Local or Cluster, got: %s" $policy) }}
  {{- end }}
  # Local (the default while the /allowlist route or the attestation sidecar
  # renders) preserves the public source IP their per-client limiters key on;
  # see values.yaml.
  externalTrafficPolicy: {{ $policy }}
  {{- end }}
  ports:
    - port: {{ $svc.port }}
      targetPort: https
      protocol: TCP
      name: https
      {{- with $svc.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- if eq (include "tls-lb.publicTLSMode" .) "acme" }}
    {{- /* HTTP-01 validators dial :80. */}}
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
      {{- with $svc.httpNodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "tls-lb.selectorLabels" . | nindent 4 }}
{{- end }}
