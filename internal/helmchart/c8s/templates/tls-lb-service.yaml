{{- if .Values.tlsLb.enabled }}
{{- $svc := .Values.tlsLb.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tls-lb.fullname" . }}
  labels:
    {{- include "tls-lb.labels" . | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- if or (eq $svc.type "LoadBalancer") (eq $svc.type "NodePort") }}
  {{- $renderAllowlistRoute := and .Values.tlsLb.allowlist.enabled (ne (include "tls-lb.hasExplicitAllowlistRoute" .) "true") }}
  {{- $policy := default (ternary "Local" "Cluster" $renderAllowlistRoute) $svc.externalTrafficPolicy }}
  {{- if not (or (eq $policy "Local") (eq $policy "Cluster")) }}
  {{- fail (printf "tlsLb.service.externalTrafficPolicy must be Local or Cluster, got: %s" $policy) }}
  {{- end }}
  # Defaults to Local while the built-in /allowlist route renders: its
  # per-client limiters key on nginx's public peer address, which Cluster
  # would SNAT to a node IP. Local delivers only through nodes running the
  # tls-lb pod; tlsLb.service.externalTrafficPolicy overrides.
  externalTrafficPolicy: {{ $policy }}
  {{- end }}
  ports:
    - port: {{ $svc.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "tls-lb.selectorLabels" . | nindent 4 }}
{{- end }}
