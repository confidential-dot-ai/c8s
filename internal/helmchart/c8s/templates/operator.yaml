apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c8s.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: operator
spec:
  # The webhook serving CA is minted inside this pod and patched into one
  # MutatingWebhookConfiguration. Running multiple replicas can race CA bundles
  # and break admission TLS for requests routed to the wrong pod.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: operator
      {{- if or .Values.operator.podAnnotations .Values.cds.measurementsConfig }}
      annotations:
        {{- if .Values.cds.measurementsConfig }}
        # A ConfigMap edit alone does not change the pod template, so without
        # this a tightened pin would not roll the operator.
        checksum/measurements-config: {{ .Values.cds.measurementsConfig | sha256sum }}
        {{- end }}
        {{- with .Values.operator.podAnnotations }}
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- end }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "c8s.operatorName" . }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: operator
          image: {{ include "c8s.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          args:
            - operator
            - --leader-election-namespace={{ .Release.Namespace }}
            - --status-mirror-enabled={{ .Values.statusMirror.enabled }}
            - --get-cert-image={{ include "c8s.image" . }}
            - --cds-url={{ include "c8s.trustRootURL" . }}
            - --webhook-config-name={{ include "c8s.fullname" . }}-pod-injector
            - --webhook-service-name={{ include "c8s.operatorName" . }}
            - --webhook-service-namespace={{ .Release.Namespace }}
            - --attestation-api-url={{ include "c8s.attestationApiURL" . }}
            {{- /* The same measurements CDS is pinned to elsewhere: the
                   injected secret fetcher verifies CDS before handing it a
                   sandbox token and taking a value back. */}}
            {{- if .Values.cds.measurementsConfig }}
            - --measurements-config=/etc/c8s-measurements/cds.json
            {{- else }}
            {{- range .Values.cds.measurements }}
            - --cds-measurements={{ . }}
            {{- end }}
            {{- range .Values.cds.rtmrs }}
            - --cds-rtmrs={{ . }}
            {{- end }}
            {{- end }}
            {{- range .Values.webhook.extraExcluded }}
            - --exclude-namespaces={{ . }}
            {{- end }}
            - --cert-fs-group={{ include "c8s.int" .Values.webhook.certVolume.fsGroup }}
            - --cert-key-mode={{ .Values.webhook.certVolume.keyMode }}
            - --get-cert-renew-interval={{ .Values.webhook.getCert.renewInterval }}
            - --get-cert-run-as-user={{ include "c8s.int" .Values.webhook.getCert.runAsUser }}
            - --get-cert-run-as-group={{ include "c8s.int" .Values.webhook.getCert.runAsGroup }}
            - --get-cert-run-as-non-root={{ .Values.webhook.getCert.runAsNonRoot }}
            {{- if .Values.kata.enabled }}
            - --kata-enforce=true
            - --hardware-platform={{ include "c8s.hardwarePlatform" . }}
            {{- end }}
            {{- if include "c8s.kataGuestReadyGate" . }}
            - --kata-guest-ready-gate=true
            {{- end }}
            {{- /* Workload-digest claims (docs/ratls.md): get-cert
                   redeems a sandbox token from the node's inventory over a
                   compiled endpoint: the nri-image-policy socket mounted into
                   c8s-cert on node-CVM, or guest loopback under kata, where
                   policy-monitor is in the same guest and nothing is mounted. */}}
            {{- if .Values.kata.enabled }}
            - --workload-claims-guest
            {{- else if or .Values.nriImagePolicy.enabled (eq .Values.attestationApi.cvmMode "node") }}
            {{- /* cvmMode=node bakes the plugin into the node image instead of
                   installing it from the chart, so nriImagePolicy.enabled is
                   false there — but the socket still exists at the same path. */}}
            - --workload-claims-host-dir={{ .Values.nriImagePolicy.hostPaths.runtimeDir }}
            {{- end }}
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 30
          resources:
{{ toYaml .Values.operator.resources | indent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem: true forces any transient files
            # (controller-runtime cache tempfiles, etc.) to land in
            # this emptyDir rather than the immutable image.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.cds.measurementsConfig }}
            - name: measurements-config
              mountPath: /etc/c8s-measurements
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.cds.measurementsConfig }}
        - name: measurements-config
          configMap:
            name: {{ include "c8s.fullname" . }}-measurements
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    # Webhook service port. The API server dials this Service:port; the
    # MutatingWebhookConfiguration's clientConfig.service.port matches.
    # controller-runtime's webhook server listens on 9443 by default.
    - name: webhook
      port: {{ .Values.webhook.service.port }}
      targetPort: 9443
