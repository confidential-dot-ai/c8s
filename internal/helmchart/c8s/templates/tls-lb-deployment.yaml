{{- if .Values.tlsLb.enabled }}
{{- if not (kindIs "bool" .Values.tlsLb.hostPort.enabled) -}}
{{- /* A string "false" is truthy and would both bind the node port and force
Recreate, silently defeating the operator's opt-out. */ -}}
{{- fail (printf "tlsLb.hostPort.enabled must be a boolean; do not set it via --set-string, got: %v" .Values.tlsLb.hostPort.enabled) -}}
{{- end -}}
{{- if and .Values.kata.enabled (ne (int .Values.tlsLb.nginx.httpsPort) 8443) -}}
{{- /* The guest bakes C8S_MESH_INBOUND_PASSTHROUGH=tcp:8443 (a guest-wide
default in cloudinit.env, not a chart value) and redirects every other inbound
port into the mutual-RA-TLS proxy. On any other port the front door answers
certless clients — external TLS and the kubelet prober alike — with
"certificate required". */ -}}
{{- fail (printf "kata.enabled requires tlsLb.nginx.httpsPort 8443: the guest exempts exactly tcp:8443 from the inbound mesh redirect, so nginx on any other port is unreachable from outside the mesh, got: %v" .Values.tlsLb.nginx.httpsPort) -}}
{{- end -}}
{{- if .Values.tlsLb.attest.expectedWorkload -}}
{{- if not .Values.tlsLb.attest.enabled -}}
{{- /* The gate *is* the cds-attest sidecar's /readyz. Without the sidecar
nothing renders it, yet the claims wiring it pulls in (get-cert's
--workload-claims, the inventory hostPath, the supplemental group) still would
— cost and hostPath surface for a gate that does not exist. */ -}}
{{- fail "tlsLb.attest.expectedWorkload gates the cds-attest sidecar's /readyz endpoint: set tlsLb.attest.enabled=true or clear expectedWorkload" -}}
{{- end -}}
{{- if .Values.tlsLb.hostPort.enabled -}}
{{- /* Readiness only withdraws Service endpoints. The hostPort is published by
the CNI portmap plugin, wired at sandbox creation and independent of pod
readiness, so an unnamed front door would keep serving external traffic on the
node port while the operator watched a NotReady pod and believed traffic was
withheld. */ -}}
{{- fail "tlsLb.attest.expectedWorkload cannot gate ingress while tlsLb.hostPort.enabled=true: the node port is published by CNI portmap regardless of pod readiness. Set tlsLb.hostPort.enabled=false and route through the Service, or clear expectedWorkload" -}}
{{- end -}}
{{- end -}}
{{- $publicTLSMode := include "tls-lb.publicTLSMode" . -}}
{{- $defaultMeshCAPath := printf "%s/ca.pem" .Values.tlsLb.tlsMountPath -}}
{{- $upstreamTrustedCAPath := default $defaultMeshCAPath .Values.tlsLb.upstream.tls.trustedCAPath -}}
{{- $attestUsesHTTPSUpstream := and .Values.tlsLb.attest.enabled (eq .Values.tlsLb.upstream.protocol "https") -}}
{{- $upstreamAddress := .Values.tlsLb.upstream.address -}}
{{- $attestUpstreamServerName := default (include "tls-lb.serverNameFromAddress" $upstreamAddress) .Values.tlsLb.upstream.tls.serverName -}}
{{- $renderAllowlistProxy := eq (include "tls-lb.renderAllowlistRoute" .) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tls-lb.fullname" . }}
  labels:
    {{- include "tls-lb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.tlsLb.nginx.replicas }}
  strategy:
    {{- if .Values.tlsLb.strategy }}
    {{- toYaml .Values.tlsLb.strategy | nindent 4 }}
    {{- else if .Values.tlsLb.hostPort.enabled }}
    {{- /* Two pods on a node would collide on the host port; on a single-node
    cluster a surge pod could never schedule, deadlocking the roll. */}}
    type: Recreate
    {{- else }}
    {{- /* Surge so the new (cert-holding) pod is Ready before the old one is
    retired: the front door keeps serving across a roll. */}}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "tls-lb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tls-lb.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/tls-lb-configmap.yaml") . | sha256sum }}
        {{- if .Values.cds.measurementsConfig }}
        # A ConfigMap edit alone does not change the pod template, so without
        # this a tightened pin would not roll the load balancer.
        checksum/measurements-config: {{ .Values.cds.measurementsConfig | sha256sum }}
        {{- end }}
    spec:
      {{- if .Values.kata.enabled }}
      # Chart-managed mesh component: the webhook excludes the release
      # namespace, so the chart pins the RuntimeClass directly (same pattern as
      # cds.yaml). kata-qemu-snp specifically: the get-cert init containers dial
      # the in-guest attestation-api on loopback under kata
      # (c8s.attestationApiURL), which only exists inside an SNP guest — and
      # tls-lb terminates client TLS with mesh-issued keys, so its plaintext
      # must stay inside the TEE boundary.
      runtimeClassName: {{ include "c8s.controlPlaneKataRuntimeClass" . }}
      {{- end }}
      {{- /* Pinned above, not injected, so the gate is spelled out here too. */}}
      {{- include "c8s.kataGuestReadyAffinity" . | nindent 6 }}
      {{- include "c8s.imagePullSecrets" (dict "root" $ "local" .Values.tlsLb.imagePullSecrets) | nindent 6 }}
      shareProcessNamespace: true
      initContainers:
        {{- include "tls-lb.getCertContainers" . | nindent 8 }}
        {{- if eq $publicTLSMode "acme" }}
        # Native sidecar (restartPolicy: Always): issues one multi-SAN ACME
        # leaf for the sanList domains, answers HTTP-01 on loopback behind the
        # :80 server, renews at 2/3 lifetime, and SIGHUPs nginx on install —
        # which needs the shared PID namespace and the nginx uid, same as
        # c8s-cert.
        - name: acme
          image: {{ include "c8s.image" . }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          restartPolicy: Always
          args:
            - acme
            - --domains={{ include "tls-lb.sanList" . | fromJsonArray | join "," }}
            {{- with .Values.tlsLb.acme.email }}
            - --acme-email={{ . }}
            {{- end }}
            {{- with .Values.tlsLb.acme.directoryURL }}
            - --acme-directory-url={{ . }}
            {{- end }}
            - --challenge-port={{ include "tls-lb.acmeChallengePort" . }}
            - --http-port={{ include "tls-lb.acmeHTTPPort" . }}
            - --cert-dir={{ include "tls-lb.acmeCertDir" . }}
          # nginx's config names the acme cert files, so nginx must not start
          # before the bootstrap placeholder exists; regular containers wait
          # for a native sidecar's startup probe. Probing cert.pem suffices:
          # the sidecar writes key before cert. Exec probes are fine here:
          # acme mode never renders under kata (no ExecProcessRequest denial).
          startupProbe:
            exec:
              command: ["/c8s", "probe-file", "{{ include "tls-lb.acmeCertDir" . }}/cert.pem"]
            periodSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: acme-tls
              mountPath: {{ include "tls-lb.acmeCertDir" . }}
          securityContext:
            {{- include "c8s.getCertSecurityContext" (dict
              "runAsUser" .Values.tlsLb.nginx.runAsUser
              "runAsGroup" .Values.tlsLb.nginx.runAsGroup
              "runAsNonRoot" .Values.tlsLb.nginx.runAsNonRoot
            ) | nindent 12 }}
        {{- end }}
      containers:
        - name: nginx
          image: {{ include "c8s-common.image" .Values.tlsLb.nginx.image }}
          imagePullPolicy: {{ .Values.tlsLb.nginx.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.tlsLb.nginx.httpsPort }}
              {{- if .Values.tlsLb.hostPort.enabled }}
              hostPort: {{ .Values.tlsLb.hostPort.https | default 443 }}
              {{- end }}
              protocol: TCP
            {{- if eq $publicTLSMode "acme" }}
            {{- /* HTTP-01 arrives on public :80; hostPort follows the same
            gating as :443. */}}
            - name: http
              containerPort: {{ include "tls-lb.acmeHTTPPort" . }}
              {{- if .Values.tlsLb.hostPort.enabled }}
              hostPort: 80
              {{- end }}
              protocol: TCP
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: {{ .Values.tlsLb.nginx.runAsNonRoot }}
            runAsUser: {{ include "c8s.int" .Values.tlsLb.nginx.runAsUser }}
            runAsGroup: {{ include "c8s.int" .Values.tlsLb.nginx.runAsGroup }}
            capabilities:
              drop:
                - ALL
          {{- if .Values.kata.enabled }}
          # Under kata the RA-TLS mesh moves into the guest, which redirects
          # inbound TCP into a proxy expecting mutual attested TLS — but the
          # guest exempts exactly this port (C8S_MESH_INBOUND_PASSTHROUGH=
          # tcp:8443, pinned by the render guard above), so the certless kubelet
          # prober does reach nginx. A TCP accept is kept as the liveness and
          # readiness signal here because nginx's own /healthz says nothing the
          # accept does not; the cds-attest gate below is what needs a real
          # request, and it takes the httpGet path. Same shape as cds.yaml.
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- else }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- end }}
          volumeMounts:
            - name: tls-certs
              mountPath: {{ .Values.tlsLb.tlsMountPath }}
              readOnly: true
            {{- if eq $publicTLSMode "webpki" }}
            - name: public-tls
              mountPath: {{ .Values.tlsLb.publicTLS.mountPath }}
              readOnly: true
            {{- end }}
            {{- if eq $publicTLSMode "acme" }}
            - name: acme-tls
              mountPath: {{ include "tls-lb.acmeCertDir" . }}
              readOnly: true
            {{- end }}
            {{- if .Values.tlsLb.discovery.enabled }}
            - name: discovery
              mountPath: {{ .Values.tlsLb.discovery.mountPath }}
              readOnly: true
            {{- end }}
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
          {{- with .Values.tlsLb.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.tlsLb.attest.enabled }}
        - name: cds-attest
          image: {{ include "c8s.image" . }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          args:
            - cds-attest
            {{- /* Loopback only: every endpoint this sidecar registers
            (/healthz, /readyz, both attest routes, /tunnel) sits on
            one listener, so binding the pod IP would publish the whole surface
            with no NetworkPolicy in front of it. The readiness probe reaches
            /readyz through nginx instead (location = /readyz). */}}
            - --host=127.0.0.1
            - --port={{ .Values.tlsLb.attest.port }}
            - --platform={{ .Values.tlsLb.attest.platform }}
            - --generation={{ .Values.tlsLb.attest.generation }}
            - --attestation-api-url={{ default (include "c8s.attestationApiURL" .) .Values.tlsLb.attest.attestationApiURL }}
            # attest-lb needs a TEE-held serving key (cds, acme); webpki's
            # host-visible Secret key stays attest-pq-only.
            - --front-door-mode={{ $publicTLSMode }}
            # Bind the *exact* leaf nginx presents on the wire (ssl_certificate =
            # publicCertPath), so the attest-lb binding (GET
            # /.well-known/c8s/attest-lb) commits report_data to the leaf DER a
            # direct-TLS client actually sees: the mesh leaf (cds), the Secret
            # cert (webpki), or the ACME leaf (acme). Re-read per request, so
            # renewals are picked up.
            - --serving-cert-file={{ include "tls-lb.publicCertPath" . }}
            {{- if .Values.tlsLb.attest.expectedWorkload }}
            - --expected-workload={{ .Values.tlsLb.attest.expectedWorkload }}
            {{- end }}
            # The identity-bound PQ flow must use the TEE-held mesh
            # credential, never the optional publicTLS Secret: report_data
            # commits the X-Wing key exchange to this leaf and the sidecar
            # proves possession with its matching private key.
            - --mesh-identity-cert-file={{ .Values.tlsLb.tlsMountPath }}/cert.pem
            - --mesh-identity-key-file={{ .Values.tlsLb.tlsMountPath }}/key.pem
            - --mesh-identity-ca-file={{ .Values.tlsLb.tlsMountPath }}/ca.pem
            # Terminate over-encryption here and forward to the same workload
            # backend nginx proxies to. An http upstream is plaintext at the
            # app layer; pointed at a headless Service (an adopted workload),
            # the node mesh wraps the pod-IP hop in attested mTLS. An https
            # upstream terminates TLS itself and gets the mTLS args below.
            # No adopted workload (empty upstream address) -> omit --upstream
            # entirely; the sidecar then serves attestation with its echo
            # backend instead of crashing on a scheme-only URL.
            {{- if $upstreamAddress }}
            - --upstream={{ .Values.tlsLb.upstream.protocol }}://{{ $upstreamAddress }}
            {{- if $attestUsesHTTPSUpstream }}
            - --upstream-ca={{ $upstreamTrustedCAPath }}
            {{- if .Values.tlsLb.upstream.tls.useCDSClientCert }}
            - --upstream-cert={{ .Values.tlsLb.tlsMountPath }}/cert.pem
            - --upstream-key={{ .Values.tlsLb.tlsMountPath }}/key.pem
            {{- end }}
            - --upstream-server-name={{ $attestUpstreamServerName }}
            {{- end }}
            {{- end }}
          {{- with (include "c8s.attestationApiHostIPEnv" .) }}
          # cvmMode=node: expands $(HOST_IP) in --attestation-api-url to the node
          # IP so this pod-netns pod reaches the node-baked host attestation-api.
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if .Values.tlsLb.attest.expectedWorkload }}
          # Workload-verified ingress gate (docs/getcert-workload-binding.md):
          # ready only while the installed mesh identity leaf is a usable
          # credential carrying a matched-workload stamp naming
          # expectedWorkload, so ingress withholds traffic while the committed
          # identity is unnamed (initial deploy, or after a foreign admission
          # unnames the next renewal).
          #
          # Probed through nginx (location = /readyz), not the sidecar's own
          # port: the sidecar listens on loopback, and under kata the guest
          # redirects every inbound port except the nginx one into the mutual
          # RA-TLS proxy, which rejects the certless kubelet prober. Scheme
          # HTTPS on the nginx port works in both shapes — nginx sets no
          # ssl_verify_client and kubelet skips certificate verification on
          # HTTPS probes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tls-certs
              mountPath: {{ .Values.tlsLb.tlsMountPath }}
              readOnly: true
            {{- include "c8s.attestationApiSocketMount" . | nindent 12 }}
            {{- if eq $publicTLSMode "webpki" }}
            # cds-attest reads the same public leaf nginx serves
            # (--serving-cert-file).
            - name: public-tls
              mountPath: {{ .Values.tlsLb.publicTLS.mountPath }}
              readOnly: true
            {{- end }}
            {{- if eq $publicTLSMode "acme" }}
            - name: acme-tls
              mountPath: {{ include "tls-lb.acmeCertDir" . }}
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.tlsLb.attest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $renderAllowlistProxy }}
        # nginx terminates the public, tls-lb-attested connection and forwards
        # /allowlist over pod loopback. This sidecar establishes the second
        # trust hop: it verifies CDS's RA-TLS evidence before proxying.
        - name: allowlist-proxy
          image: {{ include "c8s.image" . }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          args:
            - allowlist-proxy
            - --host=127.0.0.1
            - --port={{ include "c8s.int" .Values.tlsLb.allowlist.proxyPort }}
            - --cds-url={{ include "c8s.cdsURL" . }}
            - --attestation-api-url={{ include "c8s.attestationApiURL" . }}
            {{- if .Values.cds.measurementsConfig }}
            - --measurements-config=/etc/c8s-measurements/cds.json
            {{- else }}
            {{- with .Values.cds.measurements }}
            - --cds-measurements={{ join "," . }}
            {{- end }}
            {{- with .Values.cds.rtmrs }}
            - --cds-rtmrs={{ join "," . }}
            {{- end }}
            {{- end }}
          {{- with (include "c8s.attestationApiHostIPEnv" .) }}
          # cvmMode=node: the proxy verifies CDS through the node-baked
          # attestation-api, reached from this pod via its node IP.
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if or (eq (include "c8s.attestationApiHostSocket" .) "true") .Values.cds.measurementsConfig }}
          volumeMounts:
            {{- if eq (include "c8s.attestationApiHostSocket" .) "true" }}
            {{- include "c8s.attestationApiSocketMount" . | nindent 12 }}
            {{- end }}
            {{- if .Values.cds.measurementsConfig }}
            - name: measurements-config
              mountPath: /etc/c8s-measurements
              readOnly: true
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.tlsLb.allowlist.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: tls-certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if .Values.cds.measurementsConfig }}
        - name: measurements-config
          configMap:
            name: {{ include "c8s.fullname" . }}-measurements
        {{- end }}
        {{- if eq $publicTLSMode "webpki" }}
        - name: public-tls
          secret:
            secretName: {{ .Values.tlsLb.publicTLS.secretName }}
            items:
              - key: {{ .Values.tlsLb.publicTLS.certKey }}
                path: {{ .Values.tlsLb.publicTLS.certKey }}
              - key: {{ .Values.tlsLb.publicTLS.keyKey }}
                path: {{ .Values.tlsLb.publicTLS.keyKey }}
        {{- end }}
        {{- if eq $publicTLSMode "acme" }}
        # ACME key, cert, and account state. Memory-medium: TEE-protected and
        # lost on pod recreation, so the sidecar re-issues (LE duplicate-cert
        # limits apply; use the staging directoryURL for tests).
        - name: acme-tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if .Values.tlsLb.discovery.enabled }}
        - name: discovery
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        # medium: Memory is load-bearing under kata-qemu-snp with
        # shared_fs="none": a default (disk-backed) emptyDir gets provisioned
        # through kata-agent's CDH secure-storage path inside the guest and
        # fails CreateContainer ("[CDH] [ERROR]: Secure Mount failed").
        # tmpfs-backed emptyDirs are mounted directly by the guest kernel.
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-config
          configMap:
            name: {{ include "tls-lb.fullname" . }}-nginx
        {{- if eq (include "tls-lb.mountInventorySocket" .) "true" }}
        # The readiness gate needs a stamped mesh leaf, so get-cert redeems a
        # sandbox token over the node inventory's Unix socket (see
        # tls-lb.getCertContainers). Read-only: the sidecar only connects.
        - name: workload-claims
          hostPath:
            path: {{ .Values.nriImagePolicy.hostPaths.runtimeDir }}
            type: Directory
        {{- end }}
        {{- /* Shares the admission inventory's socket directory — see c8s.attestationApiSocket. */}}
        {{- include "c8s.attestationApiSocketVolume" . | nindent 8 }}
      securityContext:
        runAsNonRoot: {{ .Values.tlsLb.nginx.runAsNonRoot }}
        fsGroup: {{ include "c8s.int" .Values.tlsLb.nginx.runAsGroup }}
        {{- if or (eq (include "tls-lb.mountInventorySocket" .) "true") (eq (include "c8s.attestationApiHostSocket" .) "true") }}
        # workloadclaims.InventorySocketGID: the inventory and attest-proxy
        # chgrp their sockets to this group so the non-root get-cert sidecar
        # (on the nginx uid) can connect. get-cert must stay on the nginx uid —
        # it SIGHUPs nginx on renewal, and a different uid gets "operation not
        # permitted", after which nginx serves a stale leaf that every
        # exact-DER client correctly refuses.
        supplementalGroups: [65532]
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
{{- end }}
