{{- if .Values.ratlsMesh.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ratls-mesh.fullname" . }}
  labels:
    {{- include "ratls-mesh.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ratls-mesh.fullname" . }}
  labels:
    {{- include "ratls-mesh.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ratls-mesh.fullname" . }}
subjects:
  {{- if .Values.node.bakedServices }}
  # Baked mesh processes use each node's rotating kubelet credential. Grant
  # only the cluster-wide pod reads their resolver and ipsets need.
  - kind: Group
    name: system:nodes
    apiGroup: rbac.authorization.k8s.io
  {{- else }}
  - kind: ServiceAccount
    name: {{ include "ratls-mesh.fullname" . }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
