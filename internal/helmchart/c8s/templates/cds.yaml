{{/*
  Validate handoff wiring. With handoff.enabled=true the cds pod self-provisions
  its handoff signer EAR in process and registers /handoff, but every request is
  rejected unless the joining replica's launch digest is in cds.measurements
  (cds is its own EAR issuer, so the requester EAR is validated against cds and
  its measurement checked against the same flat allowlist). The guard catches
  the case where the operator turned handoff on but forgot to pin
  cds.measurements.
*/}}
{{- if not (kindIs "bool" .Values.cds.handoff.enabled) -}}
{{- fail "VALIDATION_ERROR kind=cds_handoff_enabled_type: cds.handoff.enabled must be a boolean" -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.cds.teeWebPKI.enabled) -}}
{{- fail "VALIDATION_ERROR kind=cds_tee_webpki_enabled_type: cds.teeWebPKI.enabled must be a boolean" -}}
{{- end -}}
{{- if .Values.cds.handoff.enabled -}}
  {{- if not .Values.cds.measurements -}}
    {{- /* Structured marker (kind=...) lets tests discriminate this fail without substring-matching the prose. */ -}}
    {{- fail "VALIDATION_ERROR kind=cds_handoff_measurements: cds.handoff.enabled requires cds.measurements to be set (the joining replica's launch digest). See docs/operator.md." -}}
  {{- end -}}
  {{- if not .Values.cds.operatorKeys -}}
    {{- fail "VALIDATION_ERROR kind=cds_handoff_operator_keys: cds.handoff.enabled requires cds.operatorKeys so both replicas commit the same allowlist-write policy into handoff attestation. See docs/operator.md." -}}
  {{- end -}}
{{- end -}}
{{- if and .Values.cds.teeWebPKI.enabled (not .Values.cds.handoff.enabled) -}}
{{- fail "cds.teeWebPKI.enabled requires cds.handoff.enabled=true; a CDS restart must not create a different public TLS key" -}}
{{- end -}}
{{- if and .Values.cds.teeWebPKI.enabled (not .Values.tlsLb.attest.activeOperatorPolicy) -}}
{{- fail "VALIDATION_ERROR kind=tee_webpki_operator_policy: cds.teeWebPKI.enabled requires tlsLb.attest.activeOperatorPolicy=true" -}}
{{- end -}}
{{- if and .Values.cds.teeWebPKI.enabled (ne .Values.tlsLb.attest.expectedWorkload .Values.cds.teeWebPKI.workload) -}}
{{- fail "VALIDATION_ERROR kind=tee_webpki_workload_identity: cds.teeWebPKI.enabled requires tlsLb.attest.expectedWorkload to equal cds.teeWebPKI.workload" -}}
{{- end -}}
{{- if .Values.cds.handoff.peerUrl -}}
  {{- /* Without enabled no pod serves /handoff (--handoff-measurements renders
         only under it), so the surge pod has nothing to adopt from and its own
         config validation rejects peer-url-without-measurements: wedged roll. */ -}}
  {{- if not .Values.cds.handoff.enabled -}}
    {{- fail "VALIDATION_ERROR kind=cds_handoff_peer_requires_enabled: cds.handoff.peerUrl requires cds.handoff.enabled=true so the serving pod offers /handoff for the next roll to adopt from. See docs/operator.md." -}}
  {{- end -}}
  {{- /* Check the resolved URL ("self" -> the CDS Service URL, else verbatim). */ -}}
  {{- if not (hasPrefix "https://" (include "c8s.cdsHandoffPeerURL" .)) -}}
    {{- fail "VALIDATION_ERROR kind=cds_handoff_peer_scheme: cds.handoff.peerUrl must use https (RA-TLS), or the sentinel \"self\" for the CDS Service URL." -}}
  {{- end -}}
  {{- /* The surge pod can't co-mount the RWO PVC. Its allowlist is restored
         from the encrypted handoff snapshot, so forbid the combo rather than
         deadlock the roll. */ -}}
  {{- if .Values.cds.persistence.enabled -}}
    {{- fail "VALIDATION_ERROR kind=cds_handoff_peer_persistence: cds.handoff.peerUrl (adoption) cannot be combined with cds.persistence.enabled (the surge pod cannot share the RWO data PVC). Dynamic allowlist state is transferred in the encrypted handoff snapshot. See docs/operator.md." -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "c8s.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
{{ include "c8s.serviceAccountImagePullSecrets" . }}
---
{{- if eq (include "c8s.serveAllowlistSeed" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.cdsName" . }}-allowlist-seed
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
data:
  allowlist-seed.json: {{ include "c8s.allowlistSeedJSON" . | trim | quote }}
---
{{- end }}
{{- if .Values.cds.operatorKeys }}
{{- if not (contains "BEGIN PUBLIC KEY" .Values.cds.operatorKeys) }}
{{- fail "cds.operatorKeys must be the PEM content of the operator public-key bundle, not a file path — use `c8s install --operator-keys <file>`, `c8s render-values --operator-keys <file>`, or helm --set-file cds.operatorKeys=<file>" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.cdsName" . }}-operator-keys
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
data:
  # PEM bundle of operator EC public keys that authorize allowlist writes.
  # Public key material — not a secret.
  keys.pem: {{ .Values.cds.operatorKeys | quote }}
---
{{- end }}
{{- if .Values.cds.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "c8s.cdsName" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.cds.persistence.size }}
  {{- if .Values.cds.persistence.storageClassName }}
  storageClassName: {{ .Values.cds.persistence.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c8s.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
  annotations:
    confidential.ai/trust-root-mode: "inMemory"
spec:
  {{/* Fixed at 1. Handoff can create one surge pod, but the application-level
       activation protocol permits only one active CDS. */}}
  replicas: 1
  {{- if .Values.cds.handoff.peerUrl }}
  # The new pod adopts state from the old pod. Activation makes the old CDS
  # NotReady. The old CDS stays frozen and readable during the endpoint drain
  # delay. The restored CDS becomes mutable and sends an idempotent confirmation
  # over the selected direct path. A confirmed old CDS retires. If the response
  # is lost, the new CDS becomes Ready because the old CDS is frozen or retired.
  # This keeps at most one mutable CDS without shutting down the only active copy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  # Recreate: two non-adopting pods would mint divergent roots and can't
  # co-mount the RWO data PVC. Dependents ride out the gap via get-cert retry.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cds
      annotations:
        confidential.ai/trust-root-mode: "inMemory"
        {{- if .Values.cds.measurementsConfig }}
        # Pins live in a ConfigMap, which no longer changes the pod template on
        # its own: without this a tightened pin would not roll the pod.
        checksum/measurements-config: {{ .Values.cds.measurementsConfig | sha256sum }}
        {{- end }}
    spec:
      enableServiceLinks: false
      {{- if .Values.kata.enabled }}
      # Run the trust root inside a confidential VM. Its mesh CA and EAR signing
      # keys live only in SEV-SNP-encrypted guest memory, and peers verify cds's
      # RA-TLS serving cert against the guest launch measurement. Pinned directly
      # (not via the confidential.ai/cw webhook path) because get-cert would dial
      # cds — cds fetching a leaf from itself is a bootstrap cycle. See
      # docs/install-flows.md ("Why CDS doesn't use cw for its runtimeClass").
      runtimeClassName: {{ include "c8s.controlPlaneKataRuntimeClass" . }}
      {{- end }}
      serviceAccountName: {{ include "c8s.cdsName" . }}
      # The live node-list bound needs the API token; static CIDRs do not.
      automountServiceAccountToken: {{ empty .Values.cds.sandboxInventoryCIDRs }}
      {{- /* CDS is a singleton trust root reached over a node-local NodePort
             and (with persistence) an RWO volume, so pin it to a known node.
             The CDS digest is in the local NRI cold-boot floor. The first
             authenticated policy replaces that floor with exact named policy. */}}
      {{- with .Values.cds.node.selector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cds.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Pinned above, not injected, so the gate is spelled out here too. */}}
      {{- include "c8s.kataGuestReadyAffinity" . | nindent 6 }}
      securityContext:
      {{- if .Values.kata.enabled }}
        # In a kata-qemu-snp guest with shared_fs="none", the kubelet fsGroup
        # chown lands on a host emptyDir the guest never mounts, so the agent
        # creates a fresh root-owned /data inside the guest and UID 65532 cannot
        # write allowlist.db. Run as in-guest root — safe, since the SNP VM is the
        # trust boundary and cds is its sole workload.
        runAsUser: 0
        runAsNonRoot: false
      {{- else }}
{{ toYaml .Values.podSecurityContext | indent 8 }}
      {{- end }}
      {{- if and .Values.cds.handoff.peerUrl (not .Values.kata.enabled) }}
        supplementalGroups: [65532]
      {{- end }}
      {{- if .Values.cds.handoff.peerUrl }}
      initContainers:
        {{- $handoffMounts := list -}}
        {{- if eq (include "c8s.attestationApiHostSocket" .) "true" -}}
        {{- $handoffMounts = append $handoffMounts (printf "- name: attestation-api-socket\n  mountPath: %s\n  readOnly: true" .Values.nriImagePolicy.hostPaths.runtimeDir) -}}
        {{- end -}}
        {{- if not .Values.kata.enabled -}}
        {{- $handoffMounts = append $handoffMounts "- name: workload-claims\n  mountPath: /run/c8s/workload-claims\n  readOnly: true" -}}
        {{- end -}}
        {{- $handoffArgs := list "--workload-claims" -}}
        {{- if .Values.kata.enabled -}}
        {{- $handoffArgs = append $handoffArgs "--workload-claims-guest" -}}
        {{- end -}}
        {{- include "c8s.getCertContainers" (dict
          "root" .
          "san" (printf "%s.%s.svc" (include "c8s.cdsName" .) .Release.Namespace)
          "certOut" "/handoff-tls/cert.pem"
          "keyOut" "/handoff-tls/key.pem"
          "caOut" "/handoff-tls/ca.pem"
          "volume" "handoff-tls"
          "mountPath" "/handoff-tls"
          "renewInterval" "1h"
          "keyMode" "0600"
          "runAsUser" (ternary 0 65532 .Values.kata.enabled)
          "runAsGroup" (ternary 0 65532 .Values.kata.enabled)
          "runAsNonRoot" (not .Values.kata.enabled)
          "reloadNginx" "false"
          "extraArgs" $handoffArgs
          "extraMounts" (join "\n" $handoffMounts)
        ) | nindent 8 }}
      {{- end }}
      containers:
        - name: cds
          image: {{ include "c8s.cdsImage" . }}
          imagePullPolicy: {{ .Values.cds.image.pullPolicy }}
          args:
            - --port={{ .Values.cds.port }}
            - --log-level={{ .Values.cds.logLevel }}
            # Per-mode resolution: see c8s.attestationApiURL.
            - --attestation-api-url={{ include "c8s.attestationApiURL" . }}
            - --allowlist-db={{ .Values.cds.allowlistDB }}
            - --allowlist-persistent={{ .Values.cds.persistence.enabled }}
            {{- if eq (include "c8s.serveAllowlistSeed" .) "true" }}
            - --allowlist-seed=/etc/cds/allowlist-seed.json
            {{- end }}
            - --ear-issuer={{ .Values.cds.earIssuer }}
            {{- if .Values.cds.expectedIssuer }}
            - --expected-issuer={{ .Values.cds.expectedIssuer }}
            {{- end }}
            - --jwt-clock-skew={{ .Values.cds.jwtClockSkew }}
            - --ca-common-name={{ .Values.cds.ca.commonName }}
            - --ca-cert-validity={{ .Values.cds.ca.certValidity }}
            - --min-ca-validity={{ .Values.cds.ca.minValidity }}
            - --cert-ttl={{ .Values.cds.certTTL }}
            - --named-cert-ttl={{ .Values.cds.namedCertTTL }}
            - --max-ttl={{ .Values.cds.maxTTL }}
            - --challenge-ttl={{ .Values.cds.challengeTTL }}
            - --request-timeout={{ .Values.cds.requestTimeout }}
            - --max-request-size={{ .Values.cds.maxRequestSize }}
            - --secrets-max-paths={{ include "c8s.positiveInt" (dict "value" .Values.cds.secretsMaxPaths "label" "cds.secretsMaxPaths") }}
            - --secrets-max-paths-per-workload={{ include "c8s.positiveInt" (dict "value" .Values.cds.secretsMaxPathsPerWorkload "label" "cds.secretsMaxPathsPerWorkload") }}
            - --readiness-interval={{ .Values.cds.readinessInterval }}
            - --san-validation={{ .Values.cds.sanValidation }}
            {{- /* Always allow in-cluster Service SANs so the mesh's own
                   get-cert/ratls-mesh CSRs validate; operators append public
                   hostnames via cds.dnsSanPatterns without restating this. */}}
            - --dns-san-pattern={{ include "c8s.cdsDnsSanPattern" . }}
            {{- range .Values.cds.dnsSanPatterns }}
            - --dns-san-pattern={{ . }}
            {{- end }}
            {{- if .Values.cds.cnPattern }}
            - --allowed-cn-pattern={{ .Values.cds.cnPattern }}
            {{- end }}
            {{- if .Values.cds.measurementsConfig }}
            - --measurements-config=/etc/c8s-measurements/cds.json
            {{- else }}
            {{- with .Values.cds.measurements }}
            - --measurements={{ join "," . }}
            {{- end }}
            {{- with .Values.cds.rtmrs }}
            - --rtmrs={{ join "," . }}
            {{- end }}
            {{- end }}
            {{- with .Values.cds.sandboxInventoryCIDRs }}
            - --sandbox-inventory-cidr={{ join "," . }}
            {{- end }}
            {{- if .Values.cds.operatorKeys }}
            - --operator-keys=/etc/cds-operator-keys/keys.pem
            {{- end }}
            {{- if .Values.cds.handoff.enabled }}
            - --handoff-measurements={{ join "," .Values.cds.measurements }}
            - --handoff-successor-workload={{ .Values.cds.handoff.successorWorkload }}
            - --handoff-endpoint-drain-delay={{ .Values.cds.handoff.endpointDrainDelay }}
            - --handoff-transfer-lease={{ .Values.cds.handoff.transferLease }}
            {{- with .Values.cds.rtmrs }}
            - --handoff-rtmrs={{ join "," . }}
            {{- end }}
            {{- end }}
            {{- with (include "c8s.cdsHandoffPeerURL" .) }}
            - --handoff-peer-url={{ . }}
            - --handoff-client-cert=/handoff-tls/cert.pem
            - --handoff-client-key=/handoff-tls/key.pem
            {{- end }}
            {{- if .Values.cds.teeWebPKI.enabled }}
            - --tee-webpki
            - --tee-webpki-workload={{ .Values.cds.teeWebPKI.workload }}
            {{- end }}
            - --token-signer-rotation-interval={{ .Values.cds.tokenSignerRotationInterval }}
            - --token-signer-overlap={{ .Values.cds.tokenSignerOverlap }}
            - --token-signer-rotation-jitter={{ .Values.cds.tokenSignerRotationJitter }}
            - --rate-limit={{ .Values.cds.rateLimit }}
            - --rate-burst={{ .Values.cds.rateBurst }}
            - --rate-limiter-max-entries={{ .Values.cds.rateLimiterMaxEntries }}
            - --rate-limiter-evict-interval={{ .Values.cds.rateLimiterEvictInterval }}
            - --rate-limiter-idle-timeout={{ .Values.cds.rateLimiterIdleTimeout }}
            - --ratls-platform={{ .Values.cds.ratlsPlatform }}
            - --ratls-cert-ttl={{ .Values.cds.ratlsCertTTL }}
          ports:
            - name: https
              containerPort: {{ .Values.cds.port }}
          {{- if .Values.cds.handoff.peerUrl }}
          # Adoption blocks startup (no listener yet) up to --handoff-peer-timeout
          # (2m default); hold liveness off until the port opens or it gets
          # killed mid-pull. 30x10s covers the deadline with slack.
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            failureThreshold: 30
          {{- end }}
          {{- if .Values.kata.enabled }}
          # CDS accepts a client with no certificate on public health routes.
          # The kubelet HTTPS probe does not verify the private RA-TLS server
          # certificate. Use /readyz instead of TCP so a draining predecessor
          # leaves Service endpoints before it stops read service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 1
            failureThreshold: 1
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 30
          {{- else }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 30
          {{- end }}
          resources:
{{ toYaml .Values.cds.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- include "c8s.attestationApiSocketMount" . | nindent 12 }}
            {{- if eq (include "c8s.serveAllowlistSeed" .) "true" }}
            - name: allowlist-seed
              mountPath: /etc/cds
              readOnly: true
            {{- end }}
            {{- if .Values.cds.operatorKeys }}
            - name: operator-keys
              mountPath: /etc/cds-operator-keys
              readOnly: true
            {{- end }}
            {{- if .Values.cds.measurementsConfig }}
            - name: measurements-config
              mountPath: /etc/c8s-measurements
              readOnly: true
            {{- end }}
            {{- if .Values.cds.handoff.peerUrl }}
            - name: handoff-tls
              mountPath: /handoff-tls
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          {{- if .Values.kata.enabled }}
            runAsUser: 0
            runAsNonRoot: false
          {{- else }}
            runAsNonRoot: true
            runAsUser: 65532
          {{- end }}
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          {{- if .Values.cds.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "c8s.cdsName" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "c8s.attestationApiSocketVolume" . | nindent 8 }}
        {{- if .Values.cds.handoff.peerUrl }}
        - name: handoff-tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if not .Values.kata.enabled }}
        - name: workload-claims
          hostPath:
            path: {{ .Values.nriImagePolicy.hostPaths.runtimeDir }}
            type: Directory
        {{- end }}
        {{- end }}
        {{- if eq (include "c8s.serveAllowlistSeed" .) "true" }}
        - name: allowlist-seed
          configMap:
            name: {{ include "c8s.cdsName" . }}-allowlist-seed
        {{- end }}
        {{- if .Values.cds.operatorKeys }}
        - name: operator-keys
          configMap:
            name: {{ include "c8s.cdsName" . }}-operator-keys
        {{- end }}
        {{- if .Values.cds.measurementsConfig }}
        - name: measurements-config
          configMap:
            name: {{ include "c8s.fullname" . }}-measurements
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  {{- if .Values.kata.enabled }}
  # Headless under kata so cluster DNS returns the cds pod IP, not a Service
  # ClusterIP. The in-guest ratls-mesh's outbound proxy reads the workload's
  # SO_ORIGINAL_DST and dials <that-ip>:15006 (the peer mesh's inbound
  # listener); a Service ClusterIP has no port-15006 endpoint, so the dial
  # times out (see ratls_mesh_tls_dial_failures_total). A pod IP routes
  # straight to the peer VM, where PREROUTING redirects port 15006 to the
  # local mesh inbound. NodePort is unused under kata anyway — install --cvm-mode=pod
  # disables nriImagePolicy, the only consumer of cds NodePort.
  type: ClusterIP
  clusterIP: None
  {{- else }}
  type: {{ .Values.cds.service.type }}
  {{- end }}
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cds
  ports:
    - name: http
      port: {{ .Values.cds.port }}
      targetPort: https
      {{- if and (not .Values.kata.enabled) (eq .Values.cds.service.type "NodePort") .Values.cds.service.nodePort }}
      nodePort: {{ .Values.cds.service.nodePort }}
      {{- end }}
{{- if .Values.cds.handoff.enabled }}
---
# This headless Service stays resolvable while the selected predecessor is
# NotReady. Only handoff control traffic uses it. The client pins the exact
# predecessor address that returned the encrypted state.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.cdsName" . }}-handoff
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds-handoff
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cds
  ports:
    - name: https
      port: {{ .Values.cds.port }}
      targetPort: https
{{- end }}
