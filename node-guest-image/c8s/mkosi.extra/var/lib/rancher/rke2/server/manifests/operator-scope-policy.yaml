# Keeps the baked guards out of reach of every credential cred-release issues.
# Any principal in a `c8s:` group (c8s:node-operators, c8s:log-readers) is
# denied, in admission and regardless of RBAC, every write that could disable
# a guard or reach the host:
#   - anything in the PodSecurity-exempt namespaces (kube-system,
#     local-path-storage), where a pod, a HelmChart, a service-account token
#     secret or an edited DaemonSet is root on the node;
#   - cluster-scoped RBAC, admission policies and webhooks, HelmChart/Addon
#     CRs (helm-controller applies them with full authority), storage classes
#     and PersistentVolumes (a hostPath or nodePath volume escapes restricted
#     PodSecurity through a PVC), API registration, CSR approval, Node
#     objects;
#   - the kubelet-proxy subresources (nodes/proxy, pods/proxy,
#     services/proxy) that reach the kubelet's exec endpoint without a
#     pods/exec admission check.
# cred-release-rbac.yaml already omits all of this from the operator role;
# this policy is the second, independent layer so neither an RBAC mistake
# nor a tenant RoleBinding the operator writes can widen it. The expression
# short-circuits for every other principal, so system components and the
# rke2 admin kubeconfig are unaffected. Total by construction: every field
# read is guarded with has(), so failurePolicy Fail cannot deny on an
# evaluation error. cred-release.service waits for both objects and proves
# the deny path with a server-side dry-run before it serves (psa-ready.sh).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: confos-operator-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*", "*/*"]
  variables:
    - name: fromCredRelease
      expression: "(has(request.userInfo.groups) ? request.userInfo.groups : []).exists(g, g.startsWith('c8s:'))"
    - name: ns
      expression: "has(request.namespace) ? request.namespace : ''"
    - name: group
      expression: "request.resource.group"
    - name: resource
      expression: "request.resource.resource"
    - name: sub
      expression: "has(request.subResource) ? request.subResource : ''"
  validations:
    - expression: "!variables.fromCredRelease || !(variables.ns in ['kube-system', 'local-path-storage'])"
      message: "c8s credentials may not write in the PodSecurity-exempt namespaces (kube-system, local-path-storage)"
    - expression: >-
        !variables.fromCredRelease ||
        !(variables.group in ['admissionregistration.k8s.io', 'helm.cattle.io', 'k3s.cattle.io', 'storage.k8s.io', 'apiregistration.k8s.io', 'certificates.k8s.io'])
      message: "c8s credentials may not write admission policies, HelmCharts, storage classes, API registrations or certificate requests"
    - expression: >-
        !variables.fromCredRelease ||
        !(variables.group == 'rbac.authorization.k8s.io' && variables.resource in ['clusterroles', 'clusterrolebindings'])
      message: "c8s credentials may not write cluster-scoped RBAC"
    - expression: >-
        !variables.fromCredRelease ||
        !(variables.group == '' && variables.resource in ['persistentvolumes', 'nodes'])
      message: "c8s credentials may not write PersistentVolumes or Nodes"
    - expression: >-
        !variables.fromCredRelease ||
        !(variables.group == '' && variables.resource in ['nodes', 'pods', 'services'] && variables.sub == 'proxy')
      message: "c8s credentials may not use the proxy subresources"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: confos-operator-scope
spec:
  policyName: confos-operator-scope
  validationActions:
    - Deny
