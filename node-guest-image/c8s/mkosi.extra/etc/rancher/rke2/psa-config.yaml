# PodSecurity admission config applied via
# /etc/rancher/rke2/config.yaml: pod-security-admission-config-file=...
#
# Restricted enforcement by default. kube-system and local-path-storage are
# exempt (they ship privileged daemonsets / hostPath helpers); add more
# namespaces here for any privileged platform component you deploy. Every
# other namespace, `default` included, inherits restricted. The baked
# ../../../var/lib/rancher/rke2/server/manifests/psa-level-policy.yaml stops
# a namespace label from lowering that level unless the caller may grant
# PodSecurity exemptions. Namespaces hosting confidential workloads need that
# grant in node mode because the injected sidecar mounts a hostPath. The chart
# then restores Restricted semantics with a fail-closed VAP whose sole volume
# exception is that exact read-only mount on webhook-owned sidecars; the
# privileged label is compatibility plumbing, not workload privilege. See
# node-guest-image/README.md, "Workload isolation".
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: "restricted"
        enforce-version: "latest"
        audit: "restricted"
        audit-version: "latest"
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces:
          - kube-system
          - local-path-storage
