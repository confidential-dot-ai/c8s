# Directories this profile needs writable under confos's immutable root
# (one path per line, relative to /; read by the confos initrd, which gives
# each an ephemeral overlay backed by the scratch disk). Everything else
# outside /var, /home, /root and /tmp refuses writes.
#
# rke2 writes its kubeconfig (rke2.yaml) and node/password here at runtime,
# and rke2-role.sh / gpu-node-label.sh drop fragments into config.yaml.d.
# The directory itself is baked (config.yaml, 50-platform.yaml), so the
# baked files stay visible through the overlay.
etc/rancher
