# Org-wide confidential runner scale set. githubConfigUrl = the ORG (not a repo)
# is what makes these runners available across every repo in the org (scoped by
# the runner group). Auth is a GitHub App installed on the org.
#
# helm install confidential-e2e \
#   oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#   --version 0.14.2 -n arc-runners --create-namespace \
#   --set githubConfigUrl="https://github.com/<ORG>" \
#   --set githubConfigSecret.github_app_id="<APP_ID>" \
#   --set githubConfigSecret.github_app_installation_id="<INSTALL_ID>" \
#   --set-file githubConfigSecret.github_app_private_key="<path/to/app-private-key.pem>" \
#   --set runnerGroup="confidential" \
#   -f values-org.yaml
#
# Repos in the org then use:  runs-on: confidential-e2e

minRunners: 0                      # scale to zero when idle (no warm-runner cost).
                                   # set 1 for a warm pool if you want instant dispatch
                                   # (scale-from-zero adds a little latency, not a blocker).
maxRunners: 5
runnerGroup: confidential          # the org runner group that scopes access
# NOTE: repos using this scale set must be PRIVATE/internal — GitHub won't
# dispatch self-hosted runners on public repos (see MONITORING.md).

template:
  spec:
    serviceAccountName: arc-gcp-e2e        # WIF → GCP SA for Model B provisioning
    # Pin runner pods to the builder node pool (size for Rust release builds —
    # e2-standard-4+, see MONITORING.md). e2-medium is too small for release/audit.
    nodeSelector:
      cloud.google.com/gke-nodepool: builders
    containers:
      - name: runner
        # Set per account — see config.env.example ($RUNNER_IMAGE), or pass via
        # --set template.spec.containers[0].image=...
        image: REGISTRY/confidential-runner-gcp:latest
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        # Right-size so two builds don't thrash one node. Tune to the node pool.
        resources:
          requests: { cpu: "2",  memory: 4Gi }
          limits:   { cpu: "4",  memory: 8Gi }
        env:
          - { name: GCP_PROJECT, value: "conf-500518" }   # set per account (config.env)
          - { name: GCP_REGION,  value: "us-central1" }    # set per account (config.env)
          - { name: CONF_TYPE,   value: "sev" }   # sev (broad) | sev_snp | tdx
