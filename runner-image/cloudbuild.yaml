# Build the gcloud-equipped runner image natively (amd64) in Cloud Build and
# push to Artifact Registry — no local emulation. The GKE host's nodes pull it.
# Portable: the image path is derived from the build's own $PROJECT_ID + the
# substitutions below, so it targets whatever GCP project you run it in (no
# hardcoded project).
#
#   gcloud builds submit runner-image --config runner-image/cloudbuild.yaml \
#     --project "$GCP_PROJECT" \
#     --substitutions=_REGION=us-central1,_REPO=confidential-ci,_IMAGE=confidential-runner-gcp,_TAG=latest
#
# (the AR repo must exist first:
#   gcloud artifacts repositories create "$_REPO" \
#     --repository-format=docker --location="$_REGION" --project "$GCP_PROJECT")
substitutions:
  _REGION: us-central1
  _REPO: confidential-ci
  _IMAGE: confidential-runner-gcp
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.gcp
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
