# Static mutation-testing policy; per-run inputs (diff base, output paths) are
# flags in scripts/mutation-check.sh.
unleash:
  exclude-files:
    # helmchart tests exec a real helm binary the mutation CI job does not
    # install; deepcopy is generated code; test/ holds mock servers whose
    # mutants grade the fixtures, not the product.
    - "internal/helmchart/.*"
    - "api/v1alpha2/zz_generated.deepcopy.go"
    - "test/.*"
