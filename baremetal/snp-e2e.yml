name: snp-e2e
on: [push, workflow_dispatch]
jobs:
  snp-e2e:
    runs-on: confidential-bm
    steps:
      - uses: actions/checkout@v4
      - name: install kubectl
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl && echo "$PWD" >> "$GITHUB_PATH"
      - name: launch confidential SEV-SNP VM (per-run clone; refs from base-image-refs, else discovered)
        run: |
          set -euo pipefail
          VM="bm-e2e-snp-${GITHUB_RUN_ID}"; echo "VM=$VM" >> "$GITHUB_ENV"
          SIDECAR=""; IGVM=""
          # Prefer the producer-published single source of truth (the base-image-refs
          # ConfigMap, published by confidential-metal's base-image-rootdisk role —
          # merged in PR #60). Until the playbook next runs against this cluster the
          # CM may not exist (or we can't read it) — fall back to discovering the
          # current base PVC and the manifest defaults.
          if kubectl -n confai-images get cm base-image-refs >/dev/null 2>&1; then
            ROOTPVC=$(kubectl -n confai-images get cm base-image-refs -o jsonpath='{.data.rootPvc}')
            SIDECAR=$(kubectl -n confai-images get cm base-image-refs -o jsonpath='{.data.sidecarImage}')
            PAT=$(kubectl -n confai-images get cm base-image-refs -o jsonpath='{.data.igvmFilePattern}')
            IGVM="${PAT/\{cores\}/2}"
            echo "base-image-refs: pvc=$ROOTPVC sidecar=$SIDECAR igvm=$IGVM"
          else
            mapfile -t PVCS < <(kubectl -n confai-images get pvc -o name --sort-by=.metadata.creationTimestamp | grep -o 'cpu-image-rootdisk-[a-z0-9]*')
            [ "${#PVCS[@]}" -ge 1 ] || { echo "::error::no base-image-refs CM and no cpu-image-rootdisk-* PVC"; exit 1; }
            ROOTPVC="${PVCS[-1]}"
            echo "::warning::base-image-refs ConfigMap not found; falling back to discovered PVC $ROOTPVC + manifest defaults"
          fi
          # render: unique VM name + resolved rootPvc; override sidecar/igvm only when the CM provided them
          M=$(sed "s/bm-e2e-snp/${VM}/g; s/cpu-image-rootdisk-0df2ca7d5549/${ROOTPVC}/" snp-vm-e2e.yaml)
          [ -n "$SIDECAR" ] && M=$(printf '%s' "$M" | sed "s#ghcr.io/[^\"']*igvm-hook-sidecar@sha256:[a-f0-9]*#${SIDECAR}#")
          [ -n "$IGVM" ] && M=$(printf '%s' "$M" | sed "s/guest-smp2\.igvm/${IGVM}/")
          printf '%s\n' "$M" | kubectl apply -f -
      - name: wait for VMI Running (clone then boot)
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            phase=$(kubectl -n confai-images get vmi "$VM" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            dv=$(kubectl -n confai-images get dv "${VM}-root" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "[$i] clone=$dv VMI=$phase"
            [ "$phase" = Running ] && break
            sleep 6
          done
          test "$phase" = Running
      - name: assert GENUINE SEV-SNP guest on the clone
        run: |
          set -euo pipefail
          pod=$(kubectl -n confai-images get pods --no-headers | grep "virt-launcher-${VM}" | awk '{print $1}' | head -1)
          echo "launcher pod: $pod"
          cmd=$(kubectl -n confai-images exec "$pod" -c compute -- bash -lc "cat /proc/*/cmdline 2>/dev/null | tr '\0' '\n'")
          echo "$cmd" | grep -q 'sev-snp-guest'
          echo "$cmd" | grep -Eq 'guest-smp[0-9]+\.igvm'
          kubectl -n confai-images get vmi "$VM" -o jsonpath='{.spec.volumes[?(@.name=="rootdisk")].dataVolume.name}' | grep -q "${VM}-root"
          echo "PASS: genuine SEV-SNP + IGVM, per-run clone of the live base"
      - name: attest + verify (real SNP report -> attestation-cli)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libtss2-dev ca-certificates
          curl -fsSL https://github.com/confidential-dot-ai/attestation-rs/releases/download/v0.4.0/attestation-cli -o attestation-cli
          chmod +x attestation-cli
          IP=$(kubectl -n confai-images get vmi "$VM" -o jsonpath='{.status.interfaces[0].ipAddress}')
          echo "guest /attest endpoint: $IP:8400"
          head -c 32 /dev/urandom > n.bin
          B64=$(base64 -w0 n.bin); HEX=$(od -An -tx1 n.bin | tr -d ' \n')
          echo "nonce(hex)=$HEX"
          curl -s -m20 -H 'Content-Type: application/json' -d "{\"report_data\":\"$B64\"}" "http://$IP:8400/attest" -o att.json -w 'POST /attest -> HTTP %{http_code}, %{size_download} bytes\n'
          echo "=== attestation-cli verify ==="
          ./attestation-cli verify --expected-report-data "$HEX" < att.json | tee claims.json
          grep -Eq '"platform"[: ]+"snp"' claims.json
          grep -Eq '"signature_valid"[: ]+true' claims.json
          echo "ATTESTED: genuine SEV-SNP report, signature valid, report_data == our nonce"
      - name: teardown (VM owns the clone -> GC'd)
        if: always()
        run: kubectl -n confai-images delete vm "${VM:-bm-e2e-snp-$GITHUB_RUN_ID}" --ignore-not-found --wait=false
