# Egress hardening for bare-metal runner pods (Cilium / #6).
#
# CI runners legitimately need broad INTERNET egress (crates.io, ghcr, github,
# dl.k8s.io, arbitrary deps), so a tight FQDN allowlist would break builds. The
# value here is cutting LATERAL movement: a job may reach DNS, the kube-apiserver
# (the E2E uses kubectl), and the public internet — but NOT other in-cluster pods
# /services or node-local endpoints. Default-deny applies once this selects a pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner-egress
  namespace: arc-runners
spec:
  endpointSelector: {}            # all runner pods in arc-runners
  egress:
    - toEndpoints:                # DNS only to kube-dns/CoreDNS
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities:                 # K8s API server (kubectl in the E2E job)
        - kube-apiserver
    - toEntities:                 # the public internet (CI dependency fetches)
        - world
    - toEndpoints:                # narrow carve-out: the confidential VM's /attest
        - matchLabels:            # endpoint (attestation-api) AND the in-CVM RKE2
            k8s:io.kubernetes.pod.namespace: confai-images   # kube-apiserver (c8s e2e)
      toPorts:
        - ports:
            - { port: "8400", protocol: TCP }
            - { port: "6443", protocol: TCP } # in-CVM kube-apiserver (bridge = pod identity)
  # NOT allowed (default-deny): other in-cluster pods/services/ports, remote nodes,
  # host-local endpoints → blocks east-west / lateral movement from a CI job. The
  # only east-west exceptions are confai-images:8400 (attestation) and :6443 (the
  # nested CVM cluster's API, needed by the c8s e2e's kubectl/helm/install).
