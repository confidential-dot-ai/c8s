# Confidential SEV-SNP target VM for the Model-A bare-metal E2E. The runner
# applies this into confai-images, waits for the VMI to reach Running, asserts
# the guest is a real sev-snp-guest (+ IGVM measured boot), then deletes it.
#
# CONFIRMED WORKING on github-runner-dev: boots a genuine SEV-SNP guest — qemu
# runs with confidential-guest-support + a {"qom-type":"sev-snp-guest",...} object
# and igvm-cfg file guest-smp2.igvm.
#
# #8 — per-run CDI clone: instead of mounting the shared RWO base rootdisk
# directly, dataVolumeTemplates CLONES it into a fresh per-run PVC. So the VM never
# mounts the canonical base image (no Multi-Attach, no risk to it), and concurrent
# runs don't serialize. The clone is byte-preserving, so the IGVM/verity
# measurement still matches (verified: cloned VM boots as a real sev-snp-guest).
# The clone is owned by the VM → deleting the VM GCs it.
#
# The snp-e2e workflow sed-replaces "bm-e2e-snp" with a per-run unique name so
# concurrent runs are fully isolated. Sidecar pinned to confidential-dot-ai
# directly (independent of the bare-metal repo's stale chart default).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bm-e2e-snp
  namespace: confai-images
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: bm-e2e-snp-root
      spec:
        source:
          pvc:
            namespace: confai-images
            name: cpu-image-rootdisk-0df2ca7d5549   # the verity base; clone is byte-preserving
        storage:
          accessModes: [ReadWriteOnce]
          volumeMode: Filesystem
          storageClassName: local-path
          resources:
            requests:
              storage: 6Gi                            # >= base (4Gi) + filesystem overhead
  template:
    metadata:
      labels: { vm.kubevirt.io/name: bm-e2e-snp }
      annotations:
        igvm.lunal.dev/file: "guest-smp2.igvm"          # cores=2 -> guest-smp2.igvm
        hooks.kubevirt.io/hookSidecars: '[{"image":"ghcr.io/confidential-dot-ai/igvm-hook-sidecar@sha256:7450bb136bfc4d9434a7c1eb9e478ab3237e7d9acf5c211e7d080f2008b01ba0","imagePullPolicy":"Always","args":["--version","v1alpha3"],"pvc":{"name":"igvm-files","volumePath":"/igvm","sharedComputePath":"/var/run/igvm"}}]'
    spec:
      nodeSelector: { lunal.dev/sev-snp: "true" }
      domain:
        cpu: { model: EPYC-Genoa, cores: 2 }       # cores power-of-2 for SNP
        memory: { guest: 4Gi }
        resources: { requests: { memory: 4Gi } }
        firmware: { bootloader: { efi: { secureBoot: false } } }
        launchSecurity: { snp: {} }                # the confidential bit
        devices:
          disks: [ { disk: { bus: virtio }, name: rootdisk } ]
          interfaces: [ { bridge: {}, name: default } ]   # masquerade is broken under SNP
          rng: {}
      networks: [ { name: default, pod: {} } ]
      volumes:
        - name: rootdisk
          dataVolume: { name: bm-e2e-snp-root }    # the per-run clone, not the shared base
