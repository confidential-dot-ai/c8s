# A plain workload with no c8s opt-in, adopted into the mesh by
# `c8s install --workload-ref web=adopted/deployment/web:8080 --upstream web`
# during the harness's upgrade step.
apiVersion: v1
kind: Namespace
metadata:
  name: adopted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: adopted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged@sha256:daa17b944bac2b578e962da4c61ad72a59233b3c63abea17113acaf4e6b9aea4 # 1.30-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
