version: "2"

linters:
  enable:
    - unused
  exclusions:
    presets:
      - std-error-handling
    rules:
      - text: "Shutdown|Rollback|io\\.Copy\\(io\\.Discard|CloseWrite|pem\\.Encode"
        linters:
        - errcheck
      - path: '(.+)_test\.go'
        linters:
        - errcheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Sscanf
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - io.Copy

formatters:
  enable:
    - gci
  settings:
    gci:
      # Standard library, then third-party, then our own modules
      # (attestation-go and c8s share the last group).
      sections:
        - standard
        - default
        - prefix(github.com/confidential-dot-ai)
